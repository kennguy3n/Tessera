[package]
name = "tessera_bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "N-API bridge between Electron and the Tessera Rust core."

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
tessera_core = { path = "../tessera_core" }
tessera_sources = { path = "../tessera_sources" }
tessera_templates = { path = "../tessera_templates" }
tessera_artifacts = { path = "../tessera_artifacts" }
tessera_citations = { path = "../tessera_citations" }
tessera_export = { path = "../tessera_export" }
tessera_audit = { path = "../tessera_audit" }
tessera_runtime = { path = "../tessera_runtime" }
tokio = { workspace = true, features = ["rt"] }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
regex = { workspace = true }
napi = { version = "2", features = ["napi6", "serde-json"] }
napi-derive = "2"


[build-dependencies]
napi-build = "2"

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
