[package]
name = "tessera_runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Local model runtime management for Tessera"

[dependencies]
tessera_core = { path = "../tessera_core" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["process", "time", "sync", "rt"] }
reqwest = { version = "0.12", features = ["json", "stream"], default-features = false, optional = true }
futures-util = { workspace = true, optional = true }
thiserror = { workspace = true }
base64 = { workspace = true }

[features]
default = ["http"]
http = ["reqwest", "futures-util"]

[dev-dependencies]
tempfile = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = { workspace = true }

[lints]
workspace = true
