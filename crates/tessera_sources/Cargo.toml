[package]
name = "tessera_sources"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Source management, file indexing, text extraction, chunking, and hybrid search for Tessera."

[dependencies]
tessera_core = { path = "../tessera_core" }
tessera_migrate = { path = "../tessera_migrate" }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
blake3 = { workspace = true }
rusqlite = { workspace = true }
walkdir = { workspace = true }
notify = { workspace = true }
pulldown-cmark = { workspace = true }
calamine = { workspace = true }
ignore = { workspace = true }
kamadak-exif = { workspace = true }
image = { workspace = true }
lopdf = { workspace = true }
aes-gcm = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }
rayon = { workspace = true }
# ONNX Runtime + HuggingFace tokenizers for the
# semantic embedding providers (English MiniLM and multilingual XLM-R
# distillates). Used by `onnx_embedder.rs` and `model_registry.rs`.
# `reqwest` is shared with the rest of the workspace for the model
# download path.
ort = { workspace = true }
tokenizers = { workspace = true }
ndarray = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
tokio = { workspace = true, features = ["fs", "io-util"] }
futures-util = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "rt-multi-thread"] }

[[bench]]
name = "indexing_bench"
harness = false

[[bench]]
name = "search_bench"
harness = false

[lints]
workspace = true
