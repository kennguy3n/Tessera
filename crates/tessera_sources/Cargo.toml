[package]
name = "tessera_sources"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Source management, file indexing, text extraction, chunking, and hybrid search for Tessera."

[dependencies]
tessera_core = { path = "../tessera_core" }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
blake3 = { workspace = true }
rusqlite = { workspace = true }
walkdir = { workspace = true }
notify = { workspace = true }
pulldown-cmark = { workspace = true }
calamine = { workspace = true }
ignore = { workspace = true }
kamadak-exif = { workspace = true }
image = { workspace = true }
lopdf = { workspace = true }
aes-gcm = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }
rayon = { workspace = true }

# macOS-only: `mem::current_rss_bytes()` calls `getrusage(2)` via
# the libc crate. Other platforms read `/proc/self/status` or
# return `None`, so the dependency is gated to macOS to keep the
# Linux / Windows build trees clean.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "indexing_bench"
harness = false

[[bench]]
name = "search_bench"
harness = false

[lints]
workspace = true
