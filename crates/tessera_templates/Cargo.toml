[package]
name = "tessera_templates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Template parsing, validation, and registry for Tessera artifact templates."

[dependencies]
tessera_core = { path = "../tessera_core" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
walkdir = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Used by `tests/bundled_templates.rs::every_bundled_template_validates_against_json_schema`
# to enforce that the published `schemas/template.schema.json` and the
# on-disk YAML files cannot drift apart. `default-features = false`
# disables the optional HTTP remote-$ref resolver (and its reqwest /
# hyper tree) — the local file-system schema needs no network access.
jsonschema = { version = "0.17", default-features = false }

[lints]
workspace = true
