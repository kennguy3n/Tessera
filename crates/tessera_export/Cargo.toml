[package]
name = "tessera_export"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Export engine for Tessera artifacts — Markdown, HTML, and CSV."

[dependencies]
tessera_core = { path = "../tessera_core" }
tessera_artifacts = { path = "../tessera_artifacts" }
tessera_citations = { path = "../tessera_citations" }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
zip = { workspace = true }
docx-rs = "0.4"
rust_xlsxwriter = "0.95"
typst = { version = "0.12", optional = true }
typst-pdf = { version = "0.12", optional = true }
typst-svg = { version = "0.12", optional = true }
typst-assets = { version = "0.12", features = ["fonts"], optional = true }
comemo = { version = "0.4", optional = true }
ecow = { version = "0.2", optional = true }

[features]
# `typst` is on by default so the production PDF
# pipeline can embed Mermaid diagrams as SVG. Callers that need the
# minimal hand-rolled PDF (no Typst, no diagrams, no system fonts)
# can opt out via `default-features = false` and explicitly enable
# only `pdf`, `docx`, `xlsx`.
default = ["pdf", "docx", "xlsx", "typst"]
pdf = []
docx = []
xlsx = []
typst = ["dep:typst", "dep:typst-pdf", "dep:typst-svg", "dep:typst-assets", "dep:comemo", "dep:ecow"]

[dev-dependencies]
tempfile = { workspace = true }
blake3 = { workspace = true }
# Streaming OOXML parser for the DOCX regression
# suite (validates required `<w:p>`, `<w:tbl>`, `<w:tr>`, `<w:tc>`,
# `<w:body>` elements in exported documents).
quick-xml = { workspace = true }
# Parse deterministic UUID literals for fixed
# citation source ids in the DOCX golden-fixture suite (the production
# `SourceId::new` allocates a random v4 each call, which would break
# byte stability across runs).
uuid = { workspace = true }

[lints]
workspace = true
