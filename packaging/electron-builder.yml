appId: com.tessera.desktop
productName: Tessera
directories:
  buildResources: build
  output: dist

files:
  - "apps/desktop/dist/**/*"
  - "apps/desktop/electron/**/*.js"
  - "native/**/*.node"
  - "templates/**/*"
  - "schemas/**/*"
  - "package.json"

extraResources:
  - from: "sidecars/llama-server/"
    to: "sidecars/llama-server/"
    filter:
      - "**/*"
  - from: "templates/"
    to: "templates/"
    filter:
      - "**/*.yaml"
      - "**/*.yml"

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: packaging/macos/entitlements.mac.plist
  entitlementsInherit: packaging/macos/entitlements.mac.plist
  icon: build/icon.icns
  # Code signing — set these env vars in CI:
  # CSC_LINK: path to .p12 certificate
  # CSC_KEY_PASSWORD: certificate password
  # APPLE_ID: Apple ID for notarization
  # APPLE_APP_SPECIFIC_PASSWORD: app-specific password

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  # Code signing — set these env vars in CI:
  # CSC_LINK: path to .pfx certificate
  # CSC_KEY_PASSWORD: certificate password

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  deleteAppDataOnUninstall: false

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Office
  icon: build/icons

publish: null
