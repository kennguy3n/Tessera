appId: com.tessera.desktop
productName: Tessera

# Ship only the en-US Electron/Chromium locale pack. Tessera has no
# in-app internationalization framework (no i18next / react-intl /
# lingui dependency, no locale catalogs) and renders an English-only
# UI, so the ~50 other `locales/*.pak` files Electron bundles by
# default are dead weight in every installer. `electronLanguages`
# prunes them at pack time, trimming the installed footprint with no
# user-visible behaviour change. Applies to all platforms (on macOS it
# filters `*.lproj`; on Windows/Linux it filters `locales/*.pak`).
electronLanguages:
  - en-US

directories:
  buildResources: build
  output: dist

# Vite emits the renderer bundle to `apps/desktop/renderer-dist/`, and
# `tsc -p tsconfig.electron.json` emits the Electron main + preload bundles to
# `apps/desktop/dist-electron/`. Both directories must be packaged; the source
# `apps/desktop/electron/**/*.ts` is intentionally NOT shipped.
files:
  - "apps/desktop/renderer-dist/**/*"
  - "apps/desktop/dist-electron/**/*"
  - "native/**/*.node"
  - "templates/**/*"
  - "schemas/**/*"
  - "package.json"

extraResources:
  - from: "sidecars/llama-server/"
    to: "sidecars/llama-server/"
    filter:
      - "**/*"
  - from: "templates/"
    to: "templates/"
    filter:
      - "**/*.yaml"
      - "**/*.yml"

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: packaging/macos/entitlements.mac.plist
  entitlementsInherit: packaging/macos/entitlements.mac.plist
  icon: build/icon.icns
  # Code signing — set these env vars in CI:
  # CSC_LINK: path to .p12 certificate
  # CSC_KEY_PASSWORD: certificate password
  # APPLE_ID: Apple ID for notarization
  # APPLE_APP_SPECIFIC_PASSWORD: app-specific password

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  # Code signing — set these env vars in CI:
  # CSC_LINK: path to .pfx certificate
  # CSC_KEY_PASSWORD: certificate password

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  deleteAppDataOnUninstall: false
  # Emit the per-installer `.blockmap` (and a differential-capable
  # package) alongside the NSIS `.exe`. electron-updater reads the
  # published blockmap to perform a delta download on update. This is
  # the default, but we set it explicitly so the delta-update path
  # (paired with `disableDifferentialDownload = false` in
  # apps/desktop/electron/autoUpdater.ts) is documented and can't be
  # turned off implicitly. (AppImage embeds its blockmap into the
  # binary automatically, so no equivalent Linux knob is needed.)
  differentialPackage: true

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
  category: Office
  icon: build/icons
  desktop:
    entry:
      Name: Tessera
      Comment: Local-first productivity workspace for documents, slides, sheets, and bases
      GenericName: Productivity Workspace
      Categories: Office;Utility;
      MimeType: application/x-tessera-artifact;
      Keywords: productivity;documents;slides;sheets;notes;
      StartupWMClass: Tessera
  synopsis: Local-first productivity workspace
  description: |
    Tessera is a local-first open-source productivity workspace for creating
    documents, slides, sheets, and bases from your own files and connected
    sources. Indexes content on-device and generates source-backed drafts
    using local model inference.

appImage:
  artifactName: ${productName}-${version}-${arch}.AppImage

deb:
  artifactName: ${productName}_${version}_${arch}.deb
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libsecret-1-0
    - libdrm2
    - libgbm1

rpm:
  artifactName: ${productName}-${version}.${arch}.rpm
  depends:
    - libnotify
    - libXScrnSaver
    - libsecret

publish: null
