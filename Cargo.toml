[workspace]
resolver = "2"
members = [
    "crates/tessera_core",
    "crates/tessera_migrate",
    "crates/tessera_bridge",
    "crates/tessera_sources",
    "crates/tessera_templates",
    "crates/tessera_artifacts",
    "crates/tessera_citations",
    "crates/tessera_export",
    "crates/tessera_audit",
    "crates/tessera_runtime",
    "crates/tessera_connectors",
    "crates/tessera_substrate",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/kennguy3n/Tessera"

[workspace.dependencies]
thiserror = "1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# Bumped to 0.36 to unify `libsqlite3-sys` (which declares `links =
# "sqlite3"`) with the `kennguy3n/knowledge` substrate crates
# (`evidence_store`, `concept_graph`) pulled in via git below. Two
# SemVer-incompatible `libsqlite3-sys` versions both bundling SQLCipher
# cannot coexist in one build graph (Cargo rejects duplicate `links`),
# so the whole workspace tracks the substrate's pinned `0.36` line.
# `blob` matches the substrate's feature set; `bundled-sqlcipher-
# vendored-openssl` keeps the single statically-linked SQLCipher build.
rusqlite = { version = "0.36", features = ["bundled-sqlcipher-vendored-openssl", "blob"] }

# --- kennguy3n/knowledge substrate (git, pinned) ---------------------
# Additive native layer. Pinned to a specific rev so substrate builds
# are reproducible; bump deliberately. All six entry crates resolve
# their intra-repo `path` deps (crypto, inference_router, evidence_
# store, memory_manager) from the same git checkout automatically.
# Pinned to the snapshot-API rev (knowledge#220) so the substrate can
# produce consistent encrypted backups of its sibling DBs.
#
# Single source of truth for the upstream `crypto` crate across the whole
# workspace: the substrate (evidence/observation/memory/concept) AND the
# Session-7 post-quantum layer (tessera_core/tessera_sources/tessera_export)
# both depend on this one alias/rev, so only ONE copy of `crypto` (and its
# ML-KEM/ML-DSA transitive tree) is ever compiled and audited.
knowledge_crypto = { package = "crypto", git = "https://github.com/kennguy3n/knowledge", rev = "02050cd1aada1dbbdb83de320f69abaf6a87a361" }
evidence_store = { git = "https://github.com/kennguy3n/knowledge", rev = "02050cd1aada1dbbdb83de320f69abaf6a87a361" }
observation_engine = { git = "https://github.com/kennguy3n/knowledge", rev = "02050cd1aada1dbbdb83de320f69abaf6a87a361" }
memory_manager = { git = "https://github.com/kennguy3n/knowledge", rev = "02050cd1aada1dbbdb83de320f69abaf6a87a361" }
concept_graph = { git = "https://github.com/kennguy3n/knowledge", rev = "02050cd1aada1dbbdb83de320f69abaf6a87a361" }
synthesis_pipeline = { git = "https://github.com/kennguy3n/knowledge", rev = "02050cd1aada1dbbdb83de320f69abaf6a87a361" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
tempfile = "3"
walkdir = "2"
notify = "6"
pulldown-cmark = "0.12"
calamine = "0.26"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["sync", "time", "rt"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
url = "2"
urlencoding = "2.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Phase 15 Task 13: streaming XML parser used by the DOCX regression
# suite to assert required OOXML elements (w:body, w:p, w:tbl, etc.)
# are present in exported documents.
quick-xml = { version = "0.36", default-features = false }
regex = "1"
wiremock = "0.6"
ignore = "0.4"
kamadak-exif = "0.6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp"] }
base64 = "0.22"
lopdf = { version = "0.34", default-features = false, features = ["nom_parser"] }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc", "rand_core"] }
hkdf = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }
zeroize = { version = "1.8", default-features = false, features = ["zeroize_derive"] }
# Session 7 post-quantum crypto (XChaCha20-Poly1305 AEAD, HKDF-SHA256 key
# derivation, hybrid X25519 + ML-KEM-768 KEM, ML-DSA-65 / FIPS 204 signatures)
# is provided by the SAME `knowledge_crypto` alias declared above — do not add a
# second `crypto` entry at a different rev, or the workspace will compile two
# copies of the crypto crate.
# ML-DSA-65 (FIPS 204) wire types. Pinned to the exact version the
# knowledge `crypto` crate links so `EncodedVerifyingKey<MlDsa65>` and
# `Signature<MlDsa65>` unify to one type across the dependency graph;
# tessera_export uses it only to reconstruct a verifying key from the
# bytes recorded in an export `.sig` sidecar.
ml-dsa = { version = "0.1.1", features = ["zeroize"] }
rayon = "1.10"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
# Phase 19 Task 1: ONNX Runtime + HuggingFace tokenizers for the
# semantic embedding providers (all-MiniLM-L6-v2 English, paraphrase-
# multilingual-MiniLM-L12-v2 multilingual). Pinned to the 2.0 release
# candidate line because the 1.x API does not expose the borrow-free
# `Session::run` shape the OnnxEmbeddingProvider uses for batch
# inference. `download-binaries` fetches the ONNX Runtime shared
# library at build time so contributors don't need a system-installed
# `onnxruntime` package — this is the same posture the Python
# `onnxruntime` wheel uses.
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["ndarray", "std", "download-binaries"] }
ort-sys = { version = "=2.0.0-rc.10", default-features = false }
ndarray = { version = "0.16", default-features = false, features = ["std"] }
# `default-features = false` strips `progressbar` (indicatif),
# `esaxx_fast` (C++ build), and `http` (hf-hub) — we don't train
# tokenizers in-process, we don't draw progress bars from inside the
# Rust crate, and we fetch tokenizer.json via our own `reqwest`-based
# download path in `model_registry.rs`. The crate still needs SOME
# regex backend to satisfy `tokenizers::utils::SysRegex`, so we
# enable `unstable_wasm`, which (despite the name) just swaps the
# default Oniguruma C bindings for the pure-Rust `fancy-regex` crate.
# Using `fancy-regex` avoids dragging in Oniguruma C headers on every
# build target (Linux, macOS-x64, macOS-arm64, Windows). The
# `getrandom/js` feature toggled on by `unstable_wasm` is a no-op on
# native targets — it only activates the WASM JavaScript RNG when
# compiling to `wasm32-unknown-unknown`.
tokenizers = { version = "0.20", default-features = false, features = ["unstable_wasm"] }
flate2 = "1.0"

# Strip debug symbols from release artifacts. The headline win is the
# Rust N-API addon (`crates/tessera_bridge`) shipped in the packaged
# desktop build: an unstripped cdylib carries tens of MB of DWARF that
# the end user never needs. `strip = true` is shorthand for
# `strip = "symbols"`, which removes both debuginfo and the symbol
# table.
[profile.release]
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
too_many_lines = "allow"
return_self_not_must_use = "allow"
needless_pass_by_value = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
cast_precision_loss = "allow"
doc_markdown = "allow"
struct_excessive_bools = "allow"
multiple_crate_versions = "allow"
ignored_unit_patterns = "allow"
explicit_iter_loop = "allow"
needless_raw_string_hashes = "allow"
type_complexity = "allow"
single_match = "allow"
items_after_statements = "allow"
unreadable_literal = "allow"
uninlined_format_args = "allow"
needless_continue = "allow"
match_same_arms = "allow"
