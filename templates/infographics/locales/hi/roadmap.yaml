id: infographic-roadmap-v1-hi
name: रोडमैप इन्फोग्राफिक
type: infographic
description: |-
  ‘अभी / अगला / बाद में’ शैली का उत्पाद या रणनीति रोडमैप, क्षैतिज स्विमलेन के रूप में दर्शाया गया, जिसमें प्रत्येक लेन में थीम-आधारित पहल और परिणाम होते हैं। (हिंदी संस्करण)
locale: hi
layout: horizontal
default_icon_set: lucide
color_scheme:
  primary: '#2563EB'
  secondary: '#14B8A6'
  accent: '#F97316'
profile:
- product-manager
- executive
sections:
- title: शीर्षक और समय-सीमा
  prompt: |-
    रोडमैप का शीर्षक, स्वामी टीम, और प्रत्येक लेन जिस समय-सीमा का प्रतिनिधित्व करती है (जैसे, अभी = इस तिमाही, अगला = अगली तिमाही, बाद में = उसके आगे)। बताएँ कि तिथियाँ दिशासूचक हैं, प्रतिबद्धताएँ नहीं। हिंदी में उत्तर दें।
  icon_suggestion: map
- title: रणनीतिक थीम
  prompt: |-
    वे दो से चार थीम जिनके इर्द-गिर्द रोडमैप संगठित है। प्रत्येक थीम: एक छोटा लेबल और वह परिणाम जो वह प्रेरित करती है, ताकि पहलें फ़ीचर सूची के बजाय रणनीति की ओर बढ़ें। हिंदी में उत्तर दें।
  icon_suggestion: target
- title: अभी
  prompt: |-
    मौजूदा समय-सीमा के लिए प्रतिबद्ध, चालू पहलें। प्रति आइटम: पहल, वह थीम जिसकी यह सेवा करती है, अपेक्षित परिणाम, और एक विश्वास संकेतक। स्रोत योजना का हवाला दें। हिंदी में उत्तर दें।
  icon_suggestion: play-circle
  required_sources:
  - type: local
    min: 1
- title: अगला
  prompt: |-
    अगली समय-सीमा के लिए नियोजित पहलें, प्राथमिकता और निर्भरता के अनुसार क्रमबद्ध। नोट करें कि प्रत्येक के शुरू होने से पहले ‘अभी’ में क्या पूरा होना चाहिए। हिंदी में उत्तर दें।
  icon_suggestion: arrow-right-circle
- title: बाद में
  prompt: |-
    निकट भविष्य से परे दिशासूचक दाँव और अन्वेषण। लचीलापन बनाए रखने के लिए इन्हें प्रतिबद्ध फ़ीचर के बजाय हल करने योग्य समस्याओं के रूप में प्रस्तुत करें। हिंदी में उत्तर दें।
  icon_suggestion: telescope
- title: निर्भरताएँ और जोखिम
  prompt: |-
    टीमों के बीच निर्भरताएँ और रोडमैप के शीर्ष जोखिम, प्रत्येक के साथ एक स्वामी और एक-पंक्ति का शमन। हिंदी में उत्तर दें।
  icon_suggestion: alert-triangle
  output_format: table
export:
- html
- pdf
- markdown
