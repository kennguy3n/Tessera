id: infographic-roadmap-v1-ar
name: إنفوجرافيك خارطة الطريق
type: infographic
description: |-
  خارطة طريق للمنتج أو الاستراتيجية بنمط الآن / التالي / لاحقًا، تُعرض كمسارات أفقية، يحتوي كل منها على مبادرات مواضيعية ونتائج. (النسخة العربية)
locale: ar
layout: horizontal
default_icon_set: lucide
color_scheme:
  primary: '#2563EB'
  secondary: '#14B8A6'
  accent: '#F97316'
profile:
- product-manager
- executive
sections:
- title: العنوان والأفق الزمني
  prompt: |-
    عنوان خارطة الطريق، والفريق المالك، والأفق الزمني الذي يمثله كل مسار (مثلاً: الآن = هذا الربع، التالي = الربع المقبل، لاحقًا = ما بعد ذلك). أوضح أن التواريخ إرشادية وليست التزامات. أجب باللغة العربية.
  icon_suggestion: map
- title: المحاور الاستراتيجية
  prompt: |-
    المحاور الاثنان إلى الأربعة التي تنتظم حولها خارطة الطريق. لكل محور: تسمية قصيرة والنتيجة التي يحققها، بحيث ترتقي المبادرات إلى الاستراتيجية بدلاً من أن تبدو قائمة ميزات. أجب باللغة العربية.
  icon_suggestion: target
- title: الآن
  prompt: |-
    المبادرات المُلتزَم بها والجارية للأفق الحالي. لكل عنصر: المبادرة، والمحور الذي تخدمه، والنتيجة المتوقعة، ومؤشر الثقة. اذكر الخطة المصدر. أجب باللغة العربية.
  icon_suggestion: play-circle
  required_sources:
  - type: local
    min: 1
- title: التالي
  prompt: |-
    المبادرات المخطط لها للأفق التالي، مرتبة حسب الأولوية والتبعية. دوّن ما يجب إنجازه في «الآن» قبل أن تبدأ كل منها. أجب باللغة العربية.
  icon_suggestion: arrow-right-circle
- title: لاحقًا
  prompt: |-
    رهانات اتجاهية واستكشافات لما بعد المدى القريب. صُغها كمشكلات يجب حلها، لا كميزات مُلتزَم بها، للحفاظ على المرونة. أجب باللغة العربية.
  icon_suggestion: telescope
- title: التبعيات والمخاطر
  prompt: |-
    التبعيات بين الفرق وأبرز المخاطر على خارطة الطريق، لكل منها مسؤول وإجراء تخفيف من سطر واحد. أجب باللغة العربية.
  icon_suggestion: alert-triangle
  output_format: table
export:
- html
- pdf
- markdown
