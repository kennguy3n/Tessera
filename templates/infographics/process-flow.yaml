id: infographic-process-flow-v1
name: Process Flow
type: infographic
description: >
  A horizontal infographic that visualises a 3-5 step process as a flow:
  intake → middle steps → outcome. Each step is one section with an icon
  and a short description.
layout: horizontal
default_icon_set: lucide
color_scheme:
  primary: "#7C3AED"
  secondary: "#0EA5E9"
  accent: "#F59E0B"
sections:
  - heading: Step 1 — Intake
    prompt: >
      Describe the entry point of the process: who or what kicks it off,
      and what data or input is required.
    icon_suggestion: log-in
  - heading: Step 2 — Process
    prompt: >
      Describe the core processing step: what transforms the input.
    icon_suggestion: settings
  - heading: Step 3 — Decision
    prompt: >
      Describe the decision or routing step that determines the
      branching outcome.
    icon_suggestion: git-branch
  - heading: Step 4 — Action
    prompt: >
      Describe the action taken once the decision is made.
    icon_suggestion: zap
  - heading: Step 5 — Outcome
    prompt: >
      Describe the final result delivered to the end user.
    icon_suggestion: check-circle
export:
  - html
  - pdf
  - markdown
