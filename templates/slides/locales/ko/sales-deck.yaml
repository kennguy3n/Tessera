id: sales-deck-v1-ko
name: B2B 영업 덱
type: slides
description: 신규 개척/클로징용 영업 덱 — 구매자의 고충, 관점, 솔루션, 증거, 가격, 명확한 다음 단계 (한국어 버전)
locale: ko
format: marp
theme: gaia
paginate: true
profile:
- sales
- account-executive
sections:
- title: 제목과 안건
  prompt: |-
    잠재 고객의 회사명, 판매자의 회사, 미팅 날짜, 양측 참석자의 이름/직책을 담은 제목 슬라이드. 이어서 구매자가 내용과 소요 시간을 알 수 있도록 세 줄짜리 안건을 제시하세요. 한국어로 작성하세요.
- title: 구매자의 현재 상황
  prompt: |-
    구매자의 현재 상황을 그들의 언어로 비춰 주세요: 이 대화를 시작하게 한 계기, 현재 사용하는 워크플로, 그리고 현상 유지의 비용(시간, 비용, 위험). 모든 주장을 디스커버리 노트나 연결된 소스로 뒷받침하세요. 한국어로 작성하세요.
  required_sources:
  - type: local
    min: 1
- title: 관점
  prompt: |-
    구매자의 시장이 어디로 향하고 있으며 왜 현상 유지가 지속될 수 없는지에 대한 판매자의 역발상적이고 방어 가능한 관점을 제시하세요. 이것은 ‘왜 우리인가’에 앞선 ‘왜 바꿔야 하는가’입니다. 한국어로 작성하세요.
- title: 솔루션 개요
  prompt: |-
    위에서 언급한 두세 가지 고충에 솔루션을 매핑하세요. 각 고충에 대해 이를 해결하는 역량과 구매자가 얻는 성과를 제시하세요. 기능 나열을 피하고 성과부터 말하세요. 한국어로 작성하세요.
- title: 증거
  prompt: |-
    가장 강력한 증거: 구매자 세그먼트 내 실명 고객, 정량화된 결과(백분율 또는 절댓값), 그리고 한 줄 인용. 출처가 되는 사례 연구나 레퍼런스 콜을 밝히세요. 한국어로 작성하세요.
  output_format: table
- title: 가격과 패키징
  prompt: |-
    권장 패키지, 포함 내용, 투자 금액, 예상 회수 기간 또는 ROI를 제시하세요. 구매자가 사내에서 그 수치를 방어할 수 있도록 가정을 함께 보여 주세요. 한국어로 작성하세요.
- title: 공동 실행 계획
  prompt: |-
    의사결정까지의 경로를 날짜가 있는 체크리스트로 제시하세요: 기술 검증, 보안 검토, 이해관계자 승인, 계약, 목표 가동일. 각 단계마다 양측의 담당자를 지정하세요. 한국어로 작성하세요.
  output_format: numbered_list
- title: 다음 단계
  prompt: |-
    구체적이고 마찰이 적은 다음 단계(예: 스코핑 워크숍 또는 파일럿) 하나로 마무리하세요. 제안 날짜와 거기에 도달하기 위해 구매자가 내려야 할 단 하나의 결정을 함께 제시하세요. 한국어로 작성하세요.
export:
- markdown
- html
- pptx
- pdf
