id: product-launch-deck-v1-ko
name: 제품 출시 / Go-to-Market
type: slides
description: 제품 출시 덱 — 포지셔닝, 타깃 세그먼트, 메시징, 출시 계획, 인에이블먼트, 성공 지표 (한국어 버전)
locale: ko
format: marp
theme: gaia
paginate: true
profile:
- product-manager
- product-marketing
sections:
- title: 출시 헤드라인
  prompt: |-
    제품 또는 기능 이름, 출시 등급(대규모 / 소규모 / 사일런트), 목표 출시일, 그리고 이것이 왜 고객에게 중요한지 담은 한 줄 약속을 포함한 제목 슬라이드. 한국어로 작성하세요.
- title: 왜 지금인가
  prompt: |-
    지금이 출시의 적기인 이유가 되는 시장 변화, 고객 수요 또는 경쟁 공백. 연결된 소스의 리서치나 파이프라인 데이터로 근거를 제시하세요. 한국어로 작성하세요.
  required_sources:
  - type: local
    min: 1
- title: 포지셔닝과 메시징
  prompt: |-
    포지셔닝 선언문(누구를 위한 것인지, 카테고리, 핵심 혜택, 차별점)과 영업·마케팅이 어디서나 반복할 세 가지 메시지 기둥. 한국어로 작성하세요.
- title: 타깃 세그먼트와 ICP
  prompt: |-
    1차 및 2차 세그먼트, 이상적 고객 프로필(ICP), 그리고 구매자/사용자 페르소나. 각각에 대해 이번 출시가 해결하는 고충과 행동을 유발하는 계기를 제시하세요. 한국어로 작성하세요.
- title: 패키징과 가격 책정
  prompt: |-
    제품을 어떻게 패키징하고 가격을 책정하는지, 기존 고객에게 무엇이 바뀌는지, 마이그레이션 또는 기존 조건 유지 계획. 아직 미정인 가격 결정을 표시하세요. 한국어로 작성하세요.
- title: 출시 계획과 일정
  prompt: |-
    단계별 계획: 알파, 베타, 정식 출시(GA), 출시 후. 단계별로 일정, 채널(PR, 콘텐츠, 이메일, 이벤트, 인앱), 그리고 다음 단계로 넘어가는 기준. 한국어로 작성하세요.
  output_format: table
- title: 영업 및 지원 인에이블먼트
  prompt: |-
    영업, 고객 성공, 지원이 준비해야 할 것: 데모 스크립트, 배틀카드, 가격 가이드, FAQ, 교육 일정. 각 자료의 담당자를 지정하세요. 한국어로 작성하세요.
- title: 성공 지표
  prompt: |-
    출시 스코어카드: 도입률, 영향받은 파이프라인, 매출, 그리고 첫 30/60/90일의 선행 지표 하나. 각 지표의 측정 방법과 목표를 정의하세요. 한국어로 작성하세요.
  output_format: bullets
export:
- markdown
- html
- pptx
- pdf
