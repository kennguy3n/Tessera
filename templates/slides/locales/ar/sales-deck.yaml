id: sales-deck-v1-ar
name: عرض مبيعات B2B
type: slides
description: |-
  عرض مبيعات للتنقيب/الإغلاق — ألم المشتري، ووجهة النظر، والحل، والإثبات، والتسعير، وخطوة تالية واضحة (النسخة العربية)
locale: ar
format: marp
theme: gaia
paginate: true
profile:
- sales
- account-executive
sections:
- title: العنوان وجدول الأعمال
  prompt: |-
    شريحة العنوان تتضمن اسم شركة العميل المحتمل، وشركة البائع، وتاريخ الاجتماع، وأسماء وأدوار الحاضرين من الجانبين. ثم جدول أعمال من ثلاثة أسطر ليعرف المشتري ما يتوقعه والمدة التي سيستغرقها. أجب باللغة العربية.
- title: واقع المشتري اليوم
  prompt: |-
    اعكس وضع المشتري الحالي بكلماته هو: المحفّز الذي بدأ هذه المحادثة، وسير العمل الذي يستخدمه الآن، وتكلفة الوضع الراهن (الوقت والمال والمخاطر). ادعم كل ادعاء بملاحظات الاستكشاف أو بالمصادر المتصلة. أجب باللغة العربية.
  required_sources:
  - type: local
    min: 1
- title: وجهة النظر
  prompt: |-
    اعرض وجهة نظر البائع المخالفة والقابلة للدفاع حول وجهة سوق المشتري ولماذا لن يصمد الوضع الراهن. هذا هو «لماذا التغيير» قبل «لماذا نحن». أجب باللغة العربية.
- title: نظرة عامة على الحل
  prompt: |-
    اربط الحل بالألمين أو الثلاثة المذكورة أعلاه. لكل ألم: القدرة التي تعالجه والنتيجة التي يحصل عليها المشتري. تجنّب سرد الميزات — ابدأ بالنتيجة. أجب باللغة العربية.
- title: الإثبات
  prompt: |-
    أقوى أدلة الإثبات: عميل مذكور بالاسم في شريحة المشتري، ونتيجة كمية (نسبة مئوية أو قيمة مطلقة)، واقتباس من سطر واحد. اذكر دراسة الحالة أو المكالمة المرجعية التي أتى منها. أجب باللغة العربية.
  output_format: table
- title: التسعير والتغليف
  prompt: |-
    اعرض الباقة الموصى بها، وما تتضمنه، والاستثمار، وفترة الاسترداد المتوقعة أو العائد على الاستثمار. أظهر الافتراضات حتى يتمكن المشتري من الدفاع عن الرقم داخليًا. أجب باللغة العربية.
- title: خطة عمل مشتركة
  prompt: |-
    ارسم المسار إلى القرار كقائمة تحقق مؤرخة: التحقق الفني، ومراجعة الأمن، وموافقات أصحاب المصلحة، والتعاقد، وموعد التشغيل المستهدف. حدد المسؤول من كل جانب لكل خطوة. أجب باللغة العربية.
  output_format: numbered_list
- title: الخطوة التالية
  prompt: |-
    اختتم بخطوة تالية واحدة محددة ومنخفضة الاحتكاك (مثل ورشة تحديد النطاق أو تجربة رائدة)، مع تاريخ مقترح والقرار الوحيد الذي يحتاج المشتري إلى اتخاذه للوصول إليها. أجب باللغة العربية.
export:
- markdown
- html
- pptx
- pdf
