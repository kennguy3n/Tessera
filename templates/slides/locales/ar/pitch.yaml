id: pitch-v1-ar
name: عرض تقديمي ترويجي
type: slides
description: عرض تقديمي ترويجي من المؤسس/المبيعات مع المشكلة والحل والسوق والإنجازات والفريق والطلب (النسخة العربية)
locale: ar
format: marp
theme: gaia
paginate: true
sections:
  - title: الافتتاحية
    prompt: >
      افتح بجملة واحدة عالية التأثير حول الفرصة. ابدأ بالمشكلة
      أو المقياس الرئيسي. أجب باللغة العربية.
  - title: المشكلة
    prompt: >
      صف المشكلة بلغة ملموسة ومستندة إلى العميل. قم بقياس الألم
      (التكلفة، الوقت، معدل الفقد) كلما أمكن. أجب باللغة العربية.
  - title: الحل
    prompt: >
      اشرح الحل بإيجاز. سلط الضوء على القدرة السحرية التي تجعله
      يعمل. أجب باللغة العربية.
  - title: السوق والإنجازات
    prompt: >
      قم بقياس حجم السوق (TAM/SAM/SOM) واذكر الإنجازات الحالية
      (المستخدمون، الإيرادات السنوية المتكررة، معدل النمو). استخدم
      المصادر. أجب باللغة العربية.
    required_sources:
      - type: local
        min: 1
  - title: نموذج العمل والمنافسة
    prompt: >
      صف كيف يتم تحقيق الإيرادات وكيف يتميز العرض عن البدائل.
      أجب باللغة العربية.
  - title: الفريق
    prompt: >
      قدم المؤسسين/أعضاء الفريق الرئيسيين مع الدور والخبرة
      وإثبات الصلة. أجب باللغة العربية.
  - title: الطلب
    prompt: >
      حدد مبلغ التمويل واستخدام الأموال والمعالم التي سيتم الكشف عنها.
      اختتم بزخم. أجب باللغة العربية.
export:
  - markdown
  - html
  - pptx
  - pdf
marp_template: |
  ---
  marp: true
  theme: gaia
  paginate: true
  class: lead
  ---

  # {{ company_name }}
  ## {{ one_liner }}

  <!-- تواصل بصري؛ توقف؛ دع الافتتاحية تترسخ -->

  ---

  ## المشكلة

  > {{ problem_statement }}

  - **اليوم:** {{ status_quo }}
  - **التكلفة:** {{ pain_metric }}

  ---

  ## حلنا

  ### {{ solution_headline }}

  {{ solution_description }}

  ```mermaid
  flowchart LR
    Today([الوضع الراهن]) --> {{ company_name }}([حلنا]) --> Outcome([{{ outcome }}])
  ```

  ---

  ## السوق والإنجازات

  | المقياس | القيمة |
  |---|---|
  | TAM | {{ tam }} |
  | SAM | {{ sam }} |
  | SOM | {{ som }} |
  | الإيرادات الشهرية / المستخدمون | {{ traction }} |
  | النمو (شهرياً) | {{ growth }} |

  ---

  ## نموذج العمل

  - **التسعير:** {{ pricing }}
  - **CAC / LTV:** {{ cac_ltv }}
  - **لماذا نحن:** {{ moat }}

  ---

  ## الفريق

  - **{{ founder_1_name }}** — {{ founder_1_role }} — {{ founder_1_bio }}
  - **{{ founder_2_name }}** — {{ founder_2_role }} — {{ founder_2_bio }}

  ---

  ## الطلب

  جمع **{{ raise_amount }}** من أجل:

  1. {{ use_of_funds_1 }}
  2. {{ use_of_funds_2 }}
  3. {{ use_of_funds_3 }}

  <!-- اختتم بالمعلم التالي -->
