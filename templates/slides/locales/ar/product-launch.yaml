id: product-launch-deck-v1-ar
name: إطلاق المنتج / استراتيجية الدخول إلى السوق
type: slides
description: |-
  عرض تقديمي لإطلاق منتج — تحديد الموقع، الشرائح المستهدفة، الرسائل، خطة الإطلاق، التمكين، ومقاييس النجاح (النسخة العربية)
locale: ar
format: marp
theme: gaia
paginate: true
profile:
- product-manager
- product-marketing
sections:
- title: عنوان الإطلاق
  prompt: |-
    شريحة العنوان تتضمن اسم المنتج أو الميزة، ومستوى الإطلاق (كبير / صغير / صامت)، وتاريخ الإطلاق المستهدف، ووعدًا من سطر واحد يوضح سبب أهمية ذلك للعملاء. أجب باللغة العربية.
- title: لماذا الآن
  prompt: |-
    التحول في السوق أو طلب العملاء أو الفجوة التنافسية التي تجعل هذا هو الوقت المناسب للإطلاق. ادعم ذلك بالبحث أو ببيانات خط الأنابيب من المصادر المتصلة. أجب باللغة العربية.
  required_sources:
  - type: local
    min: 1
- title: تحديد الموقع والرسائل
  prompt: |-
    بيان تحديد الموقع (لمن، والفئة، والفائدة الرئيسية، وعنصر التمايز) وركائز الرسائل الثلاث التي سيكررها فريقا المبيعات والتسويق في كل مكان. أجب باللغة العربية.
- title: الشرائح المستهدفة وملف العميل المثالي
  prompt: |-
    الشريحتان الأساسية والثانوية، وملف العميل المثالي، وشخصيات المشتري/المستخدم. لكل منها: المشكلة التي يحلها هذا الإطلاق والمحفز الذي يدفعهم إلى التحرك. أجب باللغة العربية.
- title: التغليف والتسعير
  prompt: |-
    كيفية تغليف المنتج وتسعيره، وما الذي يتغير للعملاء الحاليين، وأي خطة للترحيل أو للحفاظ على الشروط السابقة. أبرز قرارات التسعير التي لا تزال مفتوحة. أجب باللغة العربية.
- title: خطة الإطلاق والجدول الزمني
  prompt: |-
    الخطة على مراحل: ألفا، وبيتا، والإتاحة العامة، وما بعد الإطلاق. لكل مرحلة: التواريخ والقنوات (العلاقات العامة، المحتوى، البريد، الفعاليات، داخل التطبيق) ومعايير الانتقال. أجب باللغة العربية.
  output_format: table
- title: تمكين المبيعات والدعم
  prompt: |-
    ما يحتاج فريق المبيعات ونجاح العملاء والدعم إلى تجهيزه: نص العرض التوضيحي، وبطاقة المنافسة، وإرشادات التسعير، والأسئلة الشائعة، وتاريخ التدريب. حدد المسؤول عن كل أصل. أجب باللغة العربية.
- title: مقاييس النجاح
  prompt: |-
    بطاقة أداء الإطلاق: التبني، وخط الأنابيب المتأثر، والإيرادات، ومؤشر استباقي واحد لأول 30/60/90 يومًا. حدد كيفية قياس كل منها والهدف. أجب باللغة العربية.
  output_format: bullets
export:
- markdown
- html
- pptx
- pdf
