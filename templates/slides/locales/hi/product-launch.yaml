id: product-launch-deck-v1-hi
name: उत्पाद लॉन्च / गो-टू-मार्केट
type: slides
description: |-
  उत्पाद लॉन्च डेक — पोज़िशनिंग, लक्षित सेगमेंट, मैसेजिंग, लॉन्च योजना, इनेबलमेंट और सफलता मेट्रिक्स (हिंदी संस्करण)
locale: hi
format: marp
theme: gaia
paginate: true
profile:
- product-manager
- product-marketing
sections:
- title: लॉन्च हेडलाइन
  prompt: |-
    शीर्षक स्लाइड जिसमें उत्पाद या फ़ीचर का नाम, लॉन्च स्तर (बड़ा / छोटा / साइलेंट), लक्षित लॉन्च तिथि, और एक-पंक्ति का वादा हो जो बताए कि यह ग्राहकों के लिए क्यों मायने रखता है। हिंदी में उत्तर दें।
- title: अभी क्यों
  prompt: |-
    बाज़ार में बदलाव, ग्राहक मांग, या प्रतिस्पर्धी अंतर जो इसे अभी लॉन्च करने का सही समय बनाता है। इसे जुड़े स्रोतों के शोध या पाइपलाइन डेटा से आधार दें। हिंदी में उत्तर दें।
  required_sources:
  - type: local
    min: 1
- title: पोज़िशनिंग और मैसेजिंग
  prompt: |-
    पोज़िशनिंग कथन (किसके लिए, श्रेणी, मुख्य लाभ, विभेदक) और तीन संदेश-स्तंभ जिन्हें बिक्री और मार्केटिंग हर जगह दोहराएँगे। हिंदी में उत्तर दें।
- title: लक्षित सेगमेंट और ICP
  prompt: |-
    प्राथमिक और द्वितीयक सेगमेंट, आदर्श ग्राहक प्रोफ़ाइल, और खरीदार/उपयोगकर्ता पर्सोना। प्रत्येक के लिए: यह लॉन्च जिस समस्या को हल करता है और वह ट्रिगर जो उन्हें कार्य के लिए प्रेरित करता है। हिंदी में उत्तर दें।
- title: पैकेजिंग और मूल्य-निर्धारण
  prompt: |-
    उत्पाद को कैसे पैकेज और मूल्यांकित किया जाता है, मौजूदा ग्राहकों के लिए क्या बदलता है, और कोई माइग्रेशन या पुरानी शर्तें बनाए रखने की योजना। अब भी लंबित मूल्य-निर्णयों को चिह्नित करें। हिंदी में उत्तर दें।
- title: लॉन्च योजना और समयरेखा
  prompt: |-
    चरणबद्ध योजना: अल्फा, बीटा, सामान्य उपलब्धता और लॉन्च के बाद। प्रति चरण: तिथियाँ, चैनल (PR, कंटेंट, ईमेल, इवेंट, इन-ऐप) और आगे बढ़ने के मानदंड। हिंदी में उत्तर दें।
  output_format: table
- title: बिक्री और सहायता इनेबलमेंट
  prompt: |-
    बिक्री, ग्राहक सफलता और सहायता को क्या तैयार रखना है: डेमो स्क्रिप्ट, बैटलकार्ड, मूल्य मार्गदर्शन, FAQ और प्रशिक्षण तिथि। प्रत्येक संसाधन के लिए ज़िम्मेदार व्यक्ति का नाम दें। हिंदी में उत्तर दें।
- title: सफलता मेट्रिक्स
  prompt: |-
    लॉन्च स्कोरकार्ड: अपनाव, प्रभावित पाइपलाइन, राजस्व, और पहले 30/60/90 दिनों के लिए एक अग्रणी संकेतक। परिभाषित करें कि प्रत्येक को कैसे मापा जाता है और लक्ष्य क्या है। हिंदी में उत्तर दें।
  output_format: bullets
export:
- markdown
- html
- pptx
- pdf
