id: sales-deck-v1-hi
name: B2B सेल्स डेक
type: slides
description: |-
  प्रॉस्पेक्टिंग/क्लोज़िंग के लिए सेल्स डेक — खरीदार की समस्या, दृष्टिकोण, समाधान, प्रमाण, मूल्य-निर्धारण और एक स्पष्ट अगला कदम (हिंदी संस्करण)
locale: hi
format: marp
theme: gaia
paginate: true
profile:
- sales
- account-executive
sections:
- title: शीर्षक और एजेंडा
  prompt: |-
    शीर्षक स्लाइड जिसमें संभावित ग्राहक का कंपनी नाम, विक्रेता की कंपनी, बैठक की तिथि, और दोनों पक्षों के उपस्थित लोगों के नाम/भूमिकाएँ हों। इसके बाद तीन-पंक्ति का एजेंडा दें ताकि खरीदार जान सके कि क्या अपेक्षित है और इसमें कितना समय लगेगा। हिंदी में उत्तर दें।
- title: खरीदार की मौजूदा स्थिति
  prompt: |-
    खरीदार की मौजूदा स्थिति को उन्हीं के शब्दों में दर्शाएँ: वह ट्रिगर जिससे यह बातचीत शुरू हुई, अभी जो वर्कफ़्लो वे उपयोग करते हैं, और यथास्थिति की लागत (समय, पैसा, जोखिम)। हर दावे को डिस्कवरी नोट्स या जुड़े स्रोतों से आधार दें। हिंदी में उत्तर दें।
  required_sources:
  - type: local
    min: 1
- title: दृष्टिकोण
  prompt: |-
    खरीदार का बाज़ार किस दिशा में जा रहा है और यथास्थिति क्यों टिक नहीं पाएगी, इस पर विक्रेता का विपरीत किंतु बचाव-योग्य दृष्टिकोण रखें। यह ‘हम ही क्यों’ से पहले ‘बदलाव क्यों’ है। हिंदी में उत्तर दें।
- title: समाधान का अवलोकन
  prompt: |-
    ऊपर बताए गए दो या तीन दर्द-बिंदुओं से समाधान को जोड़ें। प्रत्येक दर्द के लिए: उसे हल करने वाली क्षमता और खरीदार को मिलने वाला परिणाम। फ़ीचर गिनाने से बचें — परिणाम से शुरू करें। हिंदी में उत्तर दें।
- title: प्रमाण
  prompt: |-
    सबसे मज़बूत प्रमाण: खरीदार के सेगमेंट में एक नामित ग्राहक, एक परिमाणित परिणाम (प्रतिशत या निरपेक्ष), और एक-पंक्ति का उद्धरण। जिस केस स्टडी या रेफरेंस कॉल से यह आया है, उसका हवाला दें। हिंदी में उत्तर दें।
  output_format: table
- title: मूल्य-निर्धारण और पैकेजिंग
  prompt: |-
    अनुशंसित पैकेज, उसमें क्या शामिल है, निवेश, और अपेक्षित भुगतान-वापसी अवधि या ROI प्रस्तुत करें। मान्यताएँ दिखाएँ ताकि खरीदार आंतरिक रूप से उस संख्या का बचाव कर सके। हिंदी में उत्तर दें।
- title: संयुक्त कार्य योजना
  prompt: |-
    निर्णय तक के रास्ते को तिथि-सहित चेकलिस्ट के रूप में रखें: तकनीकी सत्यापन, सुरक्षा समीक्षा, हितधारकों की स्वीकृतियाँ, अनुबंध, और लक्षित गो-लाइव। हर कदम के लिए दोनों पक्षों के ज़िम्मेदार व्यक्ति का नाम दें। हिंदी में उत्तर दें।
  output_format: numbered_list
- title: अगला कदम
  prompt: |-
    एक विशिष्ट, कम-घर्षण वाले अगले कदम (जैसे स्कोपिंग वर्कशॉप या पायलट) पर समापन करें, एक प्रस्तावित तिथि और वह एकमात्र निर्णय जो खरीदार को वहाँ पहुँचने के लिए लेना है। हिंदी में उत्तर दें।
export:
- markdown
- html
- pptx
- pdf
