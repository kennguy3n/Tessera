id: pitch-v1-hi
name: पिच डेक
type: slides
description: समस्या, समाधान, बाजार, गति, टीम और अनुरोध के साथ संस्थापक/बिक्री पिच डेक (हिंदी संस्करण)
locale: hi
format: marp
theme: gaia
paginate: true
sections:
  - title: हुक
    prompt: >
      अवसर के बारे में एक उच्च-प्रभाव वाले वाक्य से शुरू करें। समस्या
      या मुख्य मीट्रिक के साथ नेतृत्व करें। हिंदी में उत्तर दें।
  - title: समस्या
    prompt: >
      ठोस, ग्राहक-आधारित भाषा में समस्या का वर्णन करें।
      जहाँ संभव हो, दर्द (लागत, समय, मंथन) को मात्रात्मक रूप दें।
      हिंदी में उत्तर दें।
  - title: समाधान
    prompt: >
      समाधान को संक्षेप में समझाएं। उस जादुई क्षमता पर प्रकाश डालें
      जो इसे काम करवाती है। हिंदी में उत्तर दें।
  - title: बाजार और गति
    prompt: >
      बाजार का आकार (TAM/SAM/SOM) मापें और वर्तमान गति (उपयोगकर्ता,
      ARR, विकास दर) की रिपोर्ट करें। स्रोतों का उपयोग करें।
      हिंदी में उत्तर दें।
    required_sources:
      - type: local
        min: 1
  - title: व्यवसाय मॉडल और प्रतिस्पर्धा
    prompt: >
      वर्णन करें कि राजस्व कैसे अर्जित किया जाता है और प्रस्ताव विकल्पों
      से कैसे अलग है। हिंदी में उत्तर दें।
  - title: टीम
    prompt: >
      संस्थापकों/प्रमुख टीम सदस्यों को भूमिका, अनुभव और प्रासंगिकता
      के प्रमाण के साथ प्रस्तुत करें। हिंदी में उत्तर दें।
  - title: अनुरोध
    prompt: >
      फंडिंग राशि, फंड का उपयोग और अनलॉक किए गए मील के पत्थर बताएं।
      गति के साथ समाप्त करें। हिंदी में उत्तर दें।
export:
  - markdown
  - html
  - pptx
  - pdf
marp_template: |
  ---
  marp: true
  theme: gaia
  paginate: true
  class: lead
  ---

  # {{ company_name }}
  ## {{ one_liner }}

  <!-- आँख से संपर्क; रुकें; हुक को बैठने दें -->

  ---

  ## समस्या

  > {{ problem_statement }}

  - **आज:** {{ status_quo }}
  - **लागत:** {{ pain_metric }}

  ---

  ## हमारा समाधान

  ### {{ solution_headline }}

  {{ solution_description }}

  ```mermaid
  flowchart LR
    Today([यथास्थिति]) --> {{ company_name }}([हमारा समाधान]) --> Outcome([{{ outcome }}])
  ```

  ---

  ## बाजार और गति

  | मीट्रिक | मान |
  |---|---|
  | TAM | {{ tam }} |
  | SAM | {{ sam }} |
  | SOM | {{ som }} |
  | MRR / उपयोगकर्ता | {{ traction }} |
  | विकास (MoM) | {{ growth }} |

  ---

  ## व्यवसाय मॉडल

  - **मूल्य निर्धारण:** {{ pricing }}
  - **CAC / LTV:** {{ cac_ltv }}
  - **हम क्यों:** {{ moat }}

  ---

  ## टीम

  - **{{ founder_1_name }}** — {{ founder_1_role }} — {{ founder_1_bio }}
  - **{{ founder_2_name }}** — {{ founder_2_role }} — {{ founder_2_bio }}

  ---

  ## अनुरोध

  निम्न के लिए **{{ raise_amount }}** जुटा रहे हैं:

  1. {{ use_of_funds_1 }}
  2. {{ use_of_funds_2 }}
  3. {{ use_of_funds_3 }}

  <!-- अगले मील के पत्थर पर समाप्त करें -->
