id: sales-deck-v1-zh
name: B2B 销售演示
type: slides
description: 用于开发/成交的销售演示 — 买方痛点、观点、解决方案、佐证、定价以及清晰的下一步（中文版）
locale: zh
format: marp
theme: gaia
paginate: true
profile:
- sales
- account-executive
sections:
- title: 标题与议程
  prompt: 标题幻灯片，包含潜在客户的公司名称、卖方公司、会议日期，以及双方与会者的姓名/职务。随后用三行议程让买方了解会议内容及所需时间。 请用中文回答。
- title: 买方的现状
  prompt: |-
    用买方自己的话还原其现状：开启此次对话的触发因素、当前使用的工作流程，以及维持现状的代价（时间、金钱、风险）。每个论断都以发现笔记或所连接的来源为依据。 请用中文回答。
  required_sources:
  - type: local
    min: 1
- title: 观点
  prompt: 陈述卖方与众不同且站得住脚的观点：买方所在市场将走向何方，以及为何现状难以为继。这是先讲“为何改变”，再讲“为何选择我们”。 请用中文回答。
- title: 解决方案概览
  prompt: 将解决方案对应到上面列出的两三个痛点。针对每个痛点：说明解决它的能力以及买方获得的成果。避免罗列功能——先讲成果。 请用中文回答。
- title: 佐证
  prompt: 最有力的佐证：买方所在细分市场中一位具名客户、一个量化结果（百分比或绝对值）以及一句引言。注明其出处的案例研究或推荐通话。 请用中文回答。
  output_format: table
- title: 定价与打包
  prompt: 呈现推荐的套餐、所含内容、投入金额，以及预期的回收期或投资回报率。展示假设前提，以便买方在内部为该数字辩护。 请用中文回答。
- title: 双方行动计划
  prompt: 以带日期的清单形式列出通往决策的路径：技术验证、安全审查、相关方签批、签约以及目标上线时间。为每个步骤指定双方各自的负责人。 请用中文回答。
  output_format: numbered_list
- title: 下一步
  prompt: 以一个具体、低门槛的下一步收尾（例如范围界定研讨会或试点），附上建议日期以及买方为推进所需做出的唯一决策。 请用中文回答。
export:
- markdown
- html
- pptx
- pdf
