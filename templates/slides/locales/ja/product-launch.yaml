id: product-launch-deck-v1-ja
name: 製品ローンチ / Go-to-Market
type: slides
description: 製品ローンチ向けデッキ — ポジショニング、ターゲットセグメント、メッセージング、ローンチ計画、イネーブルメント、成功指標（日本語版）
locale: ja
format: marp
theme: gaia
paginate: true
profile:
- product-manager
- product-marketing
sections:
- title: ローンチの見出し
  prompt: |-
    製品または機能の名前、ローンチの規模（大／小／サイレント）、目標ローンチ日、そしてなぜこれが顧客にとって重要かを捉えた一行の約束を記載したタイトルスライド。 日本語で回答してください。
- title: なぜ今か
  prompt: |-
    今ローンチするのが適切である理由となる市場の変化、顧客の需要、または競合のギャップ。接続されたソースの調査やパイプラインデータで裏付けてください。 日本語で回答してください。
  required_sources:
  - type: local
    min: 1
- title: ポジショニングとメッセージング
  prompt: |-
    ポジショニングステートメント（誰のために、カテゴリ、主要な便益、差別化要因）と、営業とマーケティングが至る所で繰り返す3つのメッセージの柱。 日本語で回答してください。
- title: ターゲットセグメントとICP
  prompt: |-
    主要および副次セグメント、理想的な顧客プロファイル、そして購入者／利用者のペルソナ。それぞれについて、このローンチが解消する課題と、行動を促すきっかけ。 日本語で回答してください。
- title: パッケージングと価格設定
  prompt: |-
    製品のパッケージングと価格設定の方法、既存顧客にとって何が変わるか、移行または既存条件の据え置き計画。未決定の価格判断を明示してください。 日本語で回答してください。
- title: ローンチ計画とスケジュール
  prompt: |-
    フェーズ別の計画：アルファ、ベータ、一般提供、ローンチ後。各フェーズの日付、チャネル（PR、コンテンツ、メール、イベント、アプリ内）、次へ進む判定基準。 日本語で回答してください。
  output_format: table
- title: 営業とサポートのイネーブルメント
  prompt: |-
    営業、カスタマーサクセス、サポートが準備すべきもの：デモスクリプト、バトルカード、価格ガイダンス、FAQ、研修日。各アセットの担当者を明記してください。 日本語で回答してください。
- title: 成功指標
  prompt: |-
    ローンチのスコアカード：採用、影響を与えたパイプライン、売上、そして最初の30／60／90日の先行指標を1つ。各指標の測定方法と目標を定義してください。 日本語で回答してください。
  output_format: bullets
export:
- markdown
- html
- pptx
- pdf
