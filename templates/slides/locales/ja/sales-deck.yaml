id: sales-deck-v1-ja
name: B2B営業デッキ
type: slides
description: 新規開拓／クロージング向けの営業デッキ — 買い手の課題、視点、解決策、実証、価格、明確な次の一歩（日本語版）
locale: ja
format: marp
theme: gaia
paginate: true
profile:
- sales
- account-executive
sections:
- title: タイトルとアジェンダ
  prompt: |-
    見込み客の会社名、売り手の会社名、会議日、双方の出席者の氏名と役職を記載したタイトルスライド。続いて、買い手が内容と所要時間を把握できるよう3行のアジェンダを示す。 日本語で回答してください。
- title: 買い手の現状
  prompt: |-
    買い手の現状を本人の言葉で映し出す：この対話が始まったきっかけ、現在使っているワークフロー、そして現状維持のコスト（時間、費用、リスク）。すべての主張をディスカバリーのメモまたは接続されたソースで裏付ける。 日本語で回答してください。
  required_sources:
  - type: local
    min: 1
- title: 視点
  prompt: |-
    買い手の市場がどこへ向かい、なぜ現状が持続しないかについて、売り手の逆張りで擁護可能な視点を述べる。これは「なぜ我々か」の前の「なぜ変えるか」である。 日本語で回答してください。
- title: ソリューション概要
  prompt: |-
    上で挙げた2～3の課題に解決策を対応づける。各課題について、それに対処する機能と、買い手が得る成果を示す。機能の羅列を避け、成果から述べる。 日本語で回答してください。
- title: 実証
  prompt: |-
    最も強力な実証：買い手のセグメントにおける実名顧客、定量的な成果（割合または絶対値）、そして一行の引用。出典となるケーススタディまたはリファレンスコールを明記する。 日本語で回答してください。
  output_format: table
- title: 価格とパッケージ
  prompt: |-
    推奨パッケージ、含まれる内容、投資額、想定される回収期間またはROIを提示する。買い手が社内でその数字を説明できるよう、前提条件を示す。 日本語で回答してください。
- title: 共同アクションプラン
  prompt: |-
    意思決定までの道筋を日付入りのチェックリストとして示す：技術検証、セキュリティレビュー、関係者の承認、契約、目標の稼働開始。各ステップについて双方の担当者を明記する。 日本語で回答してください。
  output_format: numbered_list
- title: 次の一歩
  prompt: |-
    具体的で摩擦の少ない次の一歩（例：スコーピングワークショップやパイロット）で締めくくる。提案日と、そこへ進むために買い手が下すべき唯一の意思決定を添える。 日本語で回答してください。
export:
- markdown
- html
- pptx
- pdf
