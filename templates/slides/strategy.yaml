id: strategy-v1
name: Strategy Deck
type: slides
description: Strategic planning deck with vision, market analysis, strategic pillars, and roadmap
format: marp
theme: gaia
paginate: true
sections:
  - title: Vision and Mission
    prompt: >
      State the vision and mission. Connect to the company's
      broader strategic direction.
  - title: Market Analysis
    prompt: >
      Analyze the current market landscape, competitive positioning,
      and key trends. Cite source material.
    required_sources:
      - type: local
        min: 1
  - title: Strategic Pillars
    prompt: >
      Define 3-5 strategic pillars that will drive the strategy.
      Each pillar should have clear objectives and key results.
  - title: Roadmap
    prompt: >
      Present the execution roadmap with phases, milestones,
      and dependencies.
  - title: Resource Requirements
    prompt: >
      Outline the resources needed — headcount, budget, technology,
      and partnerships.
  - title: Success Metrics
    prompt: >
      Define how success will be measured for each strategic pillar.
      Include leading and lagging indicators.
export:
  - markdown
  - html
  - pptx
  - pdf
marp_template: |
  ---
  marp: true
  theme: gaia
  paginate: true
  class: lead
  ---

  # {{ strategy_title }}
  ## A {{ horizon }} plan

  ---

  ## Vision and Mission

  > {{ vision }}

  **Mission.** {{ mission }}

  ---

  ## Market Analysis

  - **Landscape:** {{ landscape }}
  - **Competition:** {{ competitive_positioning }}
  - **Trends:** {{ key_trends }}

  ---

  ## Strategic Pillars

  1. **{{ pillar_1 }}** — {{ pillar_1_objective }}
  2. **{{ pillar_2 }}** — {{ pillar_2_objective }}
  3. **{{ pillar_3 }}** — {{ pillar_3_objective }}

  ---

  ## Roadmap

  ```mermaid
  gantt
      title Execution Roadmap
      dateFormat  YYYY-MM-DD
      section Phase 1
      {{ milestone_1 }} :a1, {{ phase1_start }}, {{ phase1_duration }}
      section Phase 2
      {{ milestone_2 }} :a2, after a1, {{ phase2_duration }}
      section Phase 3
      {{ milestone_3 }} :a3, after a2, {{ phase3_duration }}
  ```

  ---

  ## Resource Requirements

  - **Headcount:** {{ headcount }}
  - **Budget:** {{ budget }}
  - **Tech / partners:** {{ partnerships }}

  ---

  ## Success Metrics

  - **Leading:** {{ leading_indicators }}
  - **Lagging:** {{ lagging_indicators }}

