id: investor-pitch-uk-v1
name: Investor Pitch (UK — SEIS / EIS)
type: slides
description: UK-tailored seed pitch — problem, solution, traction, and an ask framed around SEIS/EIS advance assurance
format: marp
theme: gaia
paginate: true
industry:
  - finance
profile:
  - founder
sections:
  - title: Hook
    prompt: >
      Open with a single high-impact line on the opportunity, leading
      with the headline metric or the problem. Name the company and the
      one-liner.
  - title: Problem
    prompt: >
      Describe the problem in concrete, customer-grounded terms.
      Quantify the pain (cost, time, churn) for a UK/European market.
  - title: Solution
    prompt: >
      Explain the solution succinctly and the magical capability that
      makes it work. Show the before/after for the customer.
  - title: Market and Traction
    prompt: >
      Size the UK/European market with TAM/SAM/SOM and report traction
      (users, ARR/MRR, growth). Cite the connected sources.
    required_sources:
      - type: local
        min: 1
  - title: Business Model and Competition
    prompt: >
      How revenue is earned, unit economics (CAC/LTV), and how the
      offering differentiates from UK/European incumbents.
  - title: Team
    prompt: >
      Founders and key team with role, prior experience, and proof of
      relevance. Note UK presence and any notable advisors.
  - title: The Ask
    prompt: >
      The raise framed for UK seed norms: round size and instrument
      (priced round or ASA), valuation, use of funds, and milestones
      unlocked. State SEIS/EIS advance-assurance status, as it is
      decisive for UK angel investors.
export:
  - markdown
  - html
  - pptx
  - pdf
