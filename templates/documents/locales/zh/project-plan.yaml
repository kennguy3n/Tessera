id: project-plan-v1-zh
name: 项目计划
type: document
description: 包含时间表、里程碑、负责人和风险的全面项目计划（中文版）
locale: zh
sections:
  - title: 项目摘要
    prompt: >
      用一段话概述执行摘要，包括目标、范围、负责人、目标完成日期和
      当前状态。请用中文回答。
    required_sources:
      - type: local
        min: 1
  - title: 目标与成功标准
    prompt: >
      列出目标（成功是什么样子）以及评估项目所依据的可衡量标准。
      请用中文回答。
  - title: 范围
    prompt: >
      明确说明哪些在范围内、哪些在范围外以及哪些被明确推迟。相关时
      引用来源材料。请用中文回答。
  - title: 里程碑与时间表
    prompt: >
      制作里程碑表格，包含目标日期、交付物、负责人和验收标准。包含
      关键路径说明。请用中文回答。
  - title: 资源与团队
    prompt: >
      列出团队成员、他们的角色与投入分配，以及任何跨职能依赖关系。
      请用中文回答。
  - title: 风险与缓解措施
    prompt: >
      整理主要风险，包含可能性、影响、负责人和计划的缓解措施。
      请用中文回答。
  - title: 依赖关系
    prompt: >
      记录外部和内部依赖关系，包含负责人和状态。标记阻碍项。
      请用中文回答。
  - title: 沟通计划
    prompt: >
      描述会议节奏、状态报告频率和上报路径。请用中文回答。
export:
  - markdown
  - html
  - pdf
  - docx
