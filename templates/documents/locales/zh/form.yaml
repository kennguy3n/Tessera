id: form-v1-zh
name: 表单
type: document
description: 包含标题、说明、字段和提交说明的通用可填写表单（中文版）
locale: zh
sections:
  - title: 表单标题与说明
    prompt: >
      记录表单的标题、简短的目的陈述，以及回答者填写表单之前
      需要了解的任何背景。请用中文回答。
  - title: 回答者信息
    prompt: >
      收集回答者的身份识别详细信息（姓名、电子邮件、角色、
      组织）和提交日期。请用中文回答。
  - title: 表单字段
    prompt: >
      定义表单收集的每个字段。对于每个字段，记录标签、
      输入类型（文本、长文本、单选、多选、日期、复选框、
      数字、文件上传）、是否必填，以及任何默认值或选项列表。
      请用中文回答。
  - title: 验证与条件逻辑
    prompt: >
      描述验证规则（必填、正则表达式、最小/最大值、允许值），
      以及字段之间的条件显示/隐藏逻辑。请用中文回答。
  - title: 提交说明
    prompt: >
      说明已完成表单的提交方式、审核人、预期周转时间，
      以及如何将结果通知回答者。请用中文回答。
  - title: 隐私与保留
    prompt: >
      说明表单数据的存储方式、可访问者，
      以及在删除或匿名化之前的保留期限。请用中文回答。
export:
  - markdown
  - html
  - pdf
  - docx
