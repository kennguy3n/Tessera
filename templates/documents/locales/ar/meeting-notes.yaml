id: meeting-notes-v1-ar
name: محضر الاجتماع
type: document
description: محضر منظم تم التقاطه أثناء الاجتماع أو بعده مع القرارات والإجراءات (النسخة العربية)
locale: ar
sections:
  - title: بيانات الاجتماع
    prompt: >
      سجل عنوان الاجتماع والتاريخ والحاضرين والغائبين والميسر
      ومدون المحضر. أشر إلى جدول الأعمال إن وجد. أجب باللغة العربية.
    required_sources:
      - type: local
        min: 0
  - title: الملخص
    prompt: >
      ملخص فقرة واحدة للاجتماع — ما تمت مناقشته على المستوى العام
      والنتيجة الإجمالية. أجب باللغة العربية.
  - title: ملاحظات النقاش
    prompt: >
      ملاحظات حسب الموضوع تلتقط النقاط الرئيسية المطروحة
      ووجهات النظر المشتركة والسياق الذي أدى إلى القرارات.
      أجب باللغة العربية.
  - title: القرارات
    prompt: >
      اذكر القرارات المتخذة والمبررات والمسؤول وأي شروط
      أو متابعات. أشر إلى المواد المصدرية ذات الصلة. أجب باللغة العربية.
  - title: بنود العمل
    prompt: >
      بنود العمل مع المسؤول والموعد النهائي ومعايير القبول.
      يجب أن يكون كل بند قابلاً للقياس. أجب باللغة العربية.
  - title: المخاطر والأسئلة المفتوحة
    prompt: >
      التقط المخاطر المثارة والأسئلة المفتوحة التي تحتاج إلى متابعة
      ومن يملك متابعة كل بند. أجب باللغة العربية.
  - title: الخطوات التالية
    prompt: >
      حدد ما سيحدث بعد ذلك، بما في ذلك موعد الاجتماع التالي
      إن وجد، ومحفز نقطة المراجعة التالية. أجب باللغة العربية.
export:
  - markdown
  - html
  - pdf
  - docx
