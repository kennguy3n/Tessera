id: brief-v1-ar
name: موجز
type: document
description: موجز مختصر لمشروع أو حملة يتضمن الهدف والجمهور والمخرجات والجدول الزمني (النسخة العربية)
locale: ar
sections:
  - title: عنوان الموجز والسياق
    prompt: >
      العنوان والجهة الطالبة والمسؤول وتاريخ الإنجاز المستهدف وملخص
      للسياق من فقرة واحدة. أجب باللغة العربية.
    required_sources:
      - type: local
        min: 0
  - title: الهدف
    prompt: >
      هدف واحد واضح يسعى الموجز إلى تحقيقه. تجنب الموجزات متعددة
      الأهداف، وقسّمها عند الحاجة. أجب باللغة العربية.
  - title: الخلفية
    prompt: >
      الخلفية ذات الصلة والأعمال السابقة، مع الاستشهاد بالمواد المصدرية.
      أدرج روابط إلى الأبحاث أو الموجزات السابقة أو المنتجات ذات الصلة.
      أجب باللغة العربية.
    required_sources:
      - type: local
        min: 0
  - title: الجمهور
    prompt: >
      لمن يُوجَّه المخرَج. أدرج الجمهور الأساسي والثانوي وأي جمهور
      مستبعد صراحة. أجب باللغة العربية.
  - title: الرسائل الرئيسية
    prompt: >
      أهم 3 إلى 5 رسائل يجب أن تتجلى في المخرَج. ينبغي أن تكون كل
      رسالة جملة واحدة. أجب باللغة العربية.
  - title: المخرجات
    prompt: >
      اذكر المخرجات الملموسة المتوقعة، مع الصيغة والطول والقناة.
      أجب باللغة العربية.
  - title: مؤشرات النجاح
    prompt: >
      كيف سيُقاس النجاح. بصورة كمية حيثما أمكن. أجب باللغة العربية.
  - title: الجدول الزمني والمعالم
    prompt: >
      المعالم الرئيسية مع التواريخ المستهدفة والمسؤولين.
      أجب باللغة العربية.
  - title: القيود
    prompt: >
      قيود الميزانية أو النطاق أو العلامة التجارية أو القيود القانونية
      أو غيرها التي يجب أن يلتزم بها المخرَج. أجب باللغة العربية.
export:
  - markdown
  - html
  - pdf
