id: report-v1-ar
name: تقرير
type: document
description: تقرير تحليلي مع النتائج والتحليل والتوصيات (النسخة العربية)
locale: ar
sections:
  - title: الملخص التنفيذي
    prompt: >
      لخص النتائج الرئيسية والتوصيات الواردة في هذا التقرير.
      أجب باللغة العربية.
  - title: المنهجية
    prompt: >
      صف المنهجية المستخدمة في جمع البيانات وتحليلها.
      أجب باللغة العربية.
  - title: النتائج
    prompt: >
      اعرض النتائج الرئيسية، مدعومة بالبيانات من المصادر.
      أدرج الإحصائيات والأدلة ذات الصلة. أجب باللغة العربية.
    required_sources:
      - type: local
        min: 1
  - title: التحليل
    prompt: >
      قدم تحليلاً تفصيلياً للنتائج. حدد الأنماط والاتجاهات والتداعيات.
      أجب باللغة العربية.
  - title: التوصيات
    prompt: >
      اذكر توصيات قابلة للتنفيذ بناءً على التحليل.
      رتب حسب الأولوية بناءً على التأثير والجدوى. أجب باللغة العربية.
  - title: الملحق
    prompt: >
      أدرج البيانات الداعمة والمراجع والمواد التكميلية.
      أجب باللغة العربية.
export:
  - markdown
  - html
  - csv
