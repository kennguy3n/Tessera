id: form-v1-ar
name: نموذج
type: document
description: نموذج قابل للتعبئة للأغراض العامة مع أقسام للعنوان والوصف والحقول وتعليمات الإرسال (النسخة العربية)
locale: ar
sections:
  - title: عنوان النموذج ووصفه
    prompt: >
      سجل عنوان النموذج وبيان غرض قصير وأي سياق يحتاجه المستجيب
      قبل إكمال النموذج. أجب باللغة العربية.
  - title: معلومات المستجيب
    prompt: >
      اجمع تفاصيل تعريف المستجيب (الاسم، البريد الإلكتروني، الدور،
      المؤسسة) وتاريخ الإرسال. أجب باللغة العربية.
  - title: حقول النموذج
    prompt: >
      حدد كل حقل يجمعه النموذج. لكل حقل، سجل التسمية ونوع الإدخال
      (نص، نص طويل، اختيار واحد، اختيارات متعددة، تاريخ، خانة اختيار،
      رقم، رفع ملف)، وما إذا كان مطلوباً، وأي قيمة افتراضية أو
      قائمة خيارات. أجب باللغة العربية.
  - title: التحقق والمنطق الشرطي
    prompt: >
      صف قواعد التحقق (المطلوب، التعبير المنتظم، الحد الأدنى/الأقصى،
      القيم المسموح بها) وأي منطق شرطي لإظهار/إخفاء الحقول.
      أجب باللغة العربية.
  - title: تعليمات الإرسال
    prompt: >
      اشرح كيفية إرسال النموذج المكتمل ومن يراجعه ووقت الاستجابة
      المتوقع وكيف سيتم إخطار المستجيب بالنتيجة. أجب باللغة العربية.
  - title: الخصوصية والاحتفاظ
    prompt: >
      حدد كيفية تخزين بيانات النموذج ومن يمكنه الوصول إليها
      ومدة الاحتفاظ بها قبل حذفها أو إخفاء هويتها. أجب باللغة العربية.
export:
  - markdown
  - html
  - pdf
  - docx
