id: memo-v1-ar
name: مذكرة
type: document
description: مذكرة تواصل داخلي تتضمن السياق والقرار وبنود الإجراءات (النسخة العربية)
locale: ar
sections:
  - title: الموضوع
    prompt: >
      اذكر موضوع هذه المذكرة بوضوح وإيجاز. أجب باللغة العربية.
  - title: السياق
    prompt: >
      قدم السياق الخلفي الذي يحتاجه المستلمون لفهم القرار أو
      المعلومة التي يجري إبلاغها. أجب باللغة العربية.
  - title: القرار أو المعلومة
    prompt: >
      اذكر القرار أو تغيير السياسة أو المعلومة التي يجري إبلاغها.
      كن محددًا بشأن ما يتغير ولماذا. أجب باللغة العربية.
  - title: الأثر
    prompt: >
      صف من يتأثر وكيف. أدرج الجدول الزمني للتغييرات.
      أجب باللغة العربية.
  - title: بنود الإجراءات
    prompt: >
      اذكر بنود إجراءات محددة مع تحديد المسؤولين والمواعيد النهائية.
      أجب باللغة العربية.
export:
  - markdown
  - html
