id: sop-v1-ar
name: إجراء التشغيل الموحد
type: document
description: إجراء تشغيلي خطوة بخطوة مع الأدوار والمتطلبات المسبقة وخطوات التحقق (النسخة العربية)
locale: ar
sections:
  - title: الغرض
    prompt: >
      حدد الغرض من هذا الإجراء ومتى يجب اتباعه. أجب باللغة العربية.
  - title: النطاق
    prompt: >
      حدد على من ينطبق هذا الإجراء وفي أي ظروف. أجب باللغة العربية.
  - title: المتطلبات المسبقة
    prompt: >
      اذكر جميع المتطلبات المسبقة والأدوات وحقوق الوصول والصلاحيات
      اللازمة قبل بدء هذا الإجراء. أجب باللغة العربية.
  - title: خطوات الإجراء
    prompt: >
      قدم تعليمات تفصيلية خطوة بخطوة. رقم كل خطوة.
      اذكر النتائج المتوقعة لكل خطوة. أجب باللغة العربية.
  - title: التحقق
    prompt: >
      صف كيفية التحقق من إكمال الإجراء بنجاح. أجب باللغة العربية.
  - title: استكشاف الأخطاء وإصلاحها
    prompt: >
      اذكر المشكلات الشائعة وحلولها. أجب باللغة العربية.
export:
  - markdown
  - html
