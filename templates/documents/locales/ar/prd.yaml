id: prd-v1-ar
name: وثيقة متطلبات المنتج
type: document
description: وثيقة متطلبات المنتج القياسية مع المشكلة والحل والنطاق ومعايير النجاح (النسخة العربية)
locale: ar
sections:
  - title: بيان المشكلة
    prompt: >
      لخص المشكلة الجوهرية التي يعالجها هذا المنتج،
      مع الاستشهاد بالمواد المصدرية ذات الصلة. أجب باللغة العربية.
    required_sources:
      - type: local
        min: 1
  - title: الحل المقترح
    prompt: >
      صف الحل المقترح، مع الإشارة إلى القيود التقنية
      والأعمال السابقة من المصادر. أجب باللغة العربية.
  - title: النطاق
    prompt: >
      حدد ما هو ضمن النطاق وما هو خارج النطاق
      للإصدار الأولي. أجب باللغة العربية.
  - title: معايير النجاح
    prompt: >
      اذكر معايير نجاح قابلة للقياس مع أهداف محددة. أجب باللغة العربية.
  - title: المخاطر والإجراءات التخفيفية
    prompt: >
      حدد المخاطر والإجراءات التخفيفية المقترحة، مع الاستشهاد
      بالمواد المصدرية حيثما ينطبق ذلك. أجب باللغة العربية.
export:
  - markdown
  - html
