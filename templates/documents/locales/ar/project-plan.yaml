id: project-plan-v1-ar
name: خطة المشروع
type: document
description: خطة مشروع شاملة تتضمن الجدول الزمني والمعالم والمسؤولين والمخاطر (النسخة العربية)
locale: ar
sections:
  - title: ملخص المشروع
    prompt: >
      ملخص تنفيذي من فقرة واحدة يتضمن الهدف والنطاق والمسؤول وتاريخ
      الإنجاز المستهدف والحالة الراهنة. أجب باللغة العربية.
    required_sources:
      - type: local
        min: 1
  - title: الأهداف ومعايير النجاح
    prompt: >
      اذكر الأهداف (كيف يبدو النجاح) والمعايير القابلة للقياس التي
      سيُقيَّم المشروع على أساسها. أجب باللغة العربية.
  - title: النطاق
    prompt: >
      حدد ما هو داخل النطاق وخارجه وما تم تأجيله صراحة. استشهد بالمواد
      المصدرية عند الاقتضاء. أجب باللغة العربية.
  - title: المعالم والجدول الزمني
    prompt: >
      جدول بالمعالم يتضمن التاريخ المستهدف والمخرج والمسؤول ومعايير
      القبول. أدرج ملاحظات عن المسار الحرج. أجب باللغة العربية.
  - title: الموارد والفريق
    prompt: >
      اذكر أعضاء الفريق وأدوارهم ونسب تخصيصهم وأي تبعيات بين الوظائف.
      أجب باللغة العربية.
  - title: المخاطر وإجراءات التخفيف
    prompt: >
      صنف أبرز المخاطر مع احتمال حدوثها وأثرها والمسؤول عنها وإجراء
      التخفيف المخطط له. أجب باللغة العربية.
  - title: التبعيات
    prompt: >
      وثّق التبعيات الخارجية والداخلية مع المسؤول والحالة. أبرز
      العوائق. أجب باللغة العربية.
  - title: خطة التواصل
    prompt: >
      صف وتيرة الاجتماعات وتواتر تقارير الحالة ومسارات التصعيد.
      أجب باللغة العربية.
export:
  - markdown
  - html
  - pdf
  - docx
