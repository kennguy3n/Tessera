id: task-list-v1-ar
name: قائمة المهام
type: document
description: قائمة مهام مرتبة حسب الأولوية مع المكلفين والمواعيد النهائية والتبعيات (النسخة العربية)
locale: ar
sections:
  - title: السياق
    prompt: >
      سياق فقرة واحدة لقائمة المهام هذه — ما المبادرة
      أو المشروع الذي تخدمه والوضع الحالي. أجب باللغة العربية.
    required_sources:
      - type: local
        min: 0
  - title: المسار الحرج
    prompt: >
      اذكر المهام التي يجب اكتمالها في الموعد المحدد ليكون الجهد
      الأشمل ناجحاً. يجب أن يتضمن كل عنصر المسؤول والموعد النهائي.
      أجب باللغة العربية.
  - title: قيد التنفيذ
    prompt: >
      المهام الجاري العمل عليها حالياً، مع المسؤول والوضع الحالي
      والعوائق والاكتمال المتوقع. أجب باللغة العربية.
  - title: التالي
    prompt: >
      المهام المُدرجة في الطابور للسباق أو الدورة التالية، مع ترتيب
      الأولوية والمسؤول. أجب باللغة العربية.
  - title: المهام المؤجلة
    prompt: >
      المهام منخفضة الأولوية غير المُجدولة بعد، مع الأولوية
      وتقدير الجهد التقريبي. أجب باللغة العربية.
  - title: المكتملة
    prompt: >
      المهام المكتملة مؤخراً، مع تاريخ الاكتمال وملخص النتيجة
      لإمكانية التتبع. أجب باللغة العربية.
  - title: الملاحظات والتبعيات
    prompt: >
      التبعيات بين المهام والقرارات المؤثرة على الأولوية
      وأي عوائق تحتاج إلى تصعيد. أجب باللغة العربية.
export:
  - markdown
  - html
  - csv
