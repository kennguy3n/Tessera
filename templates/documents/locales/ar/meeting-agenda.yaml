id: meeting-agenda-v1-ar
name: جدول أعمال الاجتماع
type: document
description: جدول أعمال منظم مع الأهداف والحاضرين والمواضيع والتوقيت (النسخة العربية)
locale: ar
sections:
  - title: نظرة عامة على الاجتماع
    prompt: >
      سجل عنوان الاجتماع والتاريخ والوقت والمكان/رابط الفيديو
      وهدف بسطر واحد. أشر إلى مصدر الجدولة إن وجد. أجب باللغة العربية.
  - title: الحاضرون
    prompt: >
      اذكر الحاضرين الإلزاميين والاختياريين مع أدوارهم
      أو انتماءاتهم. اذكر أي مواد قراءة مسبقة يجب عليهم الاطلاع عليها.
      أجب باللغة العربية.
  - title: الأهداف
    prompt: >
      عدد من 2 إلى 5 نتائج محددة يجب أن يحققها الاجتماع.
      يجب أن يكون كل هدف قابلاً للقياس (قرار يُتخذ / مخرج يُنتج).
      أجب باللغة العربية.
  - title: بنود جدول الأعمال
    prompt: >
      لكل بند في جدول الأعمال، سجل الموضوع والمسؤول والوقت المخصص
      والنتيجة المرجوة وأي روابط للقراءة المسبقة. أجب باللغة العربية.
    required_sources:
      - type: local
        min: 0
  - title: القرارات المطلوبة
    prompt: >
      اذكر القرارات التي يجب اتخاذها خلال الاجتماع.
      يجب أن يشير كل قرار إلى بند جدول الأعمال ذي الصلة. أجب باللغة العربية.
  - title: القراءات المسبقة
    prompt: >
      اربط بالمواد المصدرية التي يجب على الحاضرين مراجعتها مسبقاً.
      أجب باللغة العربية.
  - title: المتابعات
    prompt: >
      احفظ مساحة لبنود العمل الملتقطة خلال الاجتماع،
      ليتم تعبئتها بعد الاجتماع. أجب باللغة العربية.
export:
  - markdown
  - html
  - pdf
