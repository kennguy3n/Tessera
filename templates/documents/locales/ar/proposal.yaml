id: proposal-v1-ar
name: مقترح
type: document
description: مقترح أعمال أو مشروع مع ملخص تنفيذي ومنهجية وجدول زمني وميزانية (النسخة العربية)
locale: ar
sections:
  - title: الملخص التنفيذي
    prompt: >
      قدم نظرة عامة موجزة عن المقترح، بما في ذلك الفرصة
      والمنهجية الموصى بها والنتائج المتوقعة. أجب باللغة العربية.
  - title: الخلفية
    prompt: >
      صف السياق والخلفية التي أدت إلى هذا المقترح.
      أشر إلى المواد المصدرية ذات الصلة. أجب باللغة العربية.
    required_sources:
      - type: local
        min: 1
  - title: المنهجية المقترحة
    prompt: >
      اشرح بالتفصيل المنهجية الموصى بها والأسلوب
      والأنشطة الرئيسية. أجب باللغة العربية.
  - title: الجدول الزمني
    prompt: >
      حدد الجدول الزمني للمشروع مع المعالم الرئيسية والمخرجات.
      أجب باللغة العربية.
  - title: الميزانية
    prompt: >
      اعرض الميزانية المقدرة مع البنود والمبررات.
      أجب باللغة العربية.
  - title: النتائج المتوقعة
    prompt: >
      صف النتائج المتوقعة وكيف سيتم قياس النجاح.
      أجب باللغة العربية.
export:
  - markdown
  - html
