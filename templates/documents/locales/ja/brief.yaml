id: brief-v1-ja
name: ブリーフ
type: document
description: 目的、対象者、成果物、スケジュールを含む簡潔なプロジェクトまたはキャンペーンのブリーフ（日本語版）
locale: ja
sections:
  - title: ブリーフのタイトルと背景
    prompt: >
      タイトル、依頼者、担当者、目標完了日、および一段落の背景
      要約を記載してください。日本語で回答してください。
    required_sources:
      - type: local
        min: 0
  - title: 目的
    prompt: >
      このブリーフが達成を求める単一の明確な目的。複数の目的を
      持つブリーフは避け、必要に応じて分割してください。
      日本語で回答してください。
  - title: 背景
    prompt: >
      関連する背景と過去の作業を、出典資料を参照しながら記述して
      ください。調査、過去のブリーフ、関連する成果物へのリンクも
      含めてください。日本語で回答してください。
    required_sources:
      - type: local
        min: 0
  - title: 対象者
    prompt: >
      成果物が誰に向けたものかを示してください。主要な対象、副次的な
      対象、および明示的に対象外とする層を含めてください。
      日本語で回答してください。
  - title: キーメッセージ
    prompt: >
      成果物で必ず伝えるべき上位3〜5件のメッセージ。それぞれ
      1文で記載してください。日本語で回答してください。
  - title: 成果物
    prompt: >
      期待される具体的な成果物を、形式、分量、チャネルとともに
      列挙してください。日本語で回答してください。
  - title: 成功指標
    prompt: >
      成功をどのように測定するか。可能な限り定量的に示してください。
      日本語で回答してください。
  - title: スケジュールとマイルストーン
    prompt: >
      目標日と担当者を含む主要なマイルストーン。
      日本語で回答してください。
  - title: 制約事項
    prompt: >
      成果物が遵守すべき予算、範囲、ブランド、法務などの制約事項。
      日本語で回答してください。
export:
  - markdown
  - html
  - pdf
