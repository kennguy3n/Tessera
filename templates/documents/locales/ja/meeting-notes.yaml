id: meeting-notes-v1-ja
name: 会議議事録
type: document
description: 決定事項とアクションを含む、会議中または会議後に記録された構造化された議事録（日本語版）
locale: ja
sections:
  - title: 会議メタデータ
    prompt: >
      会議のタイトル、日付、出席者および欠席者、ファシリテーター、
      記録係を記載してください。該当する場合は議題を参照してください。
      日本語で回答してください。
    required_sources:
      - type: local
        min: 0
  - title: 概要
    prompt: >
      会議の一段落の要約 — 高レベルで議論された内容と全体的な結果を
      記述してください。日本語で回答してください。
  - title: 討議内容
    prompt: >
      議題ごとの議事録として、提起された主要なポイント、共有された
      視点、決定に至った背景を記録してください。日本語で回答してください。
  - title: 決定事項
    prompt: >
      下された決定、その根拠、責任者、および条件やフォローアップを
      列挙してください。該当する出典を参照してください。日本語で回答してください。
  - title: アクションアイテム
    prompt: >
      担当者、期限、受入基準を含むアクションアイテム。それぞれは
      測定可能でなければなりません。日本語で回答してください。
  - title: リスクと未解決事項
    prompt: >
      提起されたリスク、フォローアップが必要な未解決事項、および
      各項目の追跡担当者を記録してください。日本語で回答してください。
  - title: 次のステップ
    prompt: >
      次回会議の日程（該当する場合）および次のチェックポイントの
      トリガーを含む、次に起こることを概説してください。日本語で回答してください。
export:
  - markdown
  - html
  - pdf
  - docx
