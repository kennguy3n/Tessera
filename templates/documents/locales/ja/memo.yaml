id: memo-v1-ja
name: メモ
type: document
description: 背景、決定事項、アクションアイテムを含む社内連絡メモ（日本語版）
locale: ja
sections:
  - title: 件名
    prompt: >
      このメモの件名を明確かつ簡潔に記載してください。
      日本語で回答してください。
  - title: 背景
    prompt: >
      伝達する決定事項や情報を受信者が理解するために必要な
      背景情報を提供してください。日本語で回答してください。
  - title: 決定事項または情報
    prompt: >
      伝達する決定事項、方針変更、または情報を記載してください。
      何が、なぜ変わるのかを具体的に示してください。
      日本語で回答してください。
  - title: 影響
    prompt: >
      誰がどのように影響を受けるかを記述してください。変更の
      スケジュールも含めてください。日本語で回答してください。
  - title: アクションアイテム
    prompt: >
      担当者と期限を明記した具体的なアクションアイテムを
      列挙してください。日本語で回答してください。
export:
  - markdown
  - html
