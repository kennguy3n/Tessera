id: project-plan-v1-ja
name: プロジェクト計画書
type: document
description: スケジュール、マイルストーン、担当者、リスクを含む包括的なプロジェクト計画書（日本語版）
locale: ja
sections:
  - title: プロジェクト概要
    prompt: >
      目的、範囲、担当者、目標完了日、現在の状況を含む一段落の
      エグゼクティブサマリー。日本語で回答してください。
    required_sources:
      - type: local
        min: 1
  - title: 目標と成功基準
    prompt: >
      目標（成功とはどのような状態か）と、プロジェクトを評価する
      測定可能な基準を箇条書きで示してください。
      日本語で回答してください。
  - title: 範囲
    prompt: >
      範囲内、範囲外、および明示的に保留とする事項を明確にし、
      該当する場合は出典資料を参照してください。
      日本語で回答してください。
  - title: マイルストーンとスケジュール
    prompt: >
      目標日、成果物、担当者、受け入れ基準を含むマイルストーンの
      表を作成してください。クリティカルパスに関する注記も
      含めてください。日本語で回答してください。
  - title: リソースとチーム
    prompt: >
      チームメンバー、その役割と稼働配分、および部門横断的な
      依存関係を列挙してください。日本語で回答してください。
  - title: リスクと緩和策
    prompt: >
      主要なリスクを、発生可能性、影響度、担当者、および計画された
      緩和策とともに整理してください。日本語で回答してください。
  - title: 依存関係
    prompt: >
      外部および内部の依存関係を担当者と状況とともに記録し、
      ブロッカーを明示してください。日本語で回答してください。
  - title: コミュニケーション計画
    prompt: >
      会議の頻度、状況報告の頻度、エスカレーションの経路を
      記述してください。日本語で回答してください。
export:
  - markdown
  - html
  - pdf
  - docx
