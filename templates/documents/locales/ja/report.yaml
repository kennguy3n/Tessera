id: report-v1-ja
name: レポート
type: document
description: 発見事項、分析、推奨事項を含む分析レポート（日本語版）
locale: ja
sections:
  - title: エグゼクティブサマリー
    prompt: >
      本レポートの主要な発見事項と推奨事項を要約してください。
      日本語で回答してください。
  - title: 方法論
    prompt: >
      データ収集と分析に用いた方法論を記述してください。
      日本語で回答してください。
  - title: 発見事項
    prompt: >
      出典からのデータに裏付けられた主要な発見事項を提示して
      ください。関連する統計と証拠を含めてください。
      日本語で回答してください。
    required_sources:
      - type: local
        min: 1
  - title: 分析
    prompt: >
      発見事項の詳細な分析を提供してください。パターン、傾向、
      影響を特定してください。日本語で回答してください。
  - title: 推奨事項
    prompt: >
      分析に基づき、実行可能な推奨事項を列挙してください。
      影響度と実現性で優先順位を付けてください。
      日本語で回答してください。
  - title: 付録
    prompt: >
      補足データ、参考資料、補助資料を含めてください。
      日本語で回答してください。
export:
  - markdown
  - html
  - csv
