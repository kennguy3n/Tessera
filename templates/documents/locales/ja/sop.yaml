id: sop-v1-ja
name: 標準作業手順書
type: document
description: 役割、前提条件、確認ステップを含む段階的な作業手順書（日本語版）
locale: ja
sections:
  - title: 目的
    prompt: >
      この手順の目的と、いつ従うべきかを明示してください。
      日本語で回答してください。
  - title: 適用範囲
    prompt: >
      この手順が誰に、どのような状況で適用されるかを
      定義してください。日本語で回答してください。
  - title: 前提条件
    prompt: >
      手順を開始する前に必要な前提条件、ツール、アクセス権、
      権限をすべて列挙してください。日本語で回答してください。
  - title: 手順ステップ
    prompt: >
      段階的な詳細手順を提供してください。各ステップに番号を
      振り、期待される結果を含めてください。
      日本語で回答してください。
  - title: 確認
    prompt: >
      手順が正常に完了したかをどのように確認するかを
      記述してください。日本語で回答してください。
  - title: トラブルシューティング
    prompt: >
      一般的な問題とその解決策を列挙してください。
      日本語で回答してください。
export:
  - markdown
  - html
