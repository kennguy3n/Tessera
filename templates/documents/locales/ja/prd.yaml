id: prd-v1-ja
name: 製品要件定義書
type: document
description: 問題、解決策、範囲、成功基準を含む標準PRD（日本語版）
locale: ja
sections:
  - title: 問題の定義
    prompt: >
      この製品が解決すべき中核的な問題を、関連する出典資料を
      引用しながら要約してください。日本語で回答してください。
    required_sources:
      - type: local
        min: 1
  - title: 提案する解決策
    prompt: >
      技術的制約や先行事例を参照しながら、提案する解決策を
      記述してください。日本語で回答してください。
  - title: 範囲
    prompt: >
      初期リリースの範囲に含むものと含まないものを定義して
      ください。日本語で回答してください。
  - title: 成功基準
    prompt: >
      測定可能な成功基準と目標値を列挙してください。
      日本語で回答してください。
  - title: リスクと緩和策
    prompt: >
      関連する出典資料を引用しながら、リスクと提案する緩和策を
      特定してください。日本語で回答してください。
export:
  - markdown
  - html
