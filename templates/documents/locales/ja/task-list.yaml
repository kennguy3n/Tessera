id: task-list-v1-ja
name: タスクリスト
type: document
description: 担当者、期限、依存関係を含む優先順位付きのタスクリスト（日本語版）
locale: ja
sections:
  - title: コンテキスト
    prompt: >
      このタスクリストがサポートするイニシアチブまたはプロジェクトと
      現在のステータスを一段落で記述してください。日本語で回答してください。
    required_sources:
      - type: local
        min: 0
  - title: クリティカルパス
    prompt: >
      より広範な取り組みが成功するためにスケジュール通りに完了する
      必要があるタスクを列挙してください。それぞれに担当者と期限を
      含めてください。日本語で回答してください。
  - title: 進行中
    prompt: >
      現在作業中のタスク、担当者、現在のステータス、阻害要因、
      完了予定を含めてください。日本語で回答してください。
  - title: 次のキュー
    prompt: >
      次のスプリントまたはサイクル用にキューに入れられたタスクと、
      優先順位ランキングおよび担当者を記載してください。日本語で回答してください。
  - title: バックログ
    prompt: >
      まだスケジュールされていない低優先度のタスクと、優先順位および
      おおよその工数見積もりを記載してください。日本語で回答してください。
  - title: 完了済み
    prompt: >
      最近完了したタスク、完了日、トレーサビリティのための結果の
      要約を含めてください。日本語で回答してください。
  - title: 注記と依存関係
    prompt: >
      タスク間の依存関係、優先順位付けに影響する決定事項、および
      エスカレーションが必要な阻害要因を記載してください。日本語で回答してください。
export:
  - markdown
  - html
  - csv
