id: proposal-v1-ja
name: 提案書
type: document
description: 役員サマリー、アプローチ、スケジュール、予算を含むビジネス／プロジェクト提案書（日本語版）
locale: ja
sections:
  - title: エグゼクティブサマリー
    prompt: >
      機会、推奨アプローチ、期待される成果を含む提案の
      簡潔な概要を提示してください。日本語で回答してください。
  - title: 背景
    prompt: >
      この提案に至った背景と文脈を、関連する出典資料を
      参照しながら記述してください。日本語で回答してください。
    required_sources:
      - type: local
        min: 1
  - title: 提案するアプローチ
    prompt: >
      推奨されるアプローチ、方法論、主要な活動を詳細に
      記述してください。日本語で回答してください。
  - title: スケジュール
    prompt: >
      主要なマイルストーンと成果物を含むプロジェクトの
      スケジュールを示してください。日本語で回答してください。
  - title: 予算
    prompt: >
      項目別の概算予算と各項目の根拠を提示してください。
      日本語で回答してください。
  - title: 期待される成果
    prompt: >
      期待される成果と、成功をどのように測定するかを記述して
      ください。日本語で回答してください。
export:
  - markdown
  - html
