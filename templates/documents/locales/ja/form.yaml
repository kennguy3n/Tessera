id: form-v1-ja
name: フォーム
type: document
description: タイトル、説明、フィールド、提出方法のセクションを持つ汎用記入可能フォーム（日本語版）
locale: ja
sections:
  - title: フォームのタイトルと説明
    prompt: >
      フォームのタイトル、目的の簡潔な説明、回答者がフォームに記入する
      前に必要なコンテキストを記載してください。日本語で回答してください。
  - title: 回答者情報
    prompt: >
      回答者の識別情報（氏名、メールアドレス、役職、所属組織）
      および提出日を収集してください。日本語で回答してください。
  - title: フォームフィールド
    prompt: >
      フォームが収集する各フィールドを定義してください。すべての
      フィールドについて、ラベル、入力タイプ（テキスト、長文テキスト、
      単一選択、複数選択、日付、チェックボックス、数値、ファイルアップロード）、
      必須かどうか、デフォルト値または選択肢リストを記録してください。
      日本語で回答してください。
  - title: 検証と条件付きロジック
    prompt: >
      検証ルール（必須、正規表現、最小/最大、許容値）およびフィールド
      間の条件付き表示/非表示ロジックを記述してください。日本語で回答してください。
  - title: 提出方法
    prompt: >
      記入済みフォームの提出方法、レビュー担当者、想定される処理時間、
      回答者への結果通知方法を説明してください。日本語で回答してください。
  - title: プライバシーと保持
    prompt: >
      フォームデータの保管方法、アクセス権限、削除または匿名化までの
      保持期間を記載してください。日本語で回答してください。
export:
  - markdown
  - html
  - pdf
  - docx
