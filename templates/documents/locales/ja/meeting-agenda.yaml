id: meeting-agenda-v1-ja
name: 会議アジェンダ
type: document
description: 目的、参加者、議題、時間配分を含む構造化された会議アジェンダ（日本語版）
locale: ja
sections:
  - title: 会議の概要
    prompt: >
      会議名、日時、場所またはビデオ会議リンク、一文の目的を
      記録してください。日本語で回答してください。
  - title: 参加者
    prompt: >
      必須参加者と任意参加者を役割とともに列挙してください。
      事前に読むべき資料があれば明記してください。
      日本語で回答してください。
  - title: 目的
    prompt: >
      会議が達成すべき具体的な成果を2〜5項目挙げてください。
      各項目は測定可能であるべきです（意思決定または成果物の
      作成）。日本語で回答してください。
  - title: 議題項目
    prompt: >
      各議題について、トピック、責任者、割り当て時間、望ましい
      成果、事前資料のリンクを記録してください。
      日本語で回答してください。
    required_sources:
      - type: local
        min: 0
  - title: 必要な意思決定
    prompt: >
      会議で下すべき意思決定と、それを実行する責任者を
      明示してください。日本語で回答してください。
  - title: 次のステップ
    prompt: >
      次のステップ、フォローアップ項目、次回会議または
      チェックポイントを示してください。日本語で回答してください。
export:
  - markdown
  - html
