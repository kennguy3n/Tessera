id: task-list-v1-hi
name: कार्य सूची
type: document
description: कर्तव्यभारियों, नियत तारीखों और निर्भरताओं के साथ प्राथमिकता वाली कार्य सूची (हिंदी संस्करण)
locale: hi
sections:
  - title: संदर्भ
    prompt: >
      इस कार्य सूची के लिए एक-पैराग्राफ संदर्भ — यह किस पहल या परियोजना
      की सेवा करती है और वर्तमान स्थिति। हिंदी में उत्तर दें।
    required_sources:
      - type: local
        min: 0
  - title: महत्वपूर्ण पथ
    prompt: >
      उन कार्यों की सूची बनाएं जो व्यापक प्रयास के सफल होने के लिए
      समय पर पूरे होने चाहिए। प्रत्येक में मालिक और नियत तारीख
      शामिल होनी चाहिए। हिंदी में उत्तर दें।
  - title: प्रगति में
    prompt: >
      वर्तमान में जिन कार्यों पर काम चल रहा है, मालिक, वर्तमान स्थिति,
      अवरोधक और अपेक्षित पूर्णता के साथ। हिंदी में उत्तर दें।
  - title: आगे की पंक्ति
    prompt: >
      अगले स्प्रिंट या चक्र के लिए कतार में लगाए गए कार्य, प्राथमिकता
      रैंकिंग और मालिक के साथ। हिंदी में उत्तर दें।
  - title: बैकलॉग
    prompt: >
      अभी तक अनुसूचित नहीं किए गए कम-प्राथमिकता वाले कार्य, प्राथमिकता
      और मोटे प्रयास अनुमान के साथ। हिंदी में उत्तर दें।
  - title: पूर्ण
    prompt: >
      हाल ही में पूरे किए गए कार्य, ट्रेसेबिलिटी के लिए पूर्णता तिथि
      और परिणाम सारांश के साथ। हिंदी में उत्तर दें।
  - title: नोट्स और निर्भरताएँ
    prompt: >
      क्रॉस-टास्क निर्भरताएँ, प्राथमिकता को प्रभावित करने वाले निर्णय
      और एस्केलेशन की आवश्यकता वाले कोई अवरोधक। हिंदी में उत्तर दें।
export:
  - markdown
  - html
  - csv
