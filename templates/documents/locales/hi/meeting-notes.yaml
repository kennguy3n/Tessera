id: meeting-notes-v1-hi
name: बैठक के नोट्स
type: document
description: निर्णयों और कार्रवाइयों के साथ बैठक के दौरान या बाद में कैप्चर किए गए संरचित नोट्स (हिंदी संस्करण)
locale: hi
sections:
  - title: बैठक मेटाडेटा
    prompt: >
      बैठक का शीर्षक, तारीख, उपस्थित और अनुपस्थित लोग, सूत्रधार
      और नोटटेकर को कैप्चर करें। यदि कोई कार्यसूची है तो संदर्भ दें।
      हिंदी में उत्तर दें।
    required_sources:
      - type: local
        min: 0
  - title: सारांश
    prompt: >
      बैठक का एक-पैराग्राफ सारांश — उच्च स्तर पर क्या चर्चा हुई
      और समग्र परिणाम। हिंदी में उत्तर दें।
  - title: चर्चा नोट्स
    prompt: >
      विषय-वार नोट्स जो उठाए गए प्रमुख बिंदुओं, साझा किए गए
      दृष्टिकोणों और निर्णयों को प्रभावित करने वाले संदर्भ को कैप्चर करते हैं।
      हिंदी में उत्तर दें।
  - title: निर्णय
    prompt: >
      लिए गए निर्णयों, औचित्य, मालिक और किसी भी शर्तों या अनुवर्ती
      कार्रवाई की सूची बनाएं। प्रासंगिक स्रोत सामग्री का संदर्भ दें।
      हिंदी में उत्तर दें।
  - title: कार्रवाई आइटम
    prompt: >
      मालिक, नियत तारीख और स्वीकृति मानदंड के साथ कार्रवाई आइटम।
      प्रत्येक मापने योग्य होना चाहिए। हिंदी में उत्तर दें।
  - title: जोखिम और खुले प्रश्न
    prompt: >
      उठाए गए जोखिम, अनुवर्ती कार्रवाई की आवश्यकता वाले खुले प्रश्न
      और प्रत्येक आइटम का पीछा करने वाला कौन है, कैप्चर करें।
      हिंदी में उत्तर दें।
  - title: अगले कदम
    prompt: >
      अगली बैठक की तारीख (यदि कोई हो) और अगले चेकपॉइंट के ट्रिगर
      सहित आगे क्या होगा, इसकी रूपरेखा तैयार करें। हिंदी में उत्तर दें।
export:
  - markdown
  - html
  - pdf
  - docx
