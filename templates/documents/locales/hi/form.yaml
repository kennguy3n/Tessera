id: form-v1-hi
name: फ़ॉर्म
type: document
description: शीर्षक, विवरण, फ़ील्ड और सबमिशन निर्देशों के लिए अनुभागों के साथ सामान्य-उद्देश्य भरने योग्य फ़ॉर्म (हिंदी संस्करण)
locale: hi
sections:
  - title: फ़ॉर्म शीर्षक और विवरण
    prompt: >
      फ़ॉर्म का शीर्षक, संक्षिप्त उद्देश्य कथन और प्रतिवादी को फ़ॉर्म
      पूरा करने से पहले आवश्यक कोई भी संदर्भ कैप्चर करें।
      हिंदी में उत्तर दें।
  - title: प्रतिवादी की जानकारी
    prompt: >
      प्रतिवादी के पहचान विवरण (नाम, ईमेल, भूमिका, संगठन) और
      सबमिशन की तारीख एकत्र करें। हिंदी में उत्तर दें।
  - title: फ़ॉर्म फ़ील्ड
    prompt: >
      फ़ॉर्म जो प्रत्येक फ़ील्ड एकत्र करता है उसे परिभाषित करें। प्रत्येक
      फ़ील्ड के लिए लेबल, इनपुट प्रकार (पाठ, लंबा पाठ, एकल चयन, बहु-चयन,
      तारीख, चेकबॉक्स, संख्या, फ़ाइल अपलोड), क्या यह आवश्यक है, और
      कोई डिफ़ॉल्ट मान या विकल्प सूची रिकॉर्ड करें। हिंदी में उत्तर दें।
  - title: सत्यापन और सशर्त तर्क
    prompt: >
      सत्यापन नियमों (आवश्यक, रेगेक्स, न्यूनतम/अधिकतम, अनुमत मान)
      और फ़ील्ड के बीच किसी भी सशर्त दिखाएं/छिपाएं तर्क का वर्णन करें।
      हिंदी में उत्तर दें।
  - title: सबमिशन निर्देश
    prompt: >
      समझाएं कि पूरा किया गया फ़ॉर्म कैसे जमा किया जाना चाहिए, कौन
      समीक्षा करता है, अपेक्षित प्रतिक्रिया समय और प्रतिवादी को परिणाम
      के बारे में कैसे सूचित किया जाएगा। हिंदी में उत्तर दें।
  - title: गोपनीयता और प्रतिधारण
    prompt: >
      बताएं कि फ़ॉर्म डेटा कैसे संग्रहीत किया जाता है, कौन इस तक पहुंच
      सकता है, और इसे हटाने या गुमनाम करने से पहले कितने समय तक रखा
      जाता है। हिंदी में उत्तर दें।
export:
  - markdown
  - html
  - pdf
  - docx
