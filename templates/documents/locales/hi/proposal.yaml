id: proposal-v1-hi
name: प्रस्ताव
type: document
description: कार्यकारी सारांश, दृष्टिकोण, समयरेखा और बजट के साथ व्यावसायिक या परियोजना प्रस्ताव (हिंदी संस्करण)
locale: hi
sections:
  - title: कार्यकारी सारांश
    prompt: >
      प्रस्ताव का संक्षिप्त अवलोकन प्रदान करें, जिसमें अवसर,
      अनुशंसित दृष्टिकोण और अपेक्षित परिणाम शामिल हों। हिंदी में उत्तर दें।
  - title: पृष्ठभूमि
    prompt: >
      उस संदर्भ और पृष्ठभूमि का वर्णन करें जिसके कारण यह प्रस्ताव बना।
      प्रासंगिक स्रोत सामग्री का संदर्भ दें। हिंदी में उत्तर दें।
    required_sources:
      - type: local
        min: 1
  - title: प्रस्तावित दृष्टिकोण
    prompt: >
      अनुशंसित दृष्टिकोण, कार्यप्रणाली और प्रमुख गतिविधियों
      का विस्तार से वर्णन करें। हिंदी में उत्तर दें।
  - title: समयरेखा
    prompt: >
      प्रमुख मील के पत्थर और डिलीवरेबल्स के साथ परियोजना की समयरेखा
      की रूपरेखा तैयार करें। हिंदी में उत्तर दें।
  - title: बजट
    prompt: >
      अनुमानित बजट को लाइन आइटम और औचित्य के साथ प्रस्तुत करें।
      हिंदी में उत्तर दें।
  - title: अपेक्षित परिणाम
    prompt: >
      अपेक्षित परिणामों का वर्णन करें और सफलता को कैसे मापा जाएगा।
      हिंदी में उत्तर दें।
export:
  - markdown
  - html
