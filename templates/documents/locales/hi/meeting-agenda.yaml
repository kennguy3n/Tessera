id: meeting-agenda-v1-hi
name: बैठक की कार्यसूची
type: document
description: उद्देश्यों, उपस्थित लोगों, विषयों और समय के साथ संरचित कार्यसूची (हिंदी संस्करण)
locale: hi
sections:
  - title: बैठक का अवलोकन
    prompt: >
      बैठक का शीर्षक, तारीख, समय, स्थान/वीडियो लिंक और एक-पंक्ति का
      उद्देश्य दर्ज करें। यदि कोई शेड्यूलिंग स्रोत है तो संदर्भ दें।
      हिंदी में उत्तर दें।
  - title: उपस्थित लोग
    prompt: >
      आवश्यक और वैकल्पिक उपस्थित लोगों को उनकी भूमिकाओं या संबद्धताओं
      के साथ सूचीबद्ध करें। उन्हें किस सामग्री को पहले से पढ़ना चाहिए
      उसका उल्लेख करें। हिंदी में उत्तर दें।
  - title: उद्देश्य
    prompt: >
      2-5 विशिष्ट परिणामों की गणना करें जो बैठक को प्राप्त करने चाहिए।
      प्रत्येक मापने योग्य होना चाहिए (निर्णय लिया गया / कलाकृति
      तैयार की गई)। हिंदी में उत्तर दें।
  - title: कार्यसूची आइटम
    prompt: >
      प्रत्येक कार्यसूची आइटम के लिए, विषय, मालिक, आवंटित समय,
      वांछित परिणाम और कोई भी पूर्व-पठन लिंक दर्ज करें। हिंदी में उत्तर दें।
    required_sources:
      - type: local
        min: 0
  - title: आवश्यक निर्णय
    prompt: >
      बैठक के दौरान लिए जाने वाले निर्णयों की सूची बनाएं।
      प्रत्येक को संबंधित कार्यसूची आइटम का संदर्भ देना चाहिए।
      हिंदी में उत्तर दें।
  - title: पूर्व-पठन
    prompt: >
      उन स्रोत सामग्री से लिंक करें जिन्हें उपस्थित लोगों को पहले से
      देखना चाहिए। हिंदी में उत्तर दें।
  - title: अनुवर्ती कार्रवाई
    prompt: >
      बैठक के दौरान कैप्चर की गई कार्रवाई आइटम के लिए स्थान आरक्षित करें,
      जो बैठक के बाद भरी जाएगी। हिंदी में उत्तर दें।
export:
  - markdown
  - html
  - pdf
