id: project-plan-v1-hi
name: परियोजना योजना
type: document
description: समयरेखा, मील के पत्थर, उत्तरदाताओं और जोखिमों सहित व्यापक परियोजना योजना (हिंदी संस्करण)
locale: hi
sections:
  - title: परियोजना सारांश
    prompt: >
      उद्देश्य, कार्यक्षेत्र, उत्तरदाता, लक्षित पूर्णता तिथि और वर्तमान
      स्थिति सहित एक-अनुच्छेद का कार्यकारी सारांश। हिंदी में उत्तर दें।
    required_sources:
      - type: local
        min: 1
  - title: उद्देश्य और सफलता के मानदंड
    prompt: >
      उद्देश्यों (सफलता कैसी दिखती है) और उन मापन योग्य मानदंडों को
      सूचीबद्ध करें जिनके आधार पर परियोजना का मूल्यांकन किया जाएगा।
      हिंदी में उत्तर दें।
  - title: कार्यक्षेत्र
    prompt: >
      निर्दिष्ट करें कि क्या कार्यक्षेत्र में है, क्या बाहर है और क्या
      स्पष्ट रूप से स्थगित है। प्रासंगिक होने पर स्रोत सामग्री का संदर्भ
      दें। हिंदी में उत्तर दें।
  - title: मील के पत्थर और समयरेखा
    prompt: >
      लक्षित तिथि, डिलीवरेबल, उत्तरदाता और स्वीकृति मानदंड सहित मील के
      पत्थरों की तालिका। क्रांतिक पथ संबंधी टिप्पणियाँ शामिल करें।
      हिंदी में उत्तर दें।
  - title: संसाधन और टीम
    prompt: >
      टीम के सदस्यों, उनकी भूमिकाओं और आवंटन, तथा किसी भी अंतर-कार्यात्मक
      निर्भरता को सूचीबद्ध करें। हिंदी में उत्तर दें।
  - title: जोखिम और शमन उपाय
    prompt: >
      प्रमुख जोखिमों को उनकी संभावना, प्रभाव, उत्तरदाता और नियोजित शमन
      उपाय सहित सूचीबद्ध करें। हिंदी में उत्तर दें।
  - title: निर्भरताएँ
    prompt: >
      बाहरी और आंतरिक निर्भरताओं को उत्तरदाता और स्थिति सहित प्रलेखित
      करें। अवरोधकों को चिह्नित करें। हिंदी में उत्तर दें।
  - title: संचार योजना
    prompt: >
      बैठक की आवृत्ति, स्थिति रिपोर्ट की आवृत्ति और एस्केलेशन के मार्गों
      का वर्णन करें। हिंदी में उत्तर दें।
export:
  - markdown
  - html
  - pdf
  - docx
