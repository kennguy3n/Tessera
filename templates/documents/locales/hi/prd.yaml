id: prd-v1-hi
name: उत्पाद आवश्यकता दस्तावेज़
type: document
description: समस्या, समाधान, दायरा और सफलता मानदंडों के साथ मानक PRD (हिंदी संस्करण)
locale: hi
sections:
  - title: समस्या विवरण
    prompt: >
      उस मूल समस्या का सारांश दें जिसे यह उत्पाद संबोधित करता है,
      और प्रासंगिक स्रोत सामग्री का उद्धरण दें। हिंदी में उत्तर दें।
    required_sources:
      - type: local
        min: 1
  - title: प्रस्तावित समाधान
    prompt: >
      प्रस्तावित समाधान का वर्णन करें, तकनीकी बाधाओं और स्रोतों से
      पूर्व कला का संदर्भ देते हुए। हिंदी में उत्तर दें।
  - title: दायरा
    prompt: >
      परिभाषित करें कि प्रारंभिक रिलीज़ के लिए दायरे में क्या है
      और क्या नहीं है। हिंदी में उत्तर दें।
  - title: सफलता मानदंड
    prompt: >
      लक्ष्यों के साथ मापने योग्य सफलता मानदंड सूचीबद्ध करें। हिंदी में उत्तर दें।
  - title: जोखिम और शमन
    prompt: >
      जोखिमों और प्रस्तावित शमन उपायों की पहचान करें,
      लागू होने पर स्रोत सामग्री का उद्धरण दें। हिंदी में उत्तर दें।
export:
  - markdown
  - html
