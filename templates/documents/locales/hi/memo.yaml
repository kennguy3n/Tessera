id: memo-v1-hi
name: ज्ञापन
type: document
description: संदर्भ, निर्णय और कार्य बिंदुओं सहित आंतरिक संचार ज्ञापन (हिंदी संस्करण)
locale: hi
sections:
  - title: विषय
    prompt: >
      इस ज्ञापन का विषय स्पष्ट और संक्षिप्त रूप से बताएं।
      हिंदी में उत्तर दें।
  - title: संदर्भ
    prompt: >
      वह पृष्ठभूमि संदर्भ प्रदान करें जिसकी प्राप्तकर्ताओं को संप्रेषित
      किए जा रहे निर्णय या जानकारी को समझने के लिए आवश्यकता है।
      हिंदी में उत्तर दें।
  - title: निर्णय या जानकारी
    prompt: >
      संप्रेषित किया जा रहा निर्णय, नीति परिवर्तन या जानकारी बताएं।
      क्या बदल रहा है और क्यों, इस बारे में विशिष्ट रहें।
      हिंदी में उत्तर दें।
  - title: प्रभाव
    prompt: >
      वर्णन करें कि कौन और कैसे प्रभावित होता है। परिवर्तनों की समयरेखा
      शामिल करें। हिंदी में उत्तर दें।
  - title: कार्य बिंदु
    prompt: >
      उत्तरदाताओं और समय-सीमाओं सहित विशिष्ट कार्य बिंदुओं की सूची बनाएं।
      हिंदी में उत्तर दें।
export:
  - markdown
  - html
