id: brief-v1-hi
name: ब्रीफ
type: document
description: उद्देश्य, श्रोता, डिलीवरेबल्स और समयरेखा सहित संक्षिप्त परियोजना या अभियान ब्रीफ (हिंदी संस्करण)
locale: hi
sections:
  - title: ब्रीफ शीर्षक और संदर्भ
    prompt: >
      शीर्षक, अनुरोधकर्ता, उत्तरदाता, लक्षित पूर्णता तिथि और एक-अनुच्छेद
      का संदर्भ सारांश। हिंदी में उत्तर दें।
    required_sources:
      - type: local
        min: 0
  - title: उद्देश्य
    prompt: >
      एक एकल स्पष्ट उद्देश्य जिसे ब्रीफ प्राप्त करने के लिए कह रहा है।
      बहु-उद्देश्यीय ब्रीफ से बचें—आवश्यकता हो तो उन्हें विभाजित करें।
      हिंदी में उत्तर दें।
  - title: पृष्ठभूमि
    prompt: >
      प्रासंगिक पृष्ठभूमि और पूर्व कार्य, स्रोत सामग्री का संदर्भ देते
      हुए। शोध, पूर्व ब्रीफ या संबंधित कलाकृतियों के लिंक शामिल करें।
      हिंदी में उत्तर दें।
    required_sources:
      - type: local
        min: 0
  - title: श्रोता
    prompt: >
      डिलीवरेबल किसके लिए है। प्राथमिक, द्वितीयक और किसी भी स्पष्ट रूप से
      कार्यक्षेत्र से बाहर के श्रोताओं को शामिल करें। हिंदी में उत्तर दें।
  - title: मुख्य संदेश
    prompt: >
      शीर्ष 3-5 संदेश जो डिलीवरेबल में अवश्य प्रकट होने चाहिए। प्रत्येक
      एक वाक्य का होना चाहिए। हिंदी में उत्तर दें।
  - title: डिलीवरेबल्स
    prompt: >
      अपेक्षित ठोस डिलीवरेबल्स को प्रारूप, लंबाई और चैनल सहित सूचीबद्ध
      करें। हिंदी में उत्तर दें।
  - title: सफलता मेट्रिक्स
    prompt: >
      सफलता को कैसे मापा जाएगा। जहाँ संभव हो मात्रात्मक रूप से।
      हिंदी में उत्तर दें।
  - title: समयरेखा और मील के पत्थर
    prompt: >
      लक्षित तिथियों और उत्तरदाताओं सहित प्रमुख मील के पत्थर।
      हिंदी में उत्तर दें।
  - title: बाधाएँ
    prompt: >
      बजट, कार्यक्षेत्र, ब्रांड, कानूनी या अन्य बाधाएँ जिनका डिलीवरेबल को
      पालन करना चाहिए। हिंदी में उत्तर दें।
export:
  - markdown
  - html
  - pdf
