id: report-v1-hi
name: रिपोर्ट
type: document
description: निष्कर्षों, विश्लेषण और सिफारिशों के साथ विश्लेषणात्मक रिपोर्ट (हिंदी संस्करण)
locale: hi
sections:
  - title: कार्यकारी सारांश
    prompt: >
      इस रिपोर्ट के प्रमुख निष्कर्षों और सिफारिशों का सारांश दें।
      हिंदी में उत्तर दें।
  - title: कार्यप्रणाली
    prompt: >
      डेटा संग्रह और विश्लेषण के लिए उपयोग की गई कार्यप्रणाली का वर्णन करें।
      हिंदी में उत्तर दें।
  - title: निष्कर्ष
    prompt: >
      स्रोतों के डेटा द्वारा समर्थित प्रमुख निष्कर्ष प्रस्तुत करें।
      प्रासंगिक आँकड़े और साक्ष्य शामिल करें। हिंदी में उत्तर दें।
    required_sources:
      - type: local
        min: 1
  - title: विश्लेषण
    prompt: >
      निष्कर्षों का विस्तृत विश्लेषण प्रदान करें। पैटर्न, रुझान
      और निहितार्थों की पहचान करें। हिंदी में उत्तर दें।
  - title: सिफारिशें
    prompt: >
      विश्लेषण के आधार पर कार्रवाई योग्य सिफारिशें सूचीबद्ध करें।
      प्रभाव और व्यवहार्यता के अनुसार प्राथमिकता दें। हिंदी में उत्तर दें।
  - title: परिशिष्ट
    prompt: >
      सहायक डेटा, संदर्भ और पूरक सामग्री शामिल करें। हिंदी में उत्तर दें।
export:
  - markdown
  - html
  - csv
