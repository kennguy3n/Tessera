id: sop-v1-hi
name: मानक संचालन प्रक्रिया
type: document
description: भूमिकाओं, पूर्वापेक्षाओं और सत्यापन चरणों के साथ चरण-दर-चरण संचालन प्रक्रिया (हिंदी संस्करण)
locale: hi
sections:
  - title: उद्देश्य
    prompt: >
      इस प्रक्रिया का उद्देश्य बताएं और इसका पालन कब किया जाना चाहिए।
      हिंदी में उत्तर दें।
  - title: दायरा
    prompt: >
      परिभाषित करें कि यह प्रक्रिया किस पर लागू होती है और
      किन परिस्थितियों में। हिंदी में उत्तर दें।
  - title: पूर्वापेक्षाएँ
    prompt: >
      इस प्रक्रिया को शुरू करने से पहले आवश्यक सभी पूर्वापेक्षाओं,
      उपकरणों, पहुंच और अनुमतियों की सूची बनाएं। हिंदी में उत्तर दें।
  - title: प्रक्रिया के चरण
    prompt: >
      विस्तृत चरण-दर-चरण निर्देश प्रदान करें। प्रत्येक चरण को संख्या दें।
      प्रत्येक चरण के लिए अपेक्षित परिणाम शामिल करें। हिंदी में उत्तर दें।
  - title: सत्यापन
    prompt: >
      वर्णन करें कि कैसे सत्यापित किया जाए कि प्रक्रिया सफलतापूर्वक
      पूरी हो गई। हिंदी में उत्तर दें।
  - title: समस्या निवारण
    prompt: >
      सामान्य समस्याओं और उनके समाधानों की सूची बनाएं। हिंदी में उत्तर दें।
export:
  - markdown
  - html
