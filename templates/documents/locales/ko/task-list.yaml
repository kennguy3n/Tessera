id: task-list-v1-ko
name: 작업 목록
type: document
description: 담당자, 마감일 및 종속성이 포함된 우선순위 작업 목록 (한국어 버전)
locale: ko
sections:
  - title: 컨텍스트
    prompt: >
      이 작업 목록이 지원하는 이니셔티브 또는 프로젝트와 현재 상태에 대한
      한 단락 컨텍스트. 한국어로 답변해 주십시오.
    required_sources:
      - type: local
        min: 0
  - title: 중요 경로
    prompt: >
      더 큰 작업이 성공하기 위해 일정대로 완료되어야 하는 작업을
      나열하십시오. 각 항목에는 담당자와 마감일이 포함되어야 합니다.
      한국어로 답변해 주십시오.
  - title: 진행 중
    prompt: >
      현재 작업 중인 작업, 담당자, 현재 상태, 차단 요인 및
      예상 완료 시점. 한국어로 답변해 주십시오.
  - title: 다음 예정
    prompt: >
      다음 스프린트 또는 사이클을 위해 대기 중인 작업, 우선순위 순위
      및 담당자. 한국어로 답변해 주십시오.
  - title: 백로그
    prompt: >
      아직 일정이 잡히지 않은 낮은 우선순위 작업, 우선순위 및
      대략적인 작업량 추정. 한국어로 답변해 주십시오.
  - title: 완료됨
    prompt: >
      최근에 완료된 작업, 완료 날짜 및 추적성을 위한 결과 요약.
      한국어로 답변해 주십시오.
  - title: 메모 및 종속성
    prompt: >
      작업 간 종속성, 우선순위에 영향을 미치는 결정사항 및
      에스컬레이션이 필요한 차단 요인. 한국어로 답변해 주십시오.
export:
  - markdown
  - html
  - csv
