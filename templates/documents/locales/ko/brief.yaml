id: brief-v1-ko
name: 브리프
type: document
description: 목표, 대상, 산출물 및 일정을 포함한 간결한 프로젝트 또는 캠페인 브리프 (한국어 버전)
locale: ko
sections:
  - title: 브리프 제목 및 배경
    prompt: >
      제목, 요청자, 담당자, 목표 완료일 및 한 단락 분량의 배경
      요약. 한국어로 답변해 주십시오.
    required_sources:
      - type: local
        min: 0
  - title: 목표
    prompt: >
      브리프가 달성하고자 하는 단일하고 명확한 목표. 다목적 브리프는
      피하고 필요하면 분리하십시오. 한국어로 답변해 주십시오.
  - title: 배경
    prompt: >
      관련 배경과 이전 작업을 출처 자료를 인용하여 기술하십시오.
      연구, 이전 브리프 또는 관련 산출물에 대한 링크를 포함하십시오.
      한국어로 답변해 주십시오.
    required_sources:
      - type: local
        min: 0
  - title: 대상
    prompt: >
      산출물이 누구를 위한 것인지. 주요 대상, 부차적 대상 및 명시적으로
      범위에서 제외되는 대상을 포함하십시오. 한국어로 답변해 주십시오.
  - title: 핵심 메시지
    prompt: >
      산출물에서 반드시 전달되어야 하는 상위 3~5개 메시지. 각각 한
      문장이어야 합니다. 한국어로 답변해 주십시오.
  - title: 산출물
    prompt: >
      기대되는 구체적인 산출물을 형식, 분량, 채널과 함께 나열하십시오.
      한국어로 답변해 주십시오.
  - title: 성공 지표
    prompt: >
      성공을 어떻게 측정할 것인지. 가능한 경우 정량적으로 제시하십시오.
      한국어로 답변해 주십시오.
  - title: 일정 및 마일스톤
    prompt: >
      목표일과 담당자를 포함한 주요 마일스톤. 한국어로 답변해 주십시오.
  - title: 제약 조건
    prompt: >
      산출물이 준수해야 하는 예산, 범위, 브랜드, 법적 또는 기타 제약
      조건. 한국어로 답변해 주십시오.
export:
  - markdown
  - html
  - pdf
