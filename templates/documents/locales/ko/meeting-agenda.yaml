id: meeting-agenda-v1-ko
name: 회의 의제
type: document
description: 목표, 참석자, 주제 및 일정이 포함된 구조화된 의제 (한국어 버전)
locale: ko
sections:
  - title: 회의 개요
    prompt: >
      회의 제목, 날짜, 시간, 장소/화상회의 링크 및 한 줄 목표를
      기록하십시오. 일정 출처가 있는 경우 참조하십시오.
      한국어로 답변해 주십시오.
  - title: 참석자
    prompt: >
      필수 및 선택 참석자와 그들의 역할 또는 소속을 나열하십시오.
      사전 검토해야 할 자료를 명시하십시오. 한국어로 답변해 주십시오.
  - title: 목표
    prompt: >
      회의가 달성해야 할 2-5개의 구체적인 결과를 열거하십시오.
      각 목표는 측정 가능해야 합니다 (결정 도출 / 산출물 생성).
      한국어로 답변해 주십시오.
  - title: 의제 항목
    prompt: >
      각 의제 항목에 대해 주제, 담당자, 할당 시간, 원하는 결과 및
      사전 검토 링크를 기록하십시오. 한국어로 답변해 주십시오.
    required_sources:
      - type: local
        min: 0
  - title: 필요한 결정사항
    prompt: >
      회의 중에 결정해야 할 사항을 나열하십시오.
      각 항목은 관련 의제 항목을 참조해야 합니다. 한국어로 답변해 주십시오.
  - title: 사전 검토 자료
    prompt: >
      참석자가 사전에 검토해야 할 출처 자료에 대한 링크를 제공하십시오.
      한국어로 답변해 주십시오.
  - title: 후속 조치
    prompt: >
      회의 중 캡처된 실행 항목을 위한 공간을 예약하고, 회의 후
      채우십시오. 한국어로 답변해 주십시오.
export:
  - markdown
  - html
  - pdf
