id: form-v1-ko
name: 양식
type: document
description: 제목, 설명, 필드 및 제출 지침 섹션이 있는 범용 작성 가능 양식 (한국어 버전)
locale: ko
sections:
  - title: 양식 제목 및 설명
    prompt: >
      양식의 제목, 짧은 목적 설명 및 응답자가 양식을 작성하기 전에
      알아야 할 컨텍스트를 캡처하십시오. 한국어로 답변해 주십시오.
  - title: 응답자 정보
    prompt: >
      응답자의 식별 정보(이름, 이메일, 역할, 소속 조직) 및
      제출 날짜를 수집하십시오. 한국어로 답변해 주십시오.
  - title: 양식 필드
    prompt: >
      양식이 수집하는 각 필드를 정의하십시오. 모든 필드에 대해 레이블,
      입력 유형(텍스트, 긴 텍스트, 단일 선택, 다중 선택, 날짜, 체크박스,
      숫자, 파일 업로드), 필수 여부 및 기본값이나 옵션 목록을
      기록하십시오. 한국어로 답변해 주십시오.
  - title: 유효성 검사 및 조건부 로직
    prompt: >
      유효성 검사 규칙(필수, 정규식, 최소/최대, 허용 값) 및 필드 간의
      조건부 표시/숨김 로직을 설명하십시오. 한국어로 답변해 주십시오.
  - title: 제출 지침
    prompt: >
      작성된 양식을 어떻게 제출해야 하는지, 누가 검토하는지, 예상 처리
      시간 및 응답자에게 결과를 어떻게 알릴지 설명하십시오.
      한국어로 답변해 주십시오.
  - title: 개인정보 및 보존
    prompt: >
      양식 데이터가 어떻게 저장되는지, 누가 액세스할 수 있는지, 삭제 또는
      익명화되기 전 얼마 동안 보존되는지 명시하십시오.
      한국어로 답변해 주십시오.
export:
  - markdown
  - html
  - pdf
  - docx
