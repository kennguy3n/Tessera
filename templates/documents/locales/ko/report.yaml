id: report-v1-ko
name: 보고서
type: document
description: 결과, 분석 및 권장 사항이 포함된 분석 보고서 (한국어 버전)
locale: ko
sections:
  - title: 실행 요약
    prompt: >
      이 보고서의 주요 결과와 권장 사항을 요약하십시오.
      한국어로 답변해 주십시오.
  - title: 방법론
    prompt: >
      데이터 수집 및 분석에 사용된 방법론을 설명하십시오.
      한국어로 답변해 주십시오.
  - title: 결과
    prompt: >
      출처의 데이터로 뒷받침되는 주요 결과를 제시하십시오.
      관련 통계 및 증거를 포함하십시오. 한국어로 답변해 주십시오.
    required_sources:
      - type: local
        min: 1
  - title: 분석
    prompt: >
      결과에 대한 상세 분석을 제공하십시오. 패턴, 추세 및 시사점을
      식별하십시오. 한국어로 답변해 주십시오.
  - title: 권장 사항
    prompt: >
      분석을 기반으로 실행 가능한 권장 사항을 나열하십시오.
      영향력과 실행 가능성에 따라 우선순위를 정하십시오.
      한국어로 답변해 주십시오.
  - title: 부록
    prompt: >
      뒷받침 데이터, 참고 자료 및 보충 자료를 포함하십시오.
      한국어로 답변해 주십시오.
export:
  - markdown
  - html
  - csv
