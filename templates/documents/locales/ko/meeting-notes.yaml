id: meeting-notes-v1-ko
name: 회의록
type: document
description: 결정사항과 실행 항목이 포함된 회의 중 또는 회의 후 캡처된 구조화된 회의록 (한국어 버전)
locale: ko
sections:
  - title: 회의 메타데이터
    prompt: >
      회의 제목, 날짜, 참석자 및 불참자, 진행자, 기록자를 기록하십시오.
      의제가 있는 경우 참조하십시오. 한국어로 답변해 주십시오.
    required_sources:
      - type: local
        min: 0
  - title: 개요
    prompt: >
      회의의 한 단락 요약 — 높은 수준에서 논의된 내용과 전체 결과.
      한국어로 답변해 주십시오.
  - title: 논의 내용
    prompt: >
      각 주제별로 제기된 주요 사항, 공유된 관점 및 결정에 영향을
      준 맥락을 기록하십시오. 한국어로 답변해 주십시오.
  - title: 결정사항
    prompt: >
      내려진 결정, 근거, 담당자 및 조건이나 후속 조치를 나열하십시오.
      관련 출처 자료를 참조하십시오. 한국어로 답변해 주십시오.
  - title: 실행 항목
    prompt: >
      담당자, 마감일 및 수락 기준이 포함된 실행 항목.
      각 항목은 측정 가능해야 합니다. 한국어로 답변해 주십시오.
  - title: 위험 및 미해결 질문
    prompt: >
      제기된 위험, 후속 조치가 필요한 미해결 질문 및 각 항목을
      추적할 담당자를 기록하십시오. 한국어로 답변해 주십시오.
  - title: 다음 단계
    prompt: >
      다음 회의 날짜(있는 경우) 및 다음 체크포인트의 트리거를 포함하여
      다음에 일어날 일을 개략적으로 설명하십시오. 한국어로 답변해 주십시오.
export:
  - markdown
  - html
  - pdf
  - docx
