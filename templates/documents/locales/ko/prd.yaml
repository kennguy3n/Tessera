id: prd-v1-ko
name: 제품 요구사항 문서
type: document
description: 문제, 솔루션, 범위 및 성공 기준이 포함된 표준 PRD (한국어 버전)
locale: ko
sections:
  - title: 문제 정의
    prompt: >
      이 제품이 해결하는 핵심 문제를 요약하고, 관련 출처 자료를
      인용하십시오. 한국어로 답변해 주십시오.
    required_sources:
      - type: local
        min: 1
  - title: 제안된 솔루션
    prompt: >
      제안된 솔루션을 설명하고, 기술적 제약 사항과 출처의 기존 기술을
      참조하십시오. 한국어로 답변해 주십시오.
  - title: 범위
    prompt: >
      초기 출시의 범위 내 항목과 범위 외 항목을 정의하십시오.
      한국어로 답변해 주십시오.
  - title: 성공 기준
    prompt: >
      목표값이 포함된 측정 가능한 성공 기준을 나열하십시오. 한국어로 답변해 주십시오.
  - title: 위험 및 완화 조치
    prompt: >
      위험과 제안된 완화 조치를 식별하고, 해당하는 경우 출처 자료를
      인용하십시오. 한국어로 답변해 주십시오.
export:
  - markdown
  - html
