id: proposal-v1-ko
name: 제안서
type: document
description: 실행 요약, 접근 방식, 일정 및 예산이 포함된 비즈니스 또는 프로젝트 제안서 (한국어 버전)
locale: ko
sections:
  - title: 실행 요약
    prompt: >
      기회, 권장 접근 방식 및 예상 결과를 포함하여 제안서의
      간결한 개요를 제공하십시오. 한국어로 답변해 주십시오.
  - title: 배경
    prompt: >
      이 제안서로 이어진 맥락과 배경을 설명하십시오.
      관련 출처 자료를 참조하십시오. 한국어로 답변해 주십시오.
    required_sources:
      - type: local
        min: 1
  - title: 제안된 접근 방식
    prompt: >
      권장 접근 방식, 방법론 및 주요 활동을 상세히 설명하십시오.
      한국어로 답변해 주십시오.
  - title: 일정
    prompt: >
      주요 마일스톤 및 산출물이 포함된 프로젝트 일정을 개략적으로
      설명하십시오. 한국어로 답변해 주십시오.
  - title: 예산
    prompt: >
      세부 항목 및 정당화가 포함된 추정 예산을 제시하십시오.
      한국어로 답변해 주십시오.
  - title: 예상 결과
    prompt: >
      예상 결과와 성공이 어떻게 측정될지 설명하십시오.
      한국어로 답변해 주십시오.
export:
  - markdown
  - html
