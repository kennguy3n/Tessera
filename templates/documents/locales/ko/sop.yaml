id: sop-v1-ko
name: 표준 운영 절차
type: document
description: 역할, 전제 조건 및 검증 단계가 포함된 단계별 운영 절차 (한국어 버전)
locale: ko
sections:
  - title: 목적
    prompt: >
      이 절차의 목적과 언제 따라야 하는지를 명시하십시오.
      한국어로 답변해 주십시오.
  - title: 적용 범위
    prompt: >
      이 절차가 누구에게, 어떤 상황에서 적용되는지 정의하십시오.
      한국어로 답변해 주십시오.
  - title: 전제 조건
    prompt: >
      이 절차를 시작하기 전에 필요한 모든 전제 조건, 도구,
      접근 권한 및 권한을 나열하십시오. 한국어로 답변해 주십시오.
  - title: 절차 단계
    prompt: >
      자세한 단계별 지침을 제공하십시오. 각 단계에 번호를 매기십시오.
      각 단계의 예상 결과를 포함하십시오. 한국어로 답변해 주십시오.
  - title: 검증
    prompt: >
      절차가 성공적으로 완료되었는지 검증하는 방법을 설명하십시오.
      한국어로 답변해 주십시오.
  - title: 문제 해결
    prompt: >
      일반적인 문제와 해결 방법을 나열하십시오. 한국어로 답변해 주십시오.
export:
  - markdown
  - html
