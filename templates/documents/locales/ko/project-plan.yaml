id: project-plan-v1-ko
name: 프로젝트 계획서
type: document
description: 일정, 마일스톤, 담당자 및 위험을 포함한 종합 프로젝트 계획서 (한국어 버전)
locale: ko
sections:
  - title: 프로젝트 요약
    prompt: >
      목표, 범위, 담당자, 목표 완료일 및 현재 상태를 포함한 한 단락
      분량의 실행 요약. 한국어로 답변해 주십시오.
    required_sources:
      - type: local
        min: 1
  - title: 목표 및 성공 기준
    prompt: >
      목표(성공의 모습)와 프로젝트를 평가할 측정 가능한 기준을
      나열하십시오. 한국어로 답변해 주십시오.
  - title: 범위
    prompt: >
      범위에 포함되는 것, 범위에서 제외되는 것, 명시적으로 보류되는
      것을 명확히 하고, 해당되는 경우 출처 자료를 인용하십시오.
      한국어로 답변해 주십시오.
  - title: 마일스톤 및 일정
    prompt: >
      목표일, 산출물, 담당자, 승인 기준을 포함한 마일스톤 표를
      작성하십시오. 핵심 경로에 대한 메모를 포함하십시오.
      한국어로 답변해 주십시오.
  - title: 자원 및 팀
    prompt: >
      팀원, 그들의 역할과 배정, 그리고 모든 기능 간 종속성을
      나열하십시오. 한국어로 답변해 주십시오.
  - title: 위험 및 완화 방안
    prompt: >
      주요 위험을 발생 가능성, 영향도, 담당자 및 계획된 완화 방안과
      함께 정리하십시오. 한국어로 답변해 주십시오.
  - title: 종속성
    prompt: >
      외부 및 내부 종속성을 담당자와 상태와 함께 기록하십시오.
      차단 요인을 표시하십시오. 한국어로 답변해 주십시오.
  - title: 커뮤니케이션 계획
    prompt: >
      회의 주기, 상태 보고 빈도 및 에스컬레이션 경로를 설명하십시오.
      한국어로 답변해 주십시오.
export:
  - markdown
  - html
  - pdf
  - docx
