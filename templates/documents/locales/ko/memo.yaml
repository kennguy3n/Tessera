id: memo-v1-ko
name: 메모
type: document
description: 배경, 결정 사항, 실행 항목을 포함한 내부 커뮤니케이션 메모 (한국어 버전)
locale: ko
sections:
  - title: 제목
    prompt: >
      이 메모의 제목을 명확하고 간결하게 기재하십시오.
      한국어로 답변해 주십시오.
  - title: 배경
    prompt: >
      전달하려는 결정 사항이나 정보를 수신자가 이해하는 데 필요한
      배경 맥락을 제공하십시오. 한국어로 답변해 주십시오.
  - title: 결정 사항 또는 정보
    prompt: >
      전달하려는 결정 사항, 정책 변경 또는 정보를 기재하십시오.
      무엇이 어떻게 바뀌며 그 이유가 무엇인지 구체적으로 명시하십시오.
      한국어로 답변해 주십시오.
  - title: 영향
    prompt: >
      누가 어떻게 영향을 받는지 설명하십시오. 변경 일정을 포함하십시오.
      한국어로 답변해 주십시오.
  - title: 실행 항목
    prompt: >
      담당자와 기한을 명시한 구체적인 실행 항목을 나열하십시오.
      한국어로 답변해 주십시오.
export:
  - markdown
  - html
