id: constituent-casework-base-v1
name: Constituent Casework
type: base
description: Government base tracking constituent cases, issues, agency referrals, status, and resolution
industry:
  - government
profile:
  - caseworker
  - constituent-services
  - government-administrator
sections:
  - title: Constituents
    prompt: >
      Per constituent: name, contact details, address / district
      verification, preferred contact method and language, and
      consent to act on their behalf. Treat personal details as
      confidential.
  - title: Cases and Issues
    prompt: >
      Per case: case ID, intake date, channel (phone / email /
      walk-in / event), issue category (benefits / immigration /
      housing / taxes / veterans / other), description, and
      urgency.
  - title: Agency Referrals
    prompt: >
      The government agency or department engaged, the privacy
      release / authorization on file, inquiry sent and response
      received, the agency contact, and follow-up dates.
    output_format: table
  - title: Status and Actions
    prompt: >
      Case status (open / pending agency / awaiting constituent /
      resolved / closed), the assigned caseworker, actions taken
      with dates, and the next step. Flag aging and stalled
      cases.
    output_format: table
  - title: Resolution and Casework Trends
    prompt: >
      The outcome and resolution date, constituent satisfaction,
      and aggregate trends by issue category and agency to inform
      policy and outreach. Exclude personal identifiers from
      aggregate reporting.
export:
  - markdown
  - csv
