id: ip-portfolio-base-v1
name: IP Portfolio Register
type: base
description: Intellectual property base tracking patents, trademarks, copyrights, deadlines, and renewals
industry:
  - legal
profile:
  - ip-counsel
  - legal-operations
  - paralegal
sections:
  - title: IP Assets
    prompt: >
      Per asset: internal reference, type (patent / trademark /
      copyright / trade secret / design), title / mark,
      jurisdiction(s), application and registration numbers, and
      status (idea / filed / pending / granted / abandoned /
      expired).
  - title: Ownership and Inventors
    prompt: >
      The owner / assignee, inventors or authors, chain-of-title
      and assignment status, any co-ownership or joint-development
      terms, and the related product or business line.
  - title: Prosecution and Deadlines
    prompt: >
      Office actions, response deadlines, examination status, and
      upcoming filing or priority dates per asset. Treat statutory
      deadlines as critical and flag those approaching.
    output_format: table
  - title: Maintenance and Renewals
    prompt: >
      Maintenance / annuity and trademark-renewal due dates, fees,
      the responsible agent, payment status, and the grace
      periods. Highlight imminent fees to avoid lapse.
    output_format: table
  - title: Licensing and Enforcement
    prompt: >
      In- and out-licensing agreements, royalty terms, freedom-to-
      operate considerations, and infringement / opposition
      matters with status and counsel.
export:
  - markdown
  - csv
