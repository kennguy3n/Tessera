id: okr-tracker-base-v1-zh
name: OKR 跟踪
type: base
description: 用于管理目标、可衡量关键结果、对齐、进展回顾和评分的目标与关键结果（OKR）库
locale: zh
profile:
  - executive
  - product-manager
  - team-lead
sections:
  - title: 目标（Objectives）
    prompt: >
      每个目标：对要达成之事的定性、鼓舞人心的陈述、负责人、层级
      （公司 / 团队 / 个人）、周期（例如 FY25 Q3），以及其对齐的
      上级目标。目标是方向性的，而非指标。请用中文回答。
  - title: 关键结果（Key Results）
    prompt: >
      每个关键结果：带有基线、目标值和单位的可衡量结果、指标来源、
      负责人，以及类型（指标 / 里程碑）。每个目标应设置 2 到 5 个
      关键结果，它们合在一起证明目标的达成。请用中文回答。
    output_format: table
  - title: 举措与对齐
    prompt: >
      为推动每个关键结果而投入的举措、项目或押注、负责团队，以及
      每个目标如何与平级团队横向对齐、与公司目标纵向对齐。标出没有
      支撑举措的关键结果。请用中文回答。
  - title: 进展回顾与信心
    prompt: >
      每次回顾（每周或每两周）：当前值、距目标的百分比、信心评分
      （例如 0.0–1.0 或 红 / 黄 / 绿）、自上次回顾以来的趋势，以及
      关于障碍和下一步的简短说明。请用中文回答。
  - title: 评分与复盘
    prompt: >
      周期结束时每个关键结果和目标的评分（例如 0.0–1.0）、属于
      承诺型还是挑战型、超额或未达成的原因，以及带入下一周期的
      经验教训。请用中文回答。
    output_format: table
export:
  - markdown
  - csv
