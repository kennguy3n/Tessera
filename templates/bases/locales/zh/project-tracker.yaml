id: project-tracker-base-v1-zh
name: 项目与问题跟踪
type: base
description: 用于跟踪任务、状态流转、负责人、依赖、里程碑和速度的项目与问题跟踪库
locale: zh
profile:
  - product-manager
  - project-manager
  - engineer
sections:
  - title: 项目
    prompt: >
      每个项目：项目代号 / 编码、名称、目标、所属产品或团队领域、
      项目负责人、开始日期、目标交付日期，以及健康状态（正常 /
      有风险 / 偏离）。将其关联到所支撑的战略举措。请用中文回答。
  - title: 任务与问题
    prompt: >
      每个工作项：ID、标题、类型（功能 / 缺陷 / 杂务 / 探针）、
      描述、所属项目、优先级（P0 / P1 / P2 / P3）、估算（故事点
      或人天），以及定义"完成"的验收标准。请用中文回答。
  - title: 状态与工作流
    prompt: >
      每个工作项的工作流状态（待办池 / 待办 / 进行中 / 评审中 /
      受阻 / 完成）、进入当前状态的日期、受阻项的原因和负责人，
      以及承诺的冲刺或迭代。请用中文回答。
    output_format: table
  - title: 分配与产能
    prompt: >
      每个工作项的负责人与评审人、每个人当前的在办数量，以及团队
      在该迭代中承诺产能与可用产能的对比。标出超负荷人员和未分配
      的高优先级工作项。请用中文回答。
  - title: 依赖与里程碑
    prompt: >
      工作项与团队之间的上游 / 下游依赖、外部依赖，以及每个项目
      所归属的里程碑及其目标日期。突出显示位于关键路径上的依赖。
      请用中文回答。
  - title: 报表与速度
    prompt: >
      每个迭代的吞吐量与速度、周期时间与前置时间、相对承诺范围的
      燃尽 / 燃起图、在办工作项的滞留时长，以及导致延误的主要重复
      原因。请用中文回答。
    output_format: table
export:
  - markdown
  - csv
