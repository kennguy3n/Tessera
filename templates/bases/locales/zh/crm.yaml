id: crm-base-v1-zh
name: CRM（联系人、公司、商机）
type: base
description: 轻量级 CRM 库，管理联系人、公司、商机、活动和销售阶段
locale: zh
profile:
  - sales-ops
  - account-executive
  - founder
sections:
  - title: 公司
    prompt: >
      公司记录：法定名称、域名、行业、员工人数、年收入区间、
      地区、客户层级（战略 / 大型企业 / 中型市场 / 中小企业）、
      客户负责人，以及生命周期阶段（目标 / 接触中 / 客户 /
      流失）。请用中文回答。
  - title: 联系人
    prompt: >
      联系人记录：全名、职位、电子邮箱、电话、LinkedIn 链接、
      所属公司、在采购委员会中的角色（决策者 / 推动者 / 使用者 /
      阻碍者），以及最近一次联系日期。请用中文回答。
  - title: 商机与销售阶段
    prompt: >
      商机记录：商机名称、公司、主要联系人、金额、币种、预计
      成交日期、成交概率、当前销售阶段（线索 / 已确认 / 方案 /
      谈判 / 赢单 / 输单）、来源，以及竞争对手（如已知）。
      请用中文回答。
    output_format: table
  - title: 活动与备注
    prompt: >
      活动日志：日期、类型（电话 / 邮件 / 会议 / 演示 / 已发送
      方案 / 已发送合同 / 签署）、结果、负责人、关联的联系人和
      商机，以及概述要点的自由文本备注。请用中文回答。
  - title: 预测汇总
    prompt: >
      按阶段汇总销售管道并给出加权预测（金额 × 概率）、按销售
      代表汇总、按季度汇总，并与配额或计划进行对比。请用中文
      回答。
    output_format: table
  - title: 线索分配与 SLA
    prompt: >
      定义线索分配规则（轮询、按区域、按行业、按指定客户）、
      首次响应的 SLA（例如 MQL → 在 5 个工作小时内首次接触），
      以及 SLA 未达成时的升级机制。请用中文回答。
  - title: 数据治理与规范
    prompt: >
      数据规范规则：各阶段的必填字段、重复检测、归属权转移
      政策、保留 / 归档，以及检查完整性和准确性的审计频率。
      请用中文回答。
export:
  - markdown
  - csv
