id: crm-base-v1-hi
name: CRM (संपर्क, कंपनियाँ, सौदे)
type: base
description: संपर्क, कंपनियों, सौदों, गतिविधियों और पाइपलाइन चरणों वाला हल्का CRM बेस
locale: hi
profile:
  - sales-ops
  - account-executive
  - founder
sections:
  - title: कंपनियाँ
    prompt: >
      कंपनी रिकॉर्ड जिनमें शामिल हैं: कानूनी नाम, डोमेन, उद्योग,
      कर्मचारी संख्या, वार्षिक राजस्व श्रेणी, क्षेत्र, खाता स्तर
      (रणनीतिक / एंटरप्राइज़ / मिड-मार्केट / लघु एवं मध्यम उद्यम),
      खाता स्वामी, और जीवनचक्र चरण (लक्ष्य / संपर्क में / ग्राहक /
      छोड़ा हुआ)। हिंदी में उत्तर दें।
  - title: संपर्क
    prompt: >
      संपर्क रिकॉर्ड जिनमें शामिल हैं: पूरा नाम, पद, ईमेल, फ़ोन,
      LinkedIn URL, संबंधित कंपनी, क्रय समिति में भूमिका (आर्थिक
      निर्णयकर्ता / समर्थक / उपयोगकर्ता / अवरोधक), और सबसे हालिया
      संपर्क की तिथि। हिंदी में उत्तर दें।
  - title: सौदे और पाइपलाइन चरण
    prompt: >
      सौदा रिकॉर्ड जिनमें शामिल हैं: सौदे का नाम, कंपनी, मुख्य
      संपर्क, राशि, मुद्रा, अपेक्षित समापन तिथि, संभावना, वर्तमान
      पाइपलाइन चरण (लीड / योग्य / प्रस्ताव / वार्ता / जीत / हार),
      स्रोत, और प्रतिस्पर्धी (यदि ज्ञात हो)। हिंदी में उत्तर दें।
    output_format: table
  - title: गतिविधियाँ और टिप्पणियाँ
    prompt: >
      गतिविधि लॉग: तिथि, प्रकार (कॉल / ईमेल / मीटिंग / डेमो /
      प्रस्ताव भेजा / अनुबंध भेजा / हस्ताक्षर), परिणाम, स्वामी,
      संबंधित संपर्क और सौदा, तथा सार को संक्षेप में बताती मुक्त
      टिप्पणियाँ। हिंदी में उत्तर दें।
  - title: पूर्वानुमान सारांश
    prompt: >
      चरण के अनुसार पाइपलाइन का सारांश और भारित पूर्वानुमान (राशि ×
      संभावना), प्रति प्रतिनिधि सारांश, प्रति तिमाही सारांश, और
      कोटा या योजना के साथ तुलना। हिंदी में उत्तर दें।
    output_format: table
  - title: लीड आवंटन और SLA
    prompt: >
      लीड आवंटन नियम (राउंड-रॉबिन, क्षेत्र अनुसार, उद्योग अनुसार,
      नामित खाते अनुसार), पहली प्रतिक्रिया के लिए SLA (उदा. MQL →
      5 कार्य-घंटों के भीतर पहला संपर्क), और SLA न निभने पर
      एस्केलेशन परिभाषित करें। हिंदी में उत्तर दें।
  - title: डेटा स्वच्छता और शासन
    prompt: >
      डेटा स्वच्छता नियम: प्रत्येक चरण के लिए अनिवार्य फ़ील्ड,
      डुप्लिकेट पहचान, स्वामित्व-हस्तांतरण नीति, प्रतिधारण /
      संग्रहण, और पूर्णता एवं सटीकता जाँचने हेतु ऑडिट आवृत्ति।
      हिंदी में उत्तर दें।
export:
  - markdown
  - csv
