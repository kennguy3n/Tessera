id: project-tracker-base-v1-hi
name: परियोजना और इश्यू ट्रैकर
type: base
description: कार्य-आइटम, स्थिति वर्कफ़्लो, ज़िम्मेदार व्यक्ति, निर्भरताएँ, माइलस्टोन और वेलोसिटी वाला परियोजना और इश्यू ट्रैकर
locale: hi
profile:
  - product-manager
  - project-manager
  - engineer
sections:
  - title: परियोजनाएँ
    prompt: >
      प्रत्येक परियोजना: परियोजना कुंजी / कोड, नाम, उद्देश्य,
      उत्पाद या टीम क्षेत्र, परियोजना लीड, प्रारंभ तिथि, लक्षित
      वितरण तिथि, और स्वास्थ्य (सही राह पर / जोखिम में / पटरी से
      उतरी)। इसे उस रणनीतिक पहल से जोड़ें जिसका यह समर्थन करती है।
      हिंदी में उत्तर दें।
  - title: कार्य और इश्यू
    prompt: >
      प्रत्येक कार्य-आइटम: ID, शीर्षक, प्रकार (फ़ीचर / बग / चोर /
      स्पाइक), विवरण, संबंधित परियोजना, प्राथमिकता (P0 / P1 / P2 /
      P3), अनुमान (स्टोरी पॉइंट या व्यक्ति-दिवस), और "पूर्ण" को
      परिभाषित करने वाले स्वीकृति मानदंड। हिंदी में उत्तर दें।
  - title: स्थिति और वर्कफ़्लो
    prompt: >
      प्रत्येक आइटम की वर्कफ़्लो स्थिति (बैकलॉग / करना है / प्रगति
      में / समीक्षा में / अवरुद्ध / पूर्ण), वर्तमान स्थिति में
      प्रवेश की तिथि, किसी भी अवरोध का कारण और स्वामी, और
      प्रतिबद्ध स्प्रिंट या इटरेशन। हिंदी में उत्तर दें।
    output_format: table
  - title: आवंटन और क्षमता
    prompt: >
      प्रत्येक आइटम का ज़िम्मेदार व्यक्ति और समीक्षक, हर व्यक्ति
      की वर्तमान प्रगति-में कार्य संख्या, और इटरेशन के लिए टीम की
      प्रतिबद्ध बनाम उपलब्ध क्षमता। अतिभारित व्यक्तियों और बिना
      आवंटित उच्च-प्राथमिकता आइटमों को चिह्नित करें। हिंदी में
      उत्तर दें।
  - title: निर्भरताएँ और माइलस्टोन
    prompt: >
      आइटमों और टीमों के बीच अपस्ट्रीम / डाउनस्ट्रीम निर्भरताएँ,
      बाहरी निर्भरताएँ, और वे माइलस्टोन जिनसे प्रत्येक परियोजना
      अपनी लक्षित तिथियों सहित जुड़ती है। क्रिटिकल पाथ पर किसी भी
      निर्भरता को उजागर करें। हिंदी में उत्तर दें।
  - title: रिपोर्टिंग और वेलोसिटी
    prompt: >
      प्रत्येक इटरेशन का थ्रूपुट और वेलोसिटी, साइकिल टाइम और लीड
      टाइम, प्रतिबद्ध दायरे की तुलना में बर्नडाउन / बर्नअप,
      प्रगति-में आइटमों की पुरानापन, और देरी के प्रमुख बार-बार
      होने वाले कारण। हिंदी में उत्तर दें।
    output_format: table
export:
  - markdown
  - csv
