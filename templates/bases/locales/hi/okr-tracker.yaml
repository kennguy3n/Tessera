id: okr-tracker-base-v1-hi
name: OKR ट्रैकर
type: base
description: उद्देश्यों, मापन-योग्य प्रमुख परिणामों, संरेखण, चेक-इन और स्कोरिंग वाला उद्देश्य एवं प्रमुख परिणाम (OKR) बेस
locale: hi
profile:
  - executive
  - product-manager
  - team-lead
sections:
  - title: उद्देश्य (Objectives)
    prompt: >
      प्रत्येक उद्देश्य: जो हासिल करना है उसका गुणात्मक एवं
      प्रेरक कथन, स्वामी, स्तर (कंपनी / टीम / व्यक्तिगत), चक्र
      (उदा. FY25 Q3), और वह मूल उद्देश्य जिससे यह संरेखित है।
      उद्देश्य दिशात्मक होते हैं, मीट्रिक नहीं। हिंदी में उत्तर
      दें।
  - title: प्रमुख परिणाम (Key Results)
    prompt: >
      प्रत्येक प्रमुख परिणाम: आधाररेखा, लक्ष्य और इकाई सहित एक
      मापन-योग्य परिणाम, मीट्रिक स्रोत, स्वामी, और प्रकार
      (मीट्रिक / माइलस्टोन)। प्रत्येक उद्देश्य के 2 से 5 प्रमुख
      परिणाम होने चाहिए जो मिलकर उसकी प्राप्ति सिद्ध करें। हिंदी
      में उत्तर दें।
    output_format: table
  - title: पहल और संरेखण
    prompt: >
      प्रत्येक प्रमुख परिणाम को आगे बढ़ाने हेतु वित्तपोषित पहल,
      परियोजनाएँ या दांव, ज़िम्मेदार टीमें, और प्रत्येक उद्देश्य
      कैसे समकक्ष टीमों के साथ क्षैतिज रूप से तथा कंपनी लक्ष्यों के
      साथ लंबवत रूप से संरेखित होता है। बिना सहायक पहल वाले प्रमुख
      परिणामों को चिह्नित करें। हिंदी में उत्तर दें।
  - title: चेक-इन और आत्मविश्वास
    prompt: >
      प्रत्येक चेक-इन (साप्ताहिक या पाक्षिक): वर्तमान मान, लक्ष्य
      की ओर प्रतिशत, एक आत्मविश्वास स्कोर (उदा. 0.0–1.0 या लाल /
      अंबर / हरा), पिछले चेक-इन के बाद से प्रवृत्ति, और बाधाओं एवं
      अगले कदमों पर संक्षिप्त विवरण। हिंदी में उत्तर दें।
  - title: स्कोरिंग और रेट्रोस्पेक्टिव
    prompt: >
      चक्र-समाप्ति पर प्रत्येक प्रमुख परिणाम और उद्देश्य का स्कोर
      (उदा. 0.0–1.0), यह प्रतिबद्ध था या आकांक्षात्मक, अधिक या कम
      प्रदर्शन के कारण, और अगले चक्र में ले जाए जाने वाले सीख।
      हिंदी में उत्तर दें।
    output_format: table
export:
  - markdown
  - csv
