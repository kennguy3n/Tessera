id: crm-base-v1-ja
name: CRM（連絡先・企業・商談）
type: base
description: 連絡先、企業、商談、活動、パイプラインのステージを管理する軽量な CRM ベース
locale: ja
profile:
  - sales-ops
  - account-executive
  - founder
sections:
  - title: 企業
    prompt: >
      企業レコード：正式名称、ドメイン、業種、従業員数、年間売上
      レンジ、地域、アカウント階層（戦略 / エンタープライズ /
      ミッドマーケット / 中小企業）、アカウント担当者、ライフ
      サイクルステージ（ターゲット / 接触中 / 顧客 / 解約）。
      日本語で回答してください。
  - title: 連絡先
    prompt: >
      連絡先レコード：氏名、役職、メールアドレス、電話番号、
      LinkedIn の URL、所属企業、購買委員会での役割（決裁者 /
      推進者 / 利用者 / 阻害要因）、および直近の接触日。
      日本語で回答してください。
  - title: 商談とパイプラインのステージ
    prompt: >
      商談レコード：商談名、企業、主担当連絡先、金額、通貨、
      想定クローズ日、確度、現在のパイプラインステージ（リード /
      有望 / 提案 / 交渉 / 受注 / 失注）、流入元、競合（判明して
      いる場合）。日本語で回答してください。
    output_format: table
  - title: 活動とメモ
    prompt: >
      活動ログ：日付、種類（電話 / メール / 会議 / デモ /
      提案送付 / 契約送付 / 署名）、結果、担当者、関連する連絡先
      と商談、要点を要約した自由記述メモ。日本語で回答して
      ください。
  - title: フォーキャスト集計
    prompt: >
      ステージ別のパイプライン集計と加重フォーキャスト（金額 ×
      確度）、担当者別サマリー、四半期別サマリー、ノルマまたは
      計画との比較。日本語で回答してください。
    output_format: table
  - title: リード割り当てと SLA
    prompt: >
      リード割り当てルール（ラウンドロビン、テリトリー別、業種別、
      指名アカウント別）、初回応答の SLA（例：MQL → 5 営業時間
      以内に初回接触）、SLA 未達時のエスカレーションを定義します。
      日本語で回答してください。
  - title: データ整備とガバナンス
    prompt: >
      データ整備ルール：ステージごとの必須項目、重複検出、
      所有権移管ポリシー、保持 / アーカイブ、完全性と正確性を
      点検する監査の頻度。日本語で回答してください。
export:
  - markdown
  - csv
