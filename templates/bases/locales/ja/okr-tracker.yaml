id: okr-tracker-base-v1-ja
name: OKR トラッカー
type: base
description: 目標、測定可能な主要成果、整合、チェックイン、採点を管理する目標と主要成果（OKR）のベース
locale: ja
profile:
  - executive
  - product-manager
  - team-lead
sections:
  - title: 目標（Objectives）
    prompt: >
      目標ごと：達成したいことを示す定性的で鼓舞する記述、責任者、
      レベル（全社 / チーム / 個人）、サイクル（例：FY25 Q3）、
      紐づく上位目標。目標は方向性を示すものであり、指標では
      ありません。日本語で回答してください。
  - title: 主要成果（Key Results）
    prompt: >
      主要成果ごと：ベースライン、目標値、単位を伴う測定可能な
      成果、指標のソース、責任者、種類（指標 / マイルストーン）。
      各目標には、その達成を示す 2〜5 個の主要成果を設定します。
      日本語で回答してください。
    output_format: table
  - title: 施策と整合
    prompt: >
      各主要成果を動かすために投資する施策・プロジェクト・取り組み、
      責任を持つチーム、各目標が同僚チームと水平方向に、全社目標と
      垂直方向にどう整合するか。支える施策のない主要成果を示します。
      日本語で回答してください。
  - title: チェックインと自信度
    prompt: >
      チェックインごと（週次または隔週）：現在値、目標に対する
      達成率、自信度スコア（例：0.0〜1.0 または赤 / 黄 / 緑）、
      前回チェックインからの傾向、障害と次のステップに関する短い
      説明。日本語で回答してください。
  - title: 採点とふりかえり
    prompt: >
      サイクル終了時の主要成果と目標ごとの評価（例：0.0〜1.0）、
      コミット型か野心型か、超過または未達の理由、次のサイクルへ
      引き継ぐ学び。日本語で回答してください。
    output_format: table
export:
  - markdown
  - csv
