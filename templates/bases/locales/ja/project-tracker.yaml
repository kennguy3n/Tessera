id: project-tracker-base-v1-ja
name: プロジェクト・課題トラッカー
type: base
description: タスク、ステータスのワークフロー、担当者、依存関係、マイルストーン、ベロシティを管理するプロジェクト・課題トラッカー
locale: ja
profile:
  - product-manager
  - project-manager
  - engineer
sections:
  - title: プロジェクト
    prompt: >
      プロジェクトごと：プロジェクトキー / コード、名称、目的、
      プロダクトまたはチーム領域、プロジェクトリード、開始日、
      目標納期、健全性（順調 / リスクあり / 遅延）。支える戦略
      イニシアチブと紐づけます。日本語で回答してください。
  - title: タスクと課題
    prompt: >
      作業項目ごと：ID、タイトル、種類（機能 / バグ / 雑務 /
      スパイク）、説明、所属プロジェクト、優先度（P0 / P1 / P2 /
      P3）、見積り（ストーリーポイントまたは人日）、完了を定義する
      受け入れ基準。日本語で回答してください。
  - title: ステータスとワークフロー
    prompt: >
      項目ごとのワークフロー状態（バックログ / 未着手 / 進行中 /
      レビュー中 / ブロック / 完了）、現在の状態に入った日付、
      ブロックの理由と担当者、コミットしたスプリントまたは
      イテレーション。日本語で回答してください。
    output_format: table
  - title: 割り当てとキャパシティ
    prompt: >
      項目ごとの担当者とレビュアー、各メンバーの仕掛り作業数、
      イテレーションにおけるチームのコミット済みキャパシティと
      利用可能キャパシティ。過負荷のメンバーと未割り当ての高
      優先度項目を示します。日本語で回答してください。
  - title: 依存関係とマイルストーン
    prompt: >
      項目およびチーム間の上流 / 下流の依存関係、外部依存、各
      プロジェクトが紐づくマイルストーンと目標日。クリティカル
      パス上の依存関係を強調します。日本語で回答してください。
  - title: レポーティングとベロシティ
    prompt: >
      イテレーションごとのスループットとベロシティ、サイクル
      タイムとリードタイム、コミット済みスコープに対する
      バーンダウン / バーンアップ、進行中項目の滞留期間、遅延の
      主要な再発要因。日本語で回答してください。
    output_format: table
export:
  - markdown
  - csv
