id: okr-tracker-base-v1-ko
name: OKR 트래커
type: base
description: 목표, 측정 가능한 핵심 결과, 정렬, 체크인, 점수를 관리하는 목표 및 핵심 결과(OKR) 베이스
locale: ko
profile:
  - executive
  - product-manager
  - team-lead
sections:
  - title: 목표(Objectives)
    prompt: >
      목표별: 달성하려는 바를 담은 정성적이고 고무적인 서술,
      책임자, 수준(전사 / 팀 / 개인), 주기(예: FY25 Q3), 정렬되는
      상위 목표. 목표는 방향성을 제시하며 지표가 아닙니다.
      한국어로 답해 주세요.
  - title: 핵심 결과(Key Results)
    prompt: >
      핵심 결과별: 기준값, 목표값, 단위를 포함한 측정 가능한 결과,
      지표 출처, 책임자, 유형(지표 / 마일스톤). 각 목표에는 그
      달성을 함께 입증하는 2~5개의 핵심 결과가 있어야 합니다.
      한국어로 답해 주세요.
    output_format: table
  - title: 이니셔티브 및 정렬
    prompt: >
      각 핵심 결과를 움직이기 위해 투자하는 이니셔티브·프로젝트·
      베팅, 담당 팀, 각 목표가 동료 팀과 수평적으로, 전사 목표와
      수직적으로 어떻게 정렬되는지. 지원 이니셔티브가 없는 핵심
      결과를 표시합니다. 한국어로 답해 주세요.
  - title: 체크인 및 자신감
    prompt: >
      체크인별(주간 또는 격주): 현재 값, 목표 대비 백분율, 자신감
      점수(예: 0.0~1.0 또는 빨강 / 주황 / 초록), 지난 체크인 이후
      추세, 장애물과 다음 단계에 대한 짧은 서술. 한국어로 답해
      주세요.
  - title: 점수 및 회고
    prompt: >
      주기 종료 시 핵심 결과 및 목표별 채점(예: 0.0~1.0), 커밋형
      인지 도전형인지, 초과 또는 미달 성과의 이유, 다음 주기로
      이어가는 학습. 한국어로 답해 주세요.
    output_format: table
export:
  - markdown
  - csv
