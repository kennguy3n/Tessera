id: project-tracker-base-v1-ko
name: 프로젝트 및 이슈 트래커
type: base
description: 작업 항목, 상태 워크플로, 담당자, 의존성, 마일스톤, 속도를 관리하는 프로젝트 및 이슈 트래커
locale: ko
profile:
  - product-manager
  - project-manager
  - engineer
sections:
  - title: 프로젝트
    prompt: >
      프로젝트별: 프로젝트 키 / 코드, 이름, 목표, 제품 또는 팀
      영역, 프로젝트 리드, 시작일, 목표 납기일, 상태(정상 / 위험 /
      이탈). 지원하는 전략 이니셔티브와 연결합니다. 한국어로 답해
      주세요.
  - title: 작업 및 이슈
    prompt: >
      작업 항목별: ID, 제목, 유형(기능 / 버그 / 잡무 / 스파이크),
      설명, 소속 프로젝트, 우선순위(P0 / P1 / P2 / P3), 추정치
      (스토리 포인트 또는 인일), 완료를 정의하는 인수 기준.
      한국어로 답해 주세요.
  - title: 상태 및 워크플로
    prompt: >
      항목별 워크플로 상태(백로그 / 할 일 / 진행 중 / 리뷰 중 /
      차단됨 / 완료), 현재 상태 진입일, 차단 항목의 사유와 담당자,
      커밋된 스프린트 또는 이터레이션. 한국어로 답해 주세요.
    output_format: table
  - title: 배정 및 가용량
    prompt: >
      항목별 담당자와 리뷰어, 각 인원의 현재 진행 중 작업 수,
      이터레이션에 대한 팀의 커밋된 가용량 대비 가용 가능한 용량.
      과부하 인원과 미배정된 고우선순위 항목을 표시합니다.
      한국어로 답해 주세요.
  - title: 의존성 및 마일스톤
    prompt: >
      항목과 팀 간의 상류 / 하류 의존성, 외부 의존성, 각
      프로젝트가 연결되는 마일스톤과 목표일. 임계 경로상의
      의존성을 강조합니다. 한국어로 답해 주세요.
  - title: 리포팅 및 속도
    prompt: >
      이터레이션별 처리량과 속도, 사이클 타임과 리드 타임, 커밋된
      범위 대비 번다운 / 번업, 진행 중 항목의 경과 기간, 지연을
      유발하는 주요 반복 원인. 한국어로 답해 주세요.
    output_format: table
export:
  - markdown
  - csv
