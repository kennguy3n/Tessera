id: crm-base-v1-ko
name: CRM (연락처, 회사, 거래)
type: base
description: 연락처, 회사, 거래, 활동, 파이프라인 단계를 관리하는 경량 CRM 베이스
locale: ko
profile:
  - sales-ops
  - account-executive
  - founder
sections:
  - title: 회사
    prompt: >
      회사 레코드: 법인명, 도메인, 산업, 임직원 수, 연 매출
      구간, 지역, 계정 등급(전략 / 엔터프라이즈 / 미드마켓 /
      중소기업), 계정 담당자, 라이프사이클 단계(타깃 / 접촉 중 /
      고객 / 이탈). 한국어로 답해 주세요.
  - title: 연락처
    prompt: >
      연락처 레코드: 성명, 직책, 이메일, 전화번호, LinkedIn URL,
      소속 회사, 구매 의사결정 위원회에서의 역할(결재자 / 옹호자 /
      사용자 / 방해자), 최근 접촉 일자. 한국어로 답해 주세요.
  - title: 거래 및 파이프라인 단계
    prompt: >
      거래 레코드: 거래명, 회사, 주요 연락처, 금액, 통화, 예상
      마감일, 성사 확률, 현재 파이프라인 단계(리드 / 검증 /
      제안 / 협상 / 수주 / 실주), 유입 경로, 경쟁사(파악된
      경우). 한국어로 답해 주세요.
    output_format: table
  - title: 활동 및 메모
    prompt: >
      활동 로그: 날짜, 유형(전화 / 이메일 / 미팅 / 데모 / 제안
      발송 / 계약 발송 / 서명), 결과, 담당자, 관련 연락처와 거래,
      핵심을 요약한 자유 형식 메모. 한국어로 답해 주세요.
  - title: 예측 집계
    prompt: >
      단계별 파이프라인 집계와 가중 예측(금액 × 확률), 담당자별
      요약, 분기별 요약, 할당량 또는 계획 대비 비교. 한국어로
      답해 주세요.
    output_format: table
  - title: 리드 배정 및 SLA
    prompt: >
      리드 배정 규칙(라운드 로빈, 지역별, 산업별, 지정 계정별),
      최초 응답 SLA(예: MQL → 영업 기준 5시간 이내 최초 접촉),
      SLA 미준수 시 에스컬레이션을 정의합니다. 한국어로 답해
      주세요.
  - title: 데이터 정합성 및 거버넌스
    prompt: >
      데이터 정합성 규칙: 단계별 필수 항목, 중복 탐지, 소유권
      이전 정책, 보존 / 아카이브, 완전성과 정확성을 점검하는 감사
      주기. 한국어로 답해 주세요.
export:
  - markdown
  - csv
