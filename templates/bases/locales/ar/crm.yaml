id: crm-base-v1-ar
name: نظام إدارة علاقات العملاء (جهات الاتصال والشركات والصفقات)
type: base
description: قاعدة خفيفة لإدارة علاقات العملاء تشمل جهات الاتصال والشركات والصفقات والأنشطة ومراحل خط الأنابيب
locale: ar
profile:
  - sales-ops
  - account-executive
  - founder
sections:
  - title: الشركات
    prompt: >
      سجلات الشركات وتشمل: الاسم القانوني، والنطاق، والقطاع، وعدد
      الموظفين، وشريحة الإيرادات السنوية، والمنطقة، ومستوى الحساب
      (استراتيجي / مؤسسي / السوق المتوسطة / الشركات الصغيرة
      والمتوسطة)، ومسؤول الحساب، ومرحلة دورة الحياة (مستهدف /
      متفاعل / عميل / متوقف). أجب باللغة العربية.
  - title: جهات الاتصال
    prompt: >
      سجلات جهات الاتصال وتشمل: الاسم الكامل، والمنصب، والبريد
      الإلكتروني، والهاتف، ورابط LinkedIn، والشركة التابعة لها،
      والدور في لجنة الشراء (صاحب القرار المالي / المناصر /
      المستخدم / المعرقل)، وتاريخ آخر تواصل. أجب باللغة العربية.
  - title: الصفقات ومراحل خط الأنابيب
    prompt: >
      سجلات الصفقات وتشمل: اسم الصفقة، والشركة، وجهة الاتصال
      الرئيسية، والمبلغ، والعملة، وتاريخ الإغلاق المتوقع،
      والاحتمالية، والمرحلة الحالية في خط الأنابيب (عميل محتمل /
      مؤهل / عرض / تفاوض / ربح / خسارة)، والمصدر، والمنافس (إن
      عُرف). أجب باللغة العربية.
    output_format: table
  - title: الأنشطة والملاحظات
    prompt: >
      سجل الأنشطة: التاريخ، والنوع (مكالمة / بريد إلكتروني /
      اجتماع / عرض توضيحي / إرسال عرض / إرسال عقد / توقيع)،
      والنتيجة، والمسؤول، وجهة الاتصال والصفقة المرتبطتان،
      وملاحظات حرة تلخّص الجوهر. أجب باللغة العربية.
  - title: تجميع التوقعات
    prompt: >
      تجميع خط الأنابيب حسب المرحلة مع توقع مرجّح (المبلغ ×
      الاحتمالية)، وملخص لكل مندوب، وملخص لكل ربع سنة، ومقارنة
      مقابل الحصة أو الخطة. أجب باللغة العربية.
    output_format: table
  - title: توجيه العملاء المحتملين واتفاقية مستوى الخدمة
    prompt: >
      حدّد قواعد توجيه العملاء المحتملين (التناوب، حسب المنطقة،
      حسب القطاع، حسب الحساب المُسمّى)، واتفاقية مستوى الخدمة
      للاستجابة الأولى (مثلاً: عميل مؤهل تسويقياً → أول تواصل خلال
      5 ساعات عمل)، والتصعيد عند عدم الالتزام بالاتفاقية. أجب
      باللغة العربية.
  - title: جودة البيانات والحوكمة
    prompt: >
      قواعد جودة البيانات: الحقول الإلزامية لكل مرحلة، واكتشاف
      التكرارات، وسياسة نقل الملكية، والاحتفاظ / الأرشفة، ووتيرة
      التدقيق للتحقق من الاكتمال والدقة. أجب باللغة العربية.
export:
  - markdown
  - csv
