id: okr-tracker-base-v1-ar
name: متتبع الأهداف والنتائج الرئيسية (OKR)
type: base
description: قاعدة للأهداف والنتائج الرئيسية تشمل الأهداف والنتائج الرئيسية القابلة للقياس والمواءمة ومراجعات التقدم والتقييم
locale: ar
profile:
  - executive
  - product-manager
  - team-lead
sections:
  - title: الأهداف
    prompt: >
      لكل هدف: بيان نوعي وملهم لما يُراد تحقيقه، والمسؤول،
      والمستوى (الشركة / الفريق / الفرد)، والدورة (مثلاً الربع
      الثالث من السنة المالية 25)، والهدف الأعلى الذي يتواءم معه.
      الأهداف توجيهية وليست مقاييس. أجب باللغة العربية.
  - title: النتائج الرئيسية
    prompt: >
      لكل نتيجة رئيسية: نتيجة قابلة للقياس مع خط أساس وهدف ووحدة،
      ومصدر المقياس، والمسؤول، والنوع (مقياس / معلم). ينبغي أن
      يكون لكل هدف من 2 إلى 5 نتائج رئيسية تُثبت مجتمعةً تحقيقه.
      أجب باللغة العربية.
    output_format: table
  - title: المبادرات والمواءمة
    prompt: >
      المبادرات أو المشاريع أو الرهانات المموَّلة لتحريك كل نتيجة
      رئيسية، والفرق المسؤولة، وكيفية مواءمة كل هدف أفقياً مع الفرق
      النظيرة ورأسياً مع أهداف الشركة. أبرِز النتائج الرئيسية التي
      لا تدعمها مبادرة. أجب باللغة العربية.
  - title: مراجعات التقدم ومستوى الثقة
    prompt: >
      لكل مراجعة (أسبوعية أو نصف شهرية): القيمة الحالية، والنسبة
      المئوية نحو الهدف، ودرجة ثقة (مثلاً 0.0–1.0 أو أحمر / كهرماني
      / أخضر)، والاتجاه منذ المراجعة الأخيرة، وسرد موجز عن العوائق
      والخطوات التالية. أجب باللغة العربية.
  - title: التقييم والمراجعة الاستعادية
    prompt: >
      تقييم نهاية الدورة لكل نتيجة رئيسية وهدف (مثلاً 0.0–1.0)،
      وما إذا كان مُلتزَماً به أو طموحاً، وأسباب التجاوز أو
      القصور، والدروس المستفادة المنقولة إلى الدورة التالية. أجب
      باللغة العربية.
    output_format: table
export:
  - markdown
  - csv
