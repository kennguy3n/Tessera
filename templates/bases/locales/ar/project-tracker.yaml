id: project-tracker-base-v1-ar
name: متتبع المشاريع والمهام
type: base
description: قاعدة لتتبّع المشاريع والمهام تشمل عناصر العمل وسير حالات العمل والمسؤولين والتبعيات والمعالم وسرعة الإنجاز
locale: ar
profile:
  - product-manager
  - project-manager
  - engineer
sections:
  - title: المشاريع
    prompt: >
      لكل مشروع: مفتاح / رمز المشروع، والاسم، والهدف، ومجال المنتج
      أو الفريق، وقائد المشروع، وتاريخ البدء، وتاريخ التسليم
      المستهدف، والحالة الصحية (على المسار / معرّض للخطر / منحرف).
      اربطه بالمبادرة الاستراتيجية التي يدعمها. أجب باللغة العربية.
  - title: المهام والعناصر
    prompt: >
      لكل عنصر عمل: المعرّف، والعنوان، والنوع (ميزة / خلل / مهمة
      روتينية / استكشاف)، والوصف، والمشروع التابع له، والأولوية
      (P0 / P1 / P2 / P3)، والتقدير (نقاط القصة أو أيام-شخص)،
      ومعايير القبول التي تحدّد "المنجز". أجب باللغة العربية.
  - title: الحالة وسير العمل
    prompt: >
      حالة سير العمل لكل عنصر (قائمة الانتظار / للتنفيذ / قيد
      التنفيذ / قيد المراجعة / محظور / منجز)، وتاريخ الدخول إلى
      الحالة الحالية، وسبب أي حظر والمسؤول عنه، والسبرنت أو
      التكرار المُلتزَم به. أجب باللغة العربية.
    output_format: table
  - title: التعيينات والسعة
    prompt: >
      المسؤول والمراجع لكل عنصر، وعدد الأعمال الجارية لكل شخص،
      والسعة المُلتزَم بها مقابل السعة المتاحة للفريق في التكرار.
      أبرِز الأشخاص المُحمَّلين فوق طاقتهم والعناصر عالية الأولوية
      غير المعيَّنة. أجب باللغة العربية.
  - title: التبعيات والمعالم
    prompt: >
      التبعيات السابقة / اللاحقة بين العناصر والفرق، والتبعيات
      الخارجية، والمعالم التي يرتبط بها كل مشروع مع تواريخها
      المستهدفة. أبرِز أي تبعية على المسار الحرج. أجب باللغة
      العربية.
  - title: التقارير وسرعة الإنجاز
    prompt: >
      الإنتاجية وسرعة الإنجاز لكل تكرار، وزمن الدورة وزمن
      التسليم، ومخطط الحرق التنازلي / التصاعدي مقابل النطاق
      المُلتزَم به، وعُمر العناصر الجارية، والأسباب المتكررة
      الرئيسية للتأخير. أجب باللغة العربية.
    output_format: table
export:
  - markdown
  - csv
