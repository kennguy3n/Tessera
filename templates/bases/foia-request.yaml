id: foia-request-base-v1
name: Public Records Request Log
type: base
description: Government base tracking public-records / FOIA requests, deadlines, exemptions, fees, and responses
industry:
  - government
profile:
  - records-officer
  - government-administrator
  - legal-operations
sections:
  - title: Requests
    prompt: >
      Per request: request ID, date received, requester (name,
      type — media / individual / commercial / attorney), the
      receiving channel, and a clear description of the records
      sought.
  - title: Statutory Deadlines
    prompt: >
      The statutory response clock, the due date, any permitted
      extension and its justification, and the days remaining or
      overdue. Treat the legal deadline as critical and flag
      at-risk requests.
    output_format: table
  - title: Search and Records
    prompt: >
      The departments / custodians tasked, search terms and date
      ranges, the volume of responsive records located, and the
      review status. Track where records reside.
  - title: Exemptions and Redactions
    prompt: >
      Claimed exemptions per record with the legal basis, the
      redactions applied, partial vs. full denial, and the
      review / approval by counsel. Document the rationale for
      withholding.
  - title: Fees and Response
    prompt: >
      Fee estimate and category (search / copy / review),
      waivers, payment status, the final disposition (granted /
      partially granted / denied), the release package, and
      appeal information provided to the requester.
    output_format: table
export:
  - markdown
  - csv
