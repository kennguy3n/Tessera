id: landing-product-launch-v1-hi
name: उत्पाद लॉन्च लैंडिंग पेज
type: landing_page
description: |-
  लॉन्च-दिवस का लैंडिंग पेज जिसमें हीरो, समस्या/समाधान, फ़ीचर, सामाजिक प्रमाण, मूल्य-निर्धारण और एक मज़बूत मुख्य CTA हो (हिंदी संस्करण)
locale: hi
default_icon_set: lucide
color_scheme:
  primary: '#4F46E5'
  secondary: '#0EA5E9'
  accent: '#F97316'
profile:
- product-marketing
- marketing
sections:
- title: हीरो
  prompt: |-
    एक लाभ-केंद्रित शीर्षक जो बताए कि नया क्या है और किसके लिए है, 15 से 25 शब्दों का उपशीर्षक, और एक मुख्य CTA (‘शुरू करें’ / ‘मुफ़्त आज़माएँ’)। डेमो या वीडियो के लिए एक द्वितीयक CTA जोड़ें। हिंदी में उत्तर दें।
  icon_suggestion: rocket
- title: समस्या
  prompt: |-
    लॉन्च जिस समस्या को हल करता है, उसे आगंतुक के अपने शब्दों में रखें। दो या तीन वाक्य जो किसी भी पिच से पहले उन्हें यह महसूस कराएँ कि उन्हें समझा गया है। हिंदी में उत्तर दें।
  icon_suggestion: alert-circle
- title: समाधान
  prompt: |-
    उत्पाद उस समस्या को कैसे हल करता है, उस एकमात्र ‘अहा’ क्षमता के साथ जो इसे अलग बनाती है। स्पेक-शीट नहीं, परिणाम तक सीमित रहें। हिंदी में उत्तर दें।
  icon_suggestion: sparkles
- title: मुख्य फ़ीचर
  prompt: |-
    तीन से छह फ़ीचर कार्ड। प्रति कार्ड: एक आइकन, लाभ-प्रथम शीर्षक, और यह बताने वाला एक वाक्य कि यह क्या करता है। उन्हें इस क्रम में रखें कि लक्षित आगंतुक को सबसे अधिक किसकी परवाह है। हिंदी में उत्तर दें।
  icon_suggestion: layout-grid
- title: सामाजिक प्रमाण
  prompt: |-
    लोगो, नाम/पद/कंपनी के साथ एक प्रमुख प्रशंसापत्र, और एक मुख्य मीट्रिक। जुड़े हुए स्रोतों से लें और हर उद्धरण का श्रेय दें। हिंदी में उत्तर दें।
  icon_suggestion: quote
  required_sources:
  - type: local
    min: 1
- title: यह कैसे काम करता है
  prompt: |-
    साइन-अप से मूल्य तक तीन सरल चरण, प्रत्येक के साथ एक छोटा लेबल और एक पंक्ति, ताकि आगंतुक देख सके कि वह कितनी जल्दी परिणाम तक पहुँचता है। हिंदी में उत्तर दें।
  icon_suggestion: list-ordered
  output_format: numbered_list
- title: मूल्य-निर्धारण
  prompt: |-
    मूल्य-स्तर या एक स्पष्ट एकल मूल्य, इसमें क्या शामिल है, और समाप्ति-तिथि सहित कोई भी लॉन्च ऑफ़र। ट्रायल या गारंटी की एक पंक्ति से जोखिम कम करें। हिंदी में उत्तर दें।
  icon_suggestion: tag
  output_format: table
- title: अंतिम CTA और सामान्य प्रश्न
  prompt: |-
    एक समापन CTA जो मुख्य लाभ को दोहराए, साथ ही आपत्ति-निवारण करने वाले चार से छह सामान्य प्रश्न (सुरक्षा, मूल्य-निर्धारण, माइग्रेशन, समर्थन)। हिंदी में उत्तर दें।
  icon_suggestion: check-circle
export:
- markdown
- html
- pdf
