id: landing-webinar-v1-hi
name: वेबिनार पंजीकरण
type: landing_page
description: |-
  वेबिनार पंजीकरण पेज जिसमें विषय का हुक, एजेंडा, वक्ता, आप क्या सीखेंगे और एक पंजीकरण फ़ॉर्म हो (हिंदी संस्करण)
locale: hi
default_icon_set: lucide
color_scheme:
  primary: '#1D4ED8'
  secondary: '#7C3AED'
  accent: '#F59E0B'
profile:
- marketing
- events
sections:
- title: हीरो — विषय और तिथि
  prompt: |-
    वेबिनार का शीर्षक, समय-क्षेत्र सहित तिथि/समय, प्रारूप (लाइव / ऑन-डिमांड), और एक पंजीकरण CTA (‘मेरी सीट सुरक्षित करें’)। एक पंक्ति में बताएँ कि किसे शामिल होना चाहिए। हिंदी में उत्तर दें।
  icon_suggestion: calendar-clock
- title: क्यों शामिल हों
  prompt: |-
    सत्र जिस समस्या को संबोधित करता है और उस घंटे का वादा: समाप्त होने पर प्रतिभागी क्या करने में सक्षम होंगे। दो या तीन वाक्य। हिंदी में उत्तर दें।
  icon_suggestion: target
- title: आप क्या सीखेंगे
  prompt: |-
    तीन से पाँच ठोस सीखने के परिणाम बुलेट के रूप में, प्रत्येक इतना विशिष्ट कि आगंतुक के एक घंटे को उचित ठहराए। हिंदी में उत्तर दें।
  icon_suggestion: graduation-cap
  output_format: bullets
- title: एजेंडा
  prompt: |-
    समय-खंडों सहित कार्यक्रम का क्रम: परिचय, मुख्य खंड, डेमो और प्रश्नोत्तर। इसे सघन रखें ताकि मूल्य का घनत्व स्पष्ट हो। हिंदी में उत्तर दें।
  icon_suggestion: list-ordered
  output_format: numbered_list
- title: वक्ता
  prompt: |-
    प्रत्येक वक्ता के साथ फ़ोटो, नाम, पद, कंपनी, और इस विषय पर भरोसा अर्जित करने वाली एक-पंक्ति की योग्यता। जीवनियाँ जुड़े हुए स्रोत से लें। हिंदी में उत्तर दें।
  icon_suggestion: mic
  required_sources:
  - type: local
    min: 1
- title: सामाजिक प्रमाण
  prompt: |-
    पिछले सत्रों की उपस्थिति संख्या, एक प्रशंसापत्र, या साझेदार लोगो — इस बात का प्रमाण कि यह शृंखला समय देने योग्य है। हिंदी में उत्तर दें।
  icon_suggestion: star
- title: पंजीकरण और व्यवस्था
  prompt: |-
    पंजीकरण फ़ॉर्म के फ़ील्ड, साइन अप करने के बाद क्या होता है (कैलेंडर आमंत्रण, अनुस्मारक, रिकॉर्डिंग), और ईमेल का उपयोग कैसे होगा, इस पर गोपनीयता टिप्पणी। हिंदी में उत्तर दें।
  icon_suggestion: ticket
- title: सामान्य प्रश्न
  prompt: |-
    चार सामान्य प्रश्न: क्या इसे रिकॉर्ड किया जाएगा, क्या यह मुफ़्त है, यदि मैं लाइव शामिल न हो सकूँ तो क्या, और प्रश्न कैसे पूछें। एक अंतिम CTA के साथ समाप्त करें। हिंदी में उत्तर दें।
  icon_suggestion: help-circle
export:
- markdown
- html
- pdf
