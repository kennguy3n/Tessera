id: landing-webinar-v1-zh
name: 网络研讨会报名
type: landing_page
description: 网络研讨会报名页面，包含主题钩子、议程、讲者、你将学到什么以及报名表单（中文版）
locale: zh
default_icon_set: lucide
color_scheme:
  primary: '#1D4ED8'
  secondary: '#7C3AED'
  accent: '#F59E0B'
profile:
- marketing
- events
sections:
- title: 主视觉 — 主题与日期
  prompt: 网络研讨会标题、带时区的日期/时间、形式（直播／点播），以及一个报名行动号召（“锁定席位”）。用一行说明谁应参加。 请用中文回答。
  icon_suggestion: calendar-clock
- title: 为何参加
  prompt: 本场所要解决的问题，以及这一小时的承诺：参加者结束后将能够做什么。用两三句话。 请用中文回答。
  icon_suggestion: target
- title: 你将学到什么
  prompt: 三到五项具体的学习成果，以要点列出，每一项都足够具体，值得占用访客一小时的时间。 请用中文回答。
  icon_suggestion: graduation-cap
  output_format: bullets
- title: 议程
  prompt: 带时间块的流程安排：开场、主要环节、演示和问答。保持紧凑，使价值密度一目了然。 请用中文回答。
  icon_suggestion: list-ordered
  output_format: numbered_list
- title: 讲者
  prompt: 每位讲者配照片、姓名、职务、公司，以及一行能就该主题赢得信任的资历。从所连接的来源中提取简介。 请用中文回答。
  icon_suggestion: mic
  required_sources:
  - type: local
    min: 1
- title: 社会证明
  prompt: 往期场次的参加人数、一条证言或合作伙伴标识——证明这一系列值得投入时间。 请用中文回答。
  icon_suggestion: star
- title: 报名与安排
  prompt: 报名表单字段、报名后会发生什么（日历邀请、提醒、录像），以及关于电子邮件将如何使用的隐私说明。 请用中文回答。
  icon_suggestion: ticket
- title: 常见问题
  prompt: 四个常见问题：是否会录像、是否免费、无法参加直播怎么办，以及如何提问。以一个结尾行动号召收尾。 请用中文回答。
  icon_suggestion: help-circle
export:
- markdown
- html
- pdf
