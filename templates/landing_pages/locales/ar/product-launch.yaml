id: landing-product-launch-v1-ar
name: صفحة هبوط لإطلاق المنتج
type: landing_page
description: |-
  صفحة هبوط ليوم الإطلاق تتضمن قسمًا رئيسيًا، ومشكلة/حلًّا، وميزات، ودليلًا اجتماعيًا، وتسعيرًا، ودعوة رئيسية قوية لاتخاذ إجراء (النسخة العربية)
locale: ar
default_icon_set: lucide
color_scheme:
  primary: '#4F46E5'
  secondary: '#0EA5E9'
  accent: '#F97316'
profile:
- product-marketing
- marketing
sections:
- title: القسم الرئيسي
  prompt: |-
    عنوان موجَّه نحو الفائدة يسمّي الجديد ولمن هو، وعنوان فرعي من 15 إلى 25 كلمة، ودعوة رئيسية لاتخاذ إجراء («ابدأ الآن» / «جرّبه مجانًا»). أضف دعوة ثانوية لعرض توضيحي أو فيديو. أجب باللغة العربية.
  icon_suggestion: rocket
- title: المشكلة
  prompt: |-
    المشكلة التي يحلّها الإطلاق، مصاغة بكلمات الزائر. جملتان أو ثلاث تجعله يشعر بأنه مفهوم قبل أي عرض ترويجي. أجب باللغة العربية.
  icon_suggestion: alert-circle
- title: الحل
  prompt: |-
    كيف يحلّ المنتج تلك المشكلة، مع القدرة الفريدة المُذهِلة التي تميّزه. اقتصر على النتيجة، لا على ورقة المواصفات. أجب باللغة العربية.
  icon_suggestion: sparkles
- title: الميزات الرئيسية
  prompt: |-
    من ثلاث إلى ست بطاقات ميزات. لكل بطاقة: أيقونة، وعنوان يقدّم الفائدة أولًا، وجملة واحدة عمّا تفعله. رتّبها حسب ما يهمّ الزائر المستهدف أكثر. أجب باللغة العربية.
  icon_suggestion: layout-grid
- title: الدليل الاجتماعي
  prompt: |-
    شعارات، وشهادة بارزة بالاسم/المنصب/الشركة، ومقياس رئيسي واحد. استمدّها من المصادر المتصلة وانسب كل اقتباس إلى صاحبه. أجب باللغة العربية.
  icon_suggestion: quote
  required_sources:
  - type: local
    min: 1
- title: كيف يعمل
  prompt: |-
    ثلاث خطوات بسيطة من التسجيل إلى تحقيق القيمة، لكل منها تسمية قصيرة وسطر واحد، ليرى الزائر مدى سرعة وصوله إلى النتيجة. أجب باللغة العربية.
  icon_suggestion: list-ordered
  output_format: numbered_list
- title: التسعير
  prompt: |-
    مستويات التسعير أو سعر واحد واضح، وما يتضمنه، وأي عرض إطلاق مع تاريخ انتهائه. قلّل المخاطرة بسطر عن التجربة أو الضمان. أجب باللغة العربية.
  icon_suggestion: tag
  output_format: table
- title: الدعوة الختامية والأسئلة الشائعة
  prompt: |-
    دعوة ختامية لاتخاذ إجراء تعيد ذكر الفائدة الأساسية، بالإضافة إلى أربعة إلى ستة أسئلة شائعة تعالج الاعتراضات (الأمان، التسعير، الترحيل، الدعم). أجب باللغة العربية.
  icon_suggestion: check-circle
export:
- markdown
- html
- pdf
