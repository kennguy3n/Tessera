id: landing-webinar-v1-ar
name: التسجيل في الندوة عبر الإنترنت
type: landing_page
description: |-
  صفحة تسجيل في ندوة عبر الإنترنت تتضمن خطّافًا للموضوع، وجدول أعمال، ومتحدثين، وما ستتعلمه، ونموذج تسجيل (النسخة العربية)
locale: ar
default_icon_set: lucide
color_scheme:
  primary: '#1D4ED8'
  secondary: '#7C3AED'
  accent: '#F59E0B'
profile:
- marketing
- events
sections:
- title: القسم الرئيسي — الموضوع والتاريخ
  prompt: |-
    عنوان الندوة، والتاريخ والوقت مع المنطقة الزمنية، والصيغة (مباشرة / عند الطلب)، ودعوة تسجيل لاتخاذ إجراء («احجز مقعدي»). سطر واحد عمّن ينبغي له الحضور. أجب باللغة العربية.
  icon_suggestion: calendar-clock
- title: لماذا تحضر
  prompt: |-
    المشكلة التي تعالجها الجلسة ووعد الساعة: ما الذي سيصبح الحاضرون قادرين على فعله بعدها. جملتان أو ثلاث. أجب باللغة العربية.
  icon_suggestion: target
- title: ما الذي ستتعلمه
  prompt: |-
    من ثلاث إلى خمس نتائج تعلُّم ملموسة في صورة نقاط، كل منها محدّد بما يكفي لتبرير ساعة من وقت الزائر. أجب باللغة العربية.
  icon_suggestion: graduation-cap
  output_format: bullets
- title: جدول الأعمال
  prompt: |-
    تسلسل الجلسة بكتل زمنية: المقدمة، والأجزاء الرئيسية، والعرض التوضيحي، والأسئلة والأجوبة. اجعله مُحكمًا حتى تكون كثافة القيمة واضحة. أجب باللغة العربية.
  icon_suggestion: list-ordered
  output_format: numbered_list
- title: المتحدثون
  prompt: |-
    كل متحدث بصورة واسم ومنصب وشركة ومؤهل من سطر واحد يكسب الثقة في هذا الموضوع. استمدّ السير الذاتية من المصدر المتصل. أجب باللغة العربية.
  icon_suggestion: mic
  required_sources:
  - type: local
    min: 1
- title: الدليل الاجتماعي
  prompt: |-
    أعداد الحضور من الجلسات السابقة، أو شهادة، أو شعارات الشركاء — دليل على أن هذه السلسلة تستحق الوقت. أجب باللغة العربية.
  icon_suggestion: star
- title: التسجيل والتنظيم
  prompt: |-
    حقول نموذج التسجيل، وما يحدث بعد التسجيل (دعوة تقويم، تذكيرات، تسجيل مرئي)، وملاحظة الخصوصية حول كيفية استخدام البريد الإلكتروني. أجب باللغة العربية.
  icon_suggestion: ticket
- title: الأسئلة الشائعة
  prompt: |-
    أربعة أسئلة شائعة: هل ستُسجَّل، هل هي مجانية، ماذا لو لم أستطع الحضور مباشرةً، وكيف أطرح الأسئلة. اختم بدعوة نهائية لاتخاذ إجراء. أجب باللغة العربية.
  icon_suggestion: help-circle
export:
- markdown
- html
- pdf
