id: class-timetable-v1
name: Class Timetable
type: sheet
description: Weekly class timetable mapping periods to subjects, teachers, and rooms with clash detection and teacher and room utilization
industry:
  - education
profile:
  - registrar
  - academic-coordinator
  - department-head
sections:
  - title: Timetable Header
    prompt: >
      Identify the school, term, and the class or year group, the
      daily period structure (start and end times, breaks), and the
      constraints the timetable must satisfy (teacher availability,
      room capacity, subject hours).
  - title: Weekly Grid
    prompt: >
      Lay out the week as a grid of days against periods. In each cell
      place the subject, the teacher, and the room. Cover every
      teaching period in the school week.
    output_format: table
  - title: Subject Hours Check
    prompt: >
      Total the scheduled periods per subject for the week and check
      them against the required curriculum hours. Flag any subject
      over- or under-allocated.
    output_format: table
  - title: Clash Detection
    prompt: >
      Identify any clashes where a teacher or a room is double-booked,
      or where a class has two subjects in the same period. List each
      clash with the periods and resources involved.
  - title: Utilization
    prompt: >
      Summarize teacher teaching load and room utilization across the
      week. Highlight overloaded teachers and rooms that are heavily
      or lightly used.
    output_format: table
export:
  - markdown
  - csv
  - xlsx
