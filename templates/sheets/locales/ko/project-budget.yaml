id: project-budget-v1-ko
name: 프로젝트 예산
type: sheet
description: 작업분류체계, 인건비 및 비인건비, 예비비, 마일스톤 대비 계획 대 실적 추적을 포함한 프로젝트 예산 워크북 (한국어 버전)
locale: ko
industry:
  - finance
  - construction
profile:
  - project-manager
  - finance-analyst
  - pmo
sections:
  - title: 프로젝트 머리말
    prompt: >
      프로젝트명 및 코드, 스폰서와 프로젝트 관리자, 계획 기간과 종료일, 통화, 자금원, 그리고 워크북이 추적하는 기준이 되는 승인된 총예산을 식별하십시오. 한국어로 답해 주세요.
    required_sources:
      - type: local
        min: 1
  - title: 작업분류체계 및 원가 범주
    prompt: >
      프로젝트를 작업분류체계의 과업 또는 단계로 분할하십시오. 각각에 대해 원가 범주(인건비, 자재, 장비, 외주, 출장, 소프트웨어, 기타)와 담당 책임자를 기록하십시오. 한국어로 답해 주세요.
    output_format: table
  - title: 인건비 예산
    prompt: >
      역할별 계획 인건비를 상세히 기재하십시오: 시간, 혼합 단가, 비용입니다. 단계별로 집계하여 총 인건비 예산을 제시하십시오. 가동률 또는 외부 인력 대 내부 인력에 관한 가정이 있으면 기재하십시오. 한국어로 답해 주세요.
    output_format: table
  - title: 비인건비 예산
    prompt: >
      비인건비 항목(자재, 장비, 라이선스, 외주, 출장)을 수량, 단가, 합계와 함께 상세히 기재하십시오. 알려진 경우 공급업체 또는 출처를 식별하십시오. 한국어로 답해 주세요.
    output_format: table
  - title: 예비비 및 적립금
    prompt: >
      예비비(비율 및 금액)와 경영 예비비를 그 규모 산정 근거와 함께 명시하십시오. 예비비를 사용할 수 있는 조건을 설명하십시오. 한국어로 답해 주세요.
  - title: 계획 대 실적 추적
    prompt: >
      실적용 열을 확보하십시오: 단계별 예산, 약정액, 실제 지출, 잔여, 차이(금액 및 %)입니다. 일정 대비 원가 성과를 계산하고 예산을 초과할 추세인 단계를 표시하십시오. 한국어로 답해 주세요.
    output_format: table
  - title: 예산 위험
    prompt: >
      예산을 변동시킬 수 있는 원가 위험(범위 변경, 가격 상승, 일정 지연, 환율 노출)을 식별하십시오. 각 위험에 대해 잠재적 영향과 팀이 모니터링할 완화책 또는 트리거를 제시하십시오. 한국어로 답해 주세요.
export:
  - markdown
  - csv
  - xlsx
