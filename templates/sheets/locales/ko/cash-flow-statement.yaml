id: cash-flow-statement-v1-ko
name: 현금흐름표
type: sheet
description: 영업활동, 투자활동, 재무활동에 따른 현금흐름표로, 현금 증감과 일치시키고 기초 및 기말 잔액과 연결합니다 (한국어 버전)
locale: ko
industry:
  - finance
profile:
  - cfo
  - controller
  - finance-analyst
sections:
  - title: 보고서 머리말
    prompt: >
      보고 대상 기업, 보고 기간(월, 분기 또는 연), 보고 통화,
      작성 기준(IFRS, 미국 회계기준 또는 현지 기준), 영업현금흐름
      산정 방법(직접법 또는 간접법), 그리고 수치의 출처가 되는 원천
      자료를 식별하십시오. 한국어로 답해 주세요.
    required_sources:
      - type: local
        min: 1
  - title: 영업활동
    prompt: >
      영업활동으로 인한 현금흐름을 작성하십시오. 간접법을 사용하는
      경우 당기순이익에서 출발하여 감가상각비와 무형자산상각비,
      주식기준보상, 이연법인세 및 기타 비현금 항목을 조정한 뒤,
      운전자본의 변동(매출채권, 재고자산, 선급비용, 매입채무,
      미지급비용, 이연수익)을 가감하십시오. 각 항목에 대해 당기
      금액과 전기 비교치를 제시하십시오. 한국어로 답해 주세요.
    output_format: table
  - title: 투자활동
    prompt: >
      투자활동에 사용되거나 투자활동으로부터 유입된 현금을
      열거하십시오: 자본적 지출, 유형자산의 취득과 처분, 기업의
      인수와 매각, 투자자산의 취득과 만기, 자본화된 소프트웨어
      등입니다. 각 항목에 대해 당기 및 비교 기간 금액을 제시
      하십시오. 한국어로 답해 주세요.
    output_format: table
  - title: 재무활동
    prompt: >
      재무활동으로 인한 현금을 열거하십시오: 차입금의 조달과 상환,
      자본의 발행과 자기주식 취득, 지급한 배당과 분배금, 리스 원금
      상환, 그리고 금융 수수료입니다. 각 항목에 대해 당기 및 비교
      기간 금액을 제시하십시오. 한국어로 답해 주세요.
    output_format: table
  - title: 순증감 및 조정
    prompt: >
      세 가지 활동 부문을 합산하여 현금의 순증감을 구하고, 기초
      현금 잔액을 더한 뒤 기말 현금 잔액이 재무상태표와 일치함을
      입증하십시오. 외화로 보유한 현금에 대한 환율 효과를
      조정하십시오. 한국어로 답해 주세요.
  - title: 잉여현금흐름 및 논평
    prompt: >
      잉여현금흐름(영업현금흐름에서 자본적 지출을 차감)과 현금전환
      비율(영업현금흐름을 당기순이익으로 나눈 값)을 계산하십시오.
      당기 현금 변동의 주요 동인을 논평하고 유동성 우려 사항이
      있으면 표시하십시오. 한국어로 답해 주세요.
export:
  - markdown
  - csv
  - xlsx
