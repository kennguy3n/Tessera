id: budget-v1-ko
name: 예산
type: sheet
description: 카테고리, 세부 항목, 실적 대비 계획 및 편차가 포함된 예산 스프레드시트 (한국어 버전)
locale: ko
sections:
  - title: 예산 요약
    prompt: >
      계획된 지출, 현재까지의 실제 지출 및 예상 편차를 포함하여
      총 예산의 개요를 제공하십시오. 한국어로 답변해 주십시오.
  - title: 카테고리
    prompt: >
      카테고리별(인건비, 인프라, 소프트웨어, 마케팅 등)로 예산을
      분류하고 계획 금액과 실제 금액을 포함하십시오. 한국어로 답변해 주십시오.
  - title: 세부 항목
    prompt: >
      각 카테고리 내의 개별 세부 항목을 상세히 설명하십시오.
      공급업체, 금액, 빈도 및 상태를 포함하십시오. 한국어로 답변해 주십시오.
  - title: 편차 분석
    prompt: >
      계획 지출과 실제 지출 간의 편차를 분석하십시오.
      중대한 편차와 시정 조치를 설명하십시오. 한국어로 답변해 주십시오.
  - title: 예측
    prompt: >
      해당 기간의 남은 지출을 예측하고 예산 위험을 표시하십시오.
      한국어로 답변해 주십시오.
export:
  - markdown
  - csv
