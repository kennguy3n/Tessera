id: kpi-dashboard-v1-ko
name: KPI 대시보드
type: sheet
description: 지표 정의, 목표치, 실적치, 추세, 그리고 재무·고객·운영·인력 관점의 RAG 상태를 포함한 경영진용 KPI 대시보드 (한국어 버전)
locale: ko
industry:
  - finance
profile:
  - executive
  - finance-analyst
  - operations-manager
sections:
  - title: 대시보드 머리말
    prompt: >
      조직 또는 사업부, 보고 기간과 주기(주간, 월간, 분기), 대시보드 책임자, 그리고 지표가 추출되는 기준 시스템을 식별하십시오. 한국어로 답해 주세요.
    required_sources:
      - type: local
        min: 1
  - title: 지표 정의
    prompt: >
      각 KPI에 대해 정확한 정의, 산식, 단위, 데이터 출처, 갱신 주기, 책임자를 문서화하십시오. 명확한 정의는 동일한 지표가 서로 다른 두 가지 방식으로 계산되는 것을 방지합니다. 한국어로 답해 주세요.
    output_format: table
  - title: 재무 지표
    prompt: >
      재무 KPI(매출, 매출총이익률, EBITDA, 현금, 현금 소진, 해당하는 경우 ARR 또는 수주액)를 목표, 실적, 전기, 차이, 그리고 적색·황색·녹색 상태와 함께 보고하십시오. 한국어로 답해 주세요.
    output_format: table
  - title: 고객 지표
    prompt: >
      고객 KPI(신규 고객, 이탈, 유지, 순매출 유지율, NPS, CAC, LTV)를 목표, 실적, 전기, 차이, 상태와 함께 보고하십시오. 한국어로 답해 주세요.
    output_format: table
  - title: 운영 지표
    prompt: >
      사업에 관련된 운영 KPI(처리량, 사이클 타임, 정시 납품, 가동률, 불량률, SLA 달성)를 목표, 실적, 전기, 상태와 함께 보고하십시오. 한국어로 답해 주세요.
    output_format: table
  - title: 인력 지표
    prompt: >
      인력 KPI(인원수, 공석, 충원 기간, 자발적 이직률, 몰입도)를 목표, 실적, 상태와 함께 보고하십시오. 한국어로 답해 주세요.
    output_format: table
  - title: 인사이트 및 조치
    prompt: >
      이번 기간의 수치가 말하는 바를 요약하십시오: 목표에서 가장 크게 벗어난 두세 개의 지표, 가능한 원인, 그리고 각 시정 조치의 담당자와 기한입니다. 한국어로 답해 주세요.
export:
  - markdown
  - csv
  - xlsx
