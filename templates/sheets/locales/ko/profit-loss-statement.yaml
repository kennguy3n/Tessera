id: profit-loss-statement-v1-ko
name: 손익계산서
type: sheet
description: 수익, 매출원가, 영업비용 및 각 보고 기간의 이익률을 포함한 손익계산서로, 예산 대비 차이도 함께 표시합니다 (한국어 버전)
locale: ko
industry:
  - finance
profile:
  - cfo
  - controller
  - finance-analyst
sections:
  - title: 계산서 머리말
    prompt: >
      보고 대상 기업, 보고 기간 및 비교 기간(당기, 전기, 연초부터
      현재까지), 표시 통화, 작성 기준, 그리고 수치의 출처가 되는
      원천 자료(총계정원장, 시산표)를 식별하십시오. 한국어로 답해
      주세요.
    required_sources:
      - type: local
        min: 1
  - title: 매출액
    prompt: >
      매출액을 사업 부문, 제품 또는 채널별로 분해하십시오. 당기,
      비교 기간, 예산에 대해 총매출, 반품 및 매출에누리, 순매출을
      제시하고 성장률과 예산 대비 차이를 함께 표시하십시오. 한국어로
      답해 주세요.
    output_format: table
  - title: 매출원가 및 매출총이익
    prompt: >
      판매된 재화 또는 용역의 원가(재료비, 직접노무비, 물류비 및
      기타 직접원가)를 상세히 기재하십시오. 각 기간 및 예산 대비
      매출총이익과 매출총이익률을 계산하십시오. 한국어로 답해 주세요.
    output_format: table
  - title: 영업비용
    prompt: >
      영업비용을 기능별(영업 및 마케팅, 연구개발, 일반관리)로
      열거하십시오. 각 항목을 당기, 비교 기간, 예산에 대해 제시하고
      차이 및 매출 대비 비용 비율을 함께 표시하십시오. 한국어로 답해
      주세요.
    output_format: table
  - title: 영업이익 및 EBITDA
    prompt: >
      영업이익(매출총이익에서 영업비용을 차감)을 계산한 뒤 감가상각비
      및 무형자산상각비를 가산하여 EBITDA를 제시하십시오. 각 기간의
      영업이익률과 EBITDA 마진을 표시하십시오. 한국어로 답해 주세요.
  - title: 당기순이익
    prompt: >
      영업이익에서 당기순이익으로 연결하십시오: 순이자, 기타 수익과
      비용, 법인세입니다. 세전이익, 유효세율, 그리고 순이익률과 함께
      당기순이익을 제시하십시오. 한국어로 답해 주세요.
  - title: 차이 분석 논평
    prompt: >
      전기 및 예산 대비 가장 중요한 차이를 설명하십시오. 각 차이를
      사업 동인(수량, 가격, 구성, 원가 상승, 일회성 항목)에 연결하고
      시정 조치가 있으면 기재하십시오. 한국어로 답해 주세요.
export:
  - markdown
  - csv
  - xlsx
