id: project-budget-v1-hi
name: परियोजना बजट
type: sheet
description: कार्य विभाजन संरचना, श्रम और गैर-श्रम लागत, आकस्मिकता, और मील के पत्थरों के सापेक्ष नियोजित बनाम वास्तविक ट्रैकिंग सहित परियोजना बजट कार्यपुस्तिका (हिंदी संस्करण)
locale: hi
industry:
  - finance
  - construction
profile:
  - project-manager
  - finance-analyst
  - pmo
sections:
  - title: परियोजना शीर्षक
    prompt: >
      परियोजना का नाम और कोड, प्रायोजक और परियोजना प्रबंधक, नियोजन
      अवधि और समाप्ति तिथि, मुद्रा, वित्तपोषण स्रोत, और वह अनुमोदित
      कुल बजट पहचानें जिसके सापेक्ष कार्यपुस्तिका ट्रैक कर रही है।
      हिंदी में उत्तर दें।
    required_sources:
      - type: local
        min: 1
  - title: कार्य विभाजन संरचना और लागत श्रेणियाँ
    prompt: >
      परियोजना को कार्य विभाजन संरचना के कार्यों या चरणों में विभाजित
      करें। प्रत्येक के लिए, लागत श्रेणी (श्रम, सामग्री, उपकरण,
      उपठेका, यात्रा, सॉफ़्टवेयर, अन्य) और उत्तरदायी स्वामी दर्ज करें।
      हिंदी में उत्तर दें।
    output_format: table
  - title: श्रम बजट
    prompt: >
      भूमिका के अनुसार नियोजित श्रम का विवरण दें: घंटे, मिश्रित दर
      और लागत। चरण के अनुसार समेकित करें और कुल श्रम बजट दिखाएँ।
      उपयोग दर या ठेकेदार बनाम आंतरिक कर्मचारियों के बारे में किसी भी
      धारणा को नोट करें। हिंदी में उत्तर दें।
    output_format: table
  - title: गैर-श्रम बजट
    prompt: >
      गैर-श्रम मदों (सामग्री, उपकरण, लाइसेंस, उपठेके, यात्रा) का
      मात्रा, इकाई लागत और कुल के साथ विवरण दें। ज्ञात होने पर विक्रेता
      या स्रोत की पहचान करें। हिंदी में उत्तर दें।
    output_format: table
  - title: आकस्मिकता और आरक्षित निधि
    prompt: >
      आकस्मिकता आरक्षित (प्रतिशत और राशि) और प्रबंधन आरक्षित को उनके
      आकार-निर्धारण के औचित्य सहित बताएँ। उन परिस्थितियों की व्याख्या
      करें जिनके अंतर्गत आकस्मिकता का उपयोग किया जा सकता है। हिंदी में
      उत्तर दें।
  - title: नियोजित बनाम वास्तविक ट्रैकिंग
    prompt: >
      वास्तविक मानों के लिए कॉलम आरक्षित रखें: प्रत्येक चरण के लिए
      बजट, प्रतिबद्ध, वास्तविक व्यय, शेष, और विचलन (राशि और %)।
      अनुसूची के सापेक्ष लागत निष्पादन की गणना करें और बजट से अधिक होने
      की प्रवृत्ति वाले किसी भी चरण को चिह्नित करें। हिंदी में उत्तर
      दें।
    output_format: table
  - title: बजट जोखिम
    prompt: >
      उन लागत जोखिमों की पहचान करें जो बजट को बदल सकते हैं (कार्यक्षेत्र
      परिवर्तन, मूल्य मुद्रास्फीति, अनुसूची विलंब, मुद्रा जोखिम)।
      प्रत्येक के लिए, संभावित प्रभाव और शमन या वह ट्रिगर जिसकी टीम
      निगरानी करेगी। हिंदी में उत्तर दें।
export:
  - markdown
  - csv
  - xlsx
