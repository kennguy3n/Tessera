id: kpi-dashboard-v1-hi
name: KPI डैशबोर्ड
type: sheet
description: कार्यकारी KPI डैशबोर्ड जिसमें मीट्रिक परिभाषाएँ, लक्ष्य, वास्तविक मान, रुझान, और वित्तीय, ग्राहक, परिचालन एवं कार्मिक दृष्टिकोणों में RAG स्थिति शामिल है (हिंदी संस्करण)
locale: hi
industry:
  - finance
profile:
  - executive
  - finance-analyst
  - operations-manager
sections:
  - title: डैशबोर्ड शीर्षक
    prompt: >
      संगठन या व्यवसाय इकाई, रिपोर्टिंग अवधि और आवृत्ति (साप्ताहिक,
      मासिक, त्रैमासिक), डैशबोर्ड के स्वामी, और जिन रिकॉर्ड प्रणालियों
      से मीट्रिक्स लिए जाते हैं उन्हें पहचानें। हिंदी में उत्तर दें।
    required_sources:
      - type: local
        min: 1
  - title: मीट्रिक परिभाषाएँ
    prompt: >
      प्रत्येक KPI के लिए सटीक परिभाषा, सूत्र, इकाई, डेटा स्रोत,
      रिफ्रेश आवृत्ति और स्वामी का दस्तावेज़ीकरण करें। स्पष्ट
      परिभाषाएँ एक ही मीट्रिक को दो अलग-अलग तरीकों से गणना किए जाने से
      रोकती हैं। हिंदी में उत्तर दें।
    output_format: table
  - title: वित्तीय मीट्रिक्स
    prompt: >
      वित्तीय KPI (राजस्व, सकल मार्जिन, EBITDA, नकदी, नकदी खपत, यथा
      लागू ARR या बुकिंग) को लक्ष्य, वास्तविक, पिछली अवधि, विचलन और
      लाल/पीली/हरी स्थिति के साथ रिपोर्ट करें। हिंदी में उत्तर दें।
    output_format: table
  - title: ग्राहक मीट्रिक्स
    prompt: >
      ग्राहक KPI (नए ग्राहक, चर्न, प्रतिधारण, शुद्ध राजस्व प्रतिधारण,
      NPS, CAC, LTV) को लक्ष्य, वास्तविक, पिछली अवधि, विचलन और स्थिति
      के साथ रिपोर्ट करें। हिंदी में उत्तर दें।
    output_format: table
  - title: परिचालन मीट्रिक्स
    prompt: >
      व्यवसाय के लिए प्रासंगिक परिचालन KPI (थ्रूपुट, चक्र समय, समय पर
      वितरण, उपयोग दर, दोष दर, SLA अनुपालन) को लक्ष्य, वास्तविक, पिछली
      अवधि और स्थिति के साथ रिपोर्ट करें। हिंदी में उत्तर दें।
    output_format: table
  - title: कार्मिक मीट्रिक्स
    prompt: >
      कार्मिक KPI (कर्मचारी संख्या, रिक्त पद, भरने में लगा समय,
      स्वैच्छिक छँटाई, संलग्नता) को लक्ष्य, वास्तविक और स्थिति के साथ
      रिपोर्ट करें। हिंदी में उत्तर दें।
    output_format: table
  - title: अंतर्दृष्टि और कार्रवाइयाँ
    prompt: >
      इस अवधि में आँकड़े क्या कहते हैं इसका सारांश दें: सबसे अधिक
      पटरी से उतरे दो या तीन मीट्रिक्स, संभावित कारक, और प्रत्येक की
      सुधारात्मक कार्रवाई का स्वामी एवं समय-सीमा। हिंदी में उत्तर दें।
export:
  - markdown
  - csv
  - xlsx
