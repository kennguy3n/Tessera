id: cash-flow-statement-v1-hi
name: नकदी प्रवाह विवरण
type: sheet
description: परिचालन, निवेश और वित्तपोषण गतिविधियों सहित नकदी प्रवाह विवरण, जो नकदी में परिवर्तन से मिलान किया गया है और प्रारंभिक एवं अंतिम शेष से जुड़ा है (हिंदी संस्करण)
locale: hi
industry:
  - finance
profile:
  - cfo
  - controller
  - finance-analyst
sections:
  - title: विवरण शीर्षक
    prompt: >
      इकाई, रिपोर्टिंग अवधि (माह, तिमाही या वर्ष), रिपोर्टिंग मुद्रा,
      तैयारी का आधार (IFRS, US GAAP या स्थानीय मानक), परिचालन नकदी
      प्रवाह की विधि (प्रत्यक्ष या अप्रत्यक्ष), और जिन स्रोत दस्तावेज़ों
      से आँकड़े लिए गए हैं उन्हें पहचानें। हिंदी में उत्तर दें।
    required_sources:
      - type: local
        min: 1
  - title: परिचालन गतिविधियाँ
    prompt: >
      परिचालन से नकदी प्रवाह तैयार करें। अप्रत्यक्ष विधि में शुद्ध लाभ
      से आरंभ करें और मूल्यह्रास एवं परिशोधन, शेयर-आधारित क्षतिपूर्ति,
      आस्थगित करों और अन्य गैर-नकद मदों के लिए समायोजन करें, फिर
      कार्यशील पूँजी में परिवर्तन (प्राप्य खाते, स्टॉक, अग्रिम भुगतान
      व्यय, देय खाते, उपचित देनदारियाँ, आस्थगित राजस्व) जोड़ें। प्रत्येक
      पंक्ति को उसके अवधि मूल्य और पिछली अवधि की तुलना के साथ दिखाएँ।
      हिंदी में उत्तर दें।
    output_format: table
  - title: निवेश गतिविधियाँ
    prompt: >
      निवेश गतिविधियों में प्रयुक्त या उनसे प्राप्त नकदी सूचीबद्ध करें:
      पूँजीगत व्यय, संपत्ति एवं उपकरण की खरीद और बिक्री, अधिग्रहण और
      विनिवेश, निवेशों की खरीद और परिपक्वता, तथा पूँजीकृत सॉफ़्टवेयर।
      प्रत्येक मद को अवधि और तुलनात्मक राशियों के साथ दिखाएँ। हिंदी में
      उत्तर दें।
    output_format: table
  - title: वित्तपोषण गतिविधियाँ
    prompt: >
      वित्तपोषण गतिविधियों से नकदी सूचीबद्ध करें: ऋण की प्राप्ति और
      चुकौती, इक्विटी का निर्गमन और पुनर्खरीद, भुगतान किए गए लाभांश और
      वितरण, पट्टा मूलधन भुगतान, तथा वित्तपोषण शुल्क। प्रत्येक मद को
      अवधि और तुलनात्मक राशियों के साथ दिखाएँ। हिंदी में उत्तर दें।
    output_format: table
  - title: शुद्ध परिवर्तन और मिलान
    prompt: >
      तीनों गतिविधि अनुभागों को जोड़कर नकदी में शुद्ध परिवर्तन निकालें,
      प्रारंभिक नकदी शेष जोड़ें, और सिद्ध करें कि अंतिम नकदी शेष तुलन
      पत्र से मेल खाता है। अन्य मुद्राओं में रखी नकदी पर विनिमय दर के
      किसी भी प्रभाव का मिलान करें। हिंदी में उत्तर दें।
  - title: मुक्त नकदी प्रवाह और टिप्पणी
    prompt: >
      मुक्त नकदी प्रवाह (परिचालन नकदी प्रवाह में से पूँजीगत व्यय घटाकर)
      और नकदी रूपांतरण अनुपात (परिचालन नकदी प्रवाह को शुद्ध लाभ से
      भाग देकर) की गणना करें। अवधि के नकदी संचलन के प्रमुख कारकों पर
      टिप्पणी करें और किसी भी तरलता संबंधी चिंता को चिह्नित करें।
      हिंदी में उत्तर दें।
export:
  - markdown
  - csv
  - xlsx
