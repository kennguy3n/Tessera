id: profit-loss-statement-v1-hi
name: लाभ-हानि विवरण
type: sheet
description: राजस्व, बिक्री की लागत, परिचालन व्यय और विभिन्न रिपोर्टिंग अवधियों में मार्जिन सहित लाभ-हानि (आय) विवरण, बजट से विचलन के साथ (हिंदी संस्करण)
locale: hi
industry:
  - finance
profile:
  - cfo
  - controller
  - finance-analyst
sections:
  - title: विवरण शीर्षक
    prompt: >
      इकाई, रिपोर्टिंग अवधि और तुलनात्मक अवधियाँ (वर्तमान अवधि, पिछली
      अवधि, वर्ष-दर-तिथि), मुद्रा, तैयारी का आधार, और जिन स्रोत
      दस्तावेज़ों (सामान्य खाता-बही, परीक्षण शेष) से आँकड़े लिए गए हैं
      उन्हें पहचानें। हिंदी में उत्तर दें।
    required_sources:
      - type: local
        min: 1
  - title: राजस्व
    prompt: >
      राजस्व को व्यवसाय-रेखा, उत्पाद या चैनल के अनुसार विभाजित करें।
      वर्तमान अवधि, तुलनात्मक अवधि और बजट के लिए सकल राजस्व, वापसी एवं
      छूट और शुद्ध राजस्व दिखाएँ, साथ ही वृद्धि प्रतिशत और बजट से
      विचलन भी। हिंदी में उत्तर दें।
    output_format: table
  - title: बिक्री की लागत और सकल लाभ
    prompt: >
      बेचे गए माल या सेवाओं की लागत (सामग्री, प्रत्यक्ष श्रम, पूर्ति
      और अन्य प्रत्यक्ष लागतें) का विवरण दें। प्रत्येक अवधि के लिए और
      बजट की तुलना में सकल लाभ और सकल मार्जिन प्रतिशत की गणना करें।
      हिंदी में उत्तर दें।
    output_format: table
  - title: परिचालन व्यय
    prompt: >
      परिचालन व्यय को कार्य के अनुसार सूचीबद्ध करें (बिक्री एवं
      विपणन, अनुसंधान एवं विकास, सामान्य एवं प्रशासनिक)। प्रत्येक
      श्रेणी को वर्तमान अवधि, तुलनात्मक और बजट के लिए दिखाएँ, साथ ही
      विचलन और राजस्व के प्रतिशत के रूप में व्यय भी। हिंदी में उत्तर
      दें।
    output_format: table
  - title: परिचालन आय और EBITDA
    prompt: >
      परिचालन आय (सकल लाभ में से परिचालन व्यय घटाकर) की गणना करें,
      फिर EBITDA दिखाने के लिए मूल्यह्रास एवं परिशोधन वापस जोड़ें।
      प्रत्येक अवधि के लिए परिचालन मार्जिन और EBITDA मार्जिन प्रस्तुत
      करें। हिंदी में उत्तर दें।
  - title: शुद्ध आय
    prompt: >
      परिचालन आय से शुद्ध आय तक पहुँचें: शुद्ध ब्याज, अन्य आय और व्यय,
      और आयकर। कर-पूर्व आय, प्रभावी कर दर, और शुद्ध मार्जिन सहित शुद्ध
      आय दिखाएँ। हिंदी में उत्तर दें।
  - title: विचलन टिप्पणी
    prompt: >
      पिछली अवधि और बजट की तुलना में सबसे महत्वपूर्ण विचलनों को समझाएँ।
      प्रत्येक विचलन को किसी व्यावसायिक कारक (मात्रा, मूल्य, मिश्रण,
      लागत मुद्रास्फीति, एकमुश्त मदें) से जोड़ें और किसी भी सुधारात्मक
      कार्रवाई को नोट करें। हिंदी में उत्तर दें।
export:
  - markdown
  - csv
  - xlsx
