id: sales-pipeline-v1-hi
name: बिक्री पाइपलाइन
type: sheet
description: चरण के अनुसार अवसरों, भारित पूर्वानुमान, गति और जीत-दर विश्लेषण सहित राजस्व पूर्वानुमान के लिए बिक्री पाइपलाइन ट्रैकर (हिंदी संस्करण)
locale: hi
industry:
  - retail
  - finance
profile:
  - sales-manager
  - account-executive
  - revenue-operations
sections:
  - title: पाइपलाइन शीर्षक
    prompt: >
      टीम या क्षेत्र, पूर्वानुमान अवधि, मुद्रा, बिक्री-चरणों की
      परिभाषाएँ और उनकी डिफ़ॉल्ट प्रायिकताएँ, और वह CRM पहचानें जिससे
      अवसर निर्यात किए जाते हैं। हिंदी में उत्तर दें।
    required_sources:
      - type: local
        min: 1
  - title: अवसर
    prompt: >
      प्रत्येक अवसर के लिए दर्ज करें: खाता, अवसर का नाम, स्वामी, चरण,
      सौदा राशि, अपेक्षित समापन तिथि, लीड स्रोत, और अगला कदम उसकी तिथि
      के साथ। हिंदी में उत्तर दें।
    output_format: table
  - title: भारित पूर्वानुमान
    prompt: >
      भारित मूल्य प्राप्त करने के लिए प्रत्येक सौदा राशि पर चरण
      प्रायिकता लागू करें, और अवधि के लिए प्रतिबद्ध, सर्वोत्तम-स्थिति
      और भारित-पाइपलाइन पूर्वानुमान को कोटा के सापेक्ष समेकित करें।
      हिंदी में उत्तर दें।
    output_format: table
  - title: चरण फ़नल और गति
    prompt: >
      चरण के अनुसार अवसरों की संख्या और मूल्य, प्रत्येक चरण में औसत
      दिन, और समग्र बिक्री-चक्र की लंबाई दिखाएँ। उन चरणों की पहचान
      करें जहाँ सौदे रुक जाते हैं। हिंदी में उत्तर दें।
    output_format: table
  - title: जीत दर और कवरेज
    prompt: >
      जीत दर, औसत सौदा आकार, और कोटा अंतर के सापेक्ष पाइपलाइन कवरेज
      अनुपात की गणना करें। चिह्नित करें कि लक्ष्य पूरा करने के लिए
      पर्याप्त पाइपलाइन है या नहीं। हिंदी में उत्तर दें।
  - title: जोखिम और कार्रवाइयाँ
    prompt: >
      सबसे बड़े जोखिमग्रस्त और फिसलते सौदों, उनके कारणों, और उन्हें आगे
      बढ़ाने या बंद करने हेतु कार्रवाइयों एवं स्वामियों को उजागर करें।
      हाल में कोई गतिविधि न होने वाले सौदों को नोट करें। हिंदी में
      उत्तर दें।
export:
  - markdown
  - csv
  - xlsx
