id: budget-v1-hi
name: बजट
type: sheet
description: श्रेणियों, लाइन आइटम, वास्तविक बनाम नियोजित और विचलन के साथ बजट स्प्रेडशीट (हिंदी संस्करण)
locale: hi
sections:
  - title: बजट सारांश
    prompt: >
      कुल बजट का अवलोकन प्रदान करें, जिसमें नियोजित व्यय, अब तक का
      वास्तविक व्यय और अनुमानित विचलन शामिल हैं। हिंदी में उत्तर दें।
  - title: श्रेणियाँ
    prompt: >
      श्रेणी (कर्मियों, बुनियादी ढांचे, सॉफ्टवेयर, मार्केटिंग, आदि) के
      अनुसार बजट को विभाजित करें, जिसमें नियोजित और वास्तविक राशि शामिल है।
      हिंदी में उत्तर दें।
  - title: लाइन आइटम
    prompt: >
      प्रत्येक श्रेणी के भीतर व्यक्तिगत लाइन आइटम का विवरण दें।
      विक्रेता, राशि, आवृत्ति और स्थिति शामिल करें। हिंदी में उत्तर दें।
  - title: विचलन विश्लेषण
    prompt: >
      नियोजित और वास्तविक व्यय के बीच विचलन का विश्लेषण करें।
      महत्वपूर्ण विचलनों और सुधारात्मक कार्रवाइयों की व्याख्या करें।
      हिंदी में उत्तर दें।
  - title: पूर्वानुमान
    prompt: >
      अवधि के लिए शेष व्यय का अनुमान लगाएं और किसी भी बजट जोखिम
      को चिह्नित करें। हिंदी में उत्तर दें।
export:
  - markdown
  - csv
