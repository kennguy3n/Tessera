id: sales-pipeline-v1-ar
name: مسار المبيعات
type: sheet
description: متتبع مسار المبيعات مع الفرص حسب المرحلة والتنبؤ المرجَّح والسرعة وتحليل معدل الفوز لأغراض التنبؤ بالإيرادات (النسخة العربية)
locale: ar
industry:
  - retail
  - finance
profile:
  - sales-manager
  - account-executive
  - revenue-operations
sections:
  - title: ترويسة المسار
    prompt: >
      حدد الفريق أو المنطقة، وفترة التنبؤ، والعملة، وتعريفات مراحل
      البيع واحتمالاتها الافتراضية، ونظام إدارة علاقات العملاء الذي
      تُصدَّر منه الفرص. أجب بالعربية.
    required_sources:
      - type: local
        min: 1
  - title: الفرص
    prompt: >
      لكل فرصة سجّل: الحساب، واسم الفرصة، والمالك، والمرحلة، وقيمة
      الصفقة، وتاريخ الإغلاق المتوقع، ومصدر العميل المحتمل، والخطوة
      التالية مع تاريخها. أجب بالعربية.
    output_format: table
  - title: التنبؤ المرجَّح
    prompt: >
      طبّق احتمال المرحلة على قيمة كل صفقة لإنتاج قيمة مرجَّحة، وجمّع
      التنبؤ الملتزَم به وأفضل الحالات ومسار المبيعات المرجَّح للفترة
      مقابل الحصة المستهدفة. أجب بالعربية.
    output_format: table
  - title: قمع المراحل والسرعة
    prompt: >
      اعرض عدد الفرص وقيمتها حسب المرحلة، ومتوسط الأيام في كل مرحلة،
      وطول دورة المبيعات الإجمالي. حدد المراحل التي تتعثر فيها الصفقات.
      أجب بالعربية.
    output_format: table
  - title: معدل الفوز والتغطية
    prompt: >
      احسب معدل الفوز ومتوسط حجم الصفقة ونسبة تغطية مسار المبيعات
      مقابل فجوة الحصة المستهدفة. أشر إلى ما إذا كان هناك مسار مبيعات
      كافٍ لتحقيق الرقم المستهدف. أجب بالعربية.
  - title: المخاطر والإجراءات
    prompt: >
      أبرز أكبر الصفقات المعرّضة للخطر والمتعثرة، والأسباب، والإجراءات
      والمسؤولين لدفعها أو إغلاقها. دوّن الصفقات التي ليس لها نشاط
      حديث. أجب بالعربية.
export:
  - markdown
  - csv
  - xlsx
