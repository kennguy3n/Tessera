id: kpi-dashboard-v1-ar
name: لوحة مؤشرات الأداء الرئيسية
type: sheet
description: لوحة مؤشرات أداء رئيسية للإدارة التنفيذية مع تعريفات المؤشرات والمستهدفات والقيم الفعلية والاتجاهات وحالة RAG عبر المنظور المالي والعملاء والتشغيلي والموارد البشرية (النسخة العربية)
locale: ar
industry:
  - finance
profile:
  - executive
  - finance-analyst
  - operations-manager
sections:
  - title: ترويسة اللوحة
    prompt: >
      حدد المؤسسة أو وحدة العمل، وفترة التقرير وتواتره (أسبوعي أو شهري
      أو ربع سنوي)، ومالك اللوحة، وأنظمة التسجيل التي تُستمد منها
      المؤشرات. أجب بالعربية.
    required_sources:
      - type: local
        min: 1
  - title: تعريفات المؤشرات
    prompt: >
      لكل مؤشر أداء رئيسي، وثّق التعريف الدقيق والصيغة والوحدة ومصدر
      البيانات وتواتر التحديث والمالك. التعريفات الواضحة تمنع احتساب
      المؤشر نفسه بطريقتين مختلفتين. أجب بالعربية.
    output_format: table
  - title: المؤشرات المالية
    prompt: >
      أبلغ عن المؤشرات المالية (الإيراد، هامش الربح الإجمالي، EBITDA،
      النقد، معدل استنزاف النقد، الإيراد السنوي المتكرر أو الحجوزات حسب
      الاقتضاء) مع المستهدف والقيمة الفعلية والفترة السابقة والانحراف
      وحالة أحمر/أصفر/أخضر. أجب بالعربية.
    output_format: table
  - title: مؤشرات العملاء
    prompt: >
      أبلغ عن مؤشرات العملاء (العملاء الجدد، معدل التسرب، الاحتفاظ،
      صافي الاحتفاظ بالإيراد، NPS، تكلفة اكتساب العميل، القيمة الدائمة
      للعميل) مع المستهدف والقيمة الفعلية والفترة السابقة والانحراف
      والحالة. أجب بالعربية.
    output_format: table
  - title: المؤشرات التشغيلية
    prompt: >
      أبلغ عن المؤشرات التشغيلية ذات الصلة بالنشاط (الإنتاجية، زمن
      الدورة، التسليم في الوقت المحدد، معدل الاستخدام، معدل العيوب،
      الالتزام باتفاقية مستوى الخدمة) مع المستهدف والقيمة الفعلية
      والفترة السابقة والحالة. أجب بالعربية.
    output_format: table
  - title: مؤشرات الموارد البشرية
    prompt: >
      أبلغ عن مؤشرات الموارد البشرية (عدد الموظفين، الوظائف الشاغرة،
      مدة شغل الوظيفة، معدل الاستقالة الطوعية، الاندماج الوظيفي) مع
      المستهدف والقيمة الفعلية والحالة. أجب بالعربية.
    output_format: table
  - title: الرؤى والإجراءات
    prompt: >
      لخّص ما تشير إليه الأرقام في هذه الفترة: المؤشران أو المؤشرات
      الثلاثة الأكثر انحرافاً عن المسار، والمحركات المحتملة، والمسؤول
      والموعد النهائي للإجراء التصحيحي لكل منها. أجب بالعربية.
export:
  - markdown
  - csv
  - xlsx
