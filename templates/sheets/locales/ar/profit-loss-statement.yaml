id: profit-loss-statement-v1-ar
name: قائمة الأرباح والخسائر
type: sheet
description: قائمة الدخل (الأرباح والخسائر) مع الإيرادات وتكلفة المبيعات والمصروفات التشغيلية والهوامش عبر فترات التقرير، مع الانحراف عن الموازنة (النسخة العربية)
locale: ar
industry:
  - finance
profile:
  - cfo
  - controller
  - finance-analyst
sections:
  - title: ترويسة القائمة
    prompt: >
      حدد المنشأة وفترة التقرير والفترات المقارنة (الفترة الحالية
      والفترة السابقة والمجمَّع منذ بداية السنة) والعملة وأساس الإعداد
      والمستندات المصدرية (دفتر الأستاذ العام وميزان المراجعة) التي
      اشتُقت منها الأرقام. أجب بالعربية.
    required_sources:
      - type: local
        min: 1
  - title: الإيرادات
    prompt: >
      حلّل الإيرادات حسب خط النشاط أو المنتج أو القناة. اعرض الإيراد
      الإجمالي والمردودات والمسموحات والإيراد الصافي للفترة الحالية
      والفترة المقارنة والموازنة، مع نسبة النمو والانحراف عن الموازنة.
      أجب بالعربية.
    output_format: table
  - title: تكلفة المبيعات ومجمل الربح
    prompt: >
      فصّل تكلفة البضائع أو الخدمات المباعة (المواد والعمالة المباشرة
      والتنفيذ والتكاليف المباشرة الأخرى). احسب مجمل الربح ونسبة هامش
      مجمل الربح لكل فترة ومقارنةً بالموازنة. أجب بالعربية.
    output_format: table
  - title: المصروفات التشغيلية
    prompt: >
      اذكر المصروفات التشغيلية حسب الوظيفة (المبيعات والتسويق، والبحث
      والتطوير، والمصروفات العامة والإدارية). اعرض كل فئة للفترة
      الحالية والمقارنة والموازنة، مع الانحرافات والمصروف كنسبة من
      الإيراد. أجب بالعربية.
    output_format: table
  - title: الدخل التشغيلي وEBITDA
    prompt: >
      احسب الدخل التشغيلي (مجمل الربح مطروحاً منه المصروفات التشغيلية)
      ثم أضف الإهلاك والإطفاء لإظهار EBITDA. اعرض هامش التشغيل وهامش
      EBITDA لكل فترة. أجب بالعربية.
  - title: صافي الدخل
    prompt: >
      انتقل من الدخل التشغيلي إلى صافي الدخل: صافي الفوائد، والإيرادات
      والمصروفات الأخرى، وضريبة الدخل. اعرض الدخل قبل الضريبة ومعدل
      الضريبة الفعلي وصافي الدخل مع صافي الهامش. أجب بالعربية.
  - title: تعليق على الانحرافات
    prompt: >
      اشرح أهم الانحرافات الجوهرية مقارنةً بالفترة السابقة وبالموازنة.
      اربط كل انحراف بمحرك من محركات النشاط (الحجم أو السعر أو المزيج
      أو تضخم التكاليف أو البنود غير المتكررة) وأشر إلى أي إجراء
      تصحيحي. أجب بالعربية.
export:
  - markdown
  - csv
  - xlsx
