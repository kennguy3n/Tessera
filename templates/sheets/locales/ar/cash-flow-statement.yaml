id: cash-flow-statement-v1-ar
name: قائمة التدفقات النقدية
type: sheet
description: قائمة التدفقات النقدية من الأنشطة التشغيلية والاستثمارية والتمويلية، مطابَقة مع التغير في النقد ومرتبطة بالأرصدة الافتتاحية والختامية (النسخة العربية)
locale: ar
industry:
  - finance
profile:
  - cfo
  - controller
  - finance-analyst
sections:
  - title: ترويسة القائمة
    prompt: >
      حدد المنشأة وفترة التقرير (شهر أو ربع أو سنة) وعملة العرض وأساس
      الإعداد (المعايير الدولية لإعداد التقارير المالية أو المبادئ
      المحاسبية الأمريكية أو المعايير المحلية) والطريقة المستخدمة
      للتدفق التشغيلي (المباشرة أو غير المباشرة) والمستندات المصدرية
      التي اشتُقت منها الأرقام. أجب بالعربية.
    required_sources:
      - type: local
        min: 1
  - title: الأنشطة التشغيلية
    prompt: >
      أعدّ التدفق النقدي من الأنشطة التشغيلية. عند استخدام الطريقة غير
      المباشرة، ابدأ من صافي الدخل وعدّل للإهلاك والإطفاء والمكافآت
      المبنية على الأسهم والضرائب المؤجلة والبنود غير النقدية الأخرى،
      ثم أضف التغيرات في رأس المال العامل (الذمم المدينة والمخزون
      والمصروفات المدفوعة مقدماً والذمم الدائنة والمصروفات المستحقة
      والإيرادات المؤجلة). اعرض كل بند بقيمته للفترة ومقارنته بالفترة
      السابقة. أجب بالعربية.
    output_format: table
  - title: الأنشطة الاستثمارية
    prompt: >
      اذكر النقد المستخدَم في الأنشطة الاستثمارية أو الناتج عنها:
      النفقات الرأسمالية، وشراء وبيع الممتلكات والمعدات، وعمليات
      الاستحواذ والتخارج، وشراء واستحقاق الاستثمارات، والبرمجيات
      المرسملة. اعرض كل بند بمبالغ الفترة والمقارنة. أجب بالعربية.
    output_format: table
  - title: الأنشطة التمويلية
    prompt: >
      اذكر النقد من الأنشطة التمويلية: متحصلات وسداد الديون، وإصدار
      وإعادة شراء حقوق الملكية، وتوزيعات الأرباح المدفوعة، وسداد أصل
      عقود الإيجار، ورسوم التمويل. اعرض كل بند بمبالغ الفترة
      والمقارنة. أجب بالعربية.
    output_format: table
  - title: صافي التغير والمطابقة
    prompt: >
      اجمع أقسام الأنشطة الثلاثة للوصول إلى صافي التغير في النقد، ثم
      أضف رصيد النقد الافتتاحي وأثبت أن رصيد النقد الختامي يتطابق مع
      قائمة المركز المالي. طابِق أي أثر لتغير أسعار الصرف على النقد
      المحتفظ به بعملات أخرى. أجب بالعربية.
  - title: التدفق النقدي الحر والتعليق
    prompt: >
      احسب التدفق النقدي الحر (التدفق النقدي التشغيلي مطروحاً منه
      النفقات الرأسمالية) ونسبة التحويل النقدي (التدفق النقدي التشغيلي
      مقسوماً على صافي الدخل). علّق على المحركات الرئيسية لحركة النقد
      خلال الفترة وأشر إلى أي مخاوف تتعلق بالسيولة. أجب بالعربية.
export:
  - markdown
  - csv
  - xlsx
