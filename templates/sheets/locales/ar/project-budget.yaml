id: project-budget-v1-ar
name: موازنة المشروع
type: sheet
description: مصنّف موازنة المشروع مع هيكل تجزئة العمل وتكاليف العمالة وغير العمالة والاحتياطي وتتبع المخطط مقابل الفعلي وفق المعالم الرئيسية (النسخة العربية)
locale: ar
industry:
  - finance
  - construction
profile:
  - project-manager
  - finance-analyst
  - pmo
sections:
  - title: ترويسة المشروع
    prompt: >
      حدد اسم المشروع ورمزه، والراعي ومدير المشروع، وفترة التخطيط
      وتاريخ الانتهاء، والعملة، ومصدر التمويل، والموازنة الإجمالية
      المعتمدة التي يجري التتبع مقابلها. أجب بالعربية.
    required_sources:
      - type: local
        min: 1
  - title: هيكل تجزئة العمل وفئات التكلفة
    prompt: >
      جزّئ المشروع إلى مهام أو مراحل ضمن هيكل تجزئة العمل. لكل منها،
      سجّل فئة التكلفة (العمالة، المواد، المعدات، المقاولة من الباطن،
      السفر، البرمجيات، أخرى) والمسؤول عنها. أجب بالعربية.
    output_format: table
  - title: موازنة العمالة
    prompt: >
      فصّل العمالة المخططة حسب الدور: الساعات والمعدل المختلط والتكلفة.
      اجمعها حسب المرحلة واعرض إجمالي موازنة العمالة. دوّن أي افتراضات
      حول معدل الاستخدام أو المتعاقدين مقابل الموظفين الداخليين. أجب
      بالعربية.
    output_format: table
  - title: موازنة غير العمالة
    prompt: >
      فصّل بنود غير العمالة (المواد، المعدات، التراخيص، عقود الباطن،
      السفر) مع الكمية وتكلفة الوحدة والإجمالي. حدد المورّد أو المصدر
      عند معرفته. أجب بالعربية.
    output_format: table
  - title: الاحتياطي والمخصصات
    prompt: >
      اذكر احتياطي الطوارئ (النسبة المئوية والمبلغ) واحتياطي الإدارة،
      مع مبررات تحديد حجمهما. اشرح الشروط التي يجوز بموجبها السحب من
      احتياطي الطوارئ. أجب بالعربية.
  - title: تتبع المخطط مقابل الفعلي
    prompt: >
      خصّص أعمدة للقيم الفعلية: الموازنة، والملتزَم به، والإنفاق
      الفعلي، والمتبقي، والانحراف (بالمبلغ وبالنسبة المئوية) لكل مرحلة.
      احسب أداء التكلفة مقابل الجدول الزمني وأشر إلى أي مرحلة تتجه نحو
      تجاوز الموازنة. أجب بالعربية.
    output_format: table
  - title: مخاطر الموازنة
    prompt: >
      حدد مخاطر التكلفة التي قد تغيّر الموازنة (تغير النطاق، تضخم
      الأسعار، انزلاق الجدول الزمني، التعرض لمخاطر العملة). لكل منها،
      الأثر المحتمل وإجراء التخفيف أو المؤشر الذي سيراقبه الفريق. أجب
      بالعربية.
export:
  - markdown
  - csv
  - xlsx
