id: budget-v1-ar
name: الميزانية
type: sheet
description: جدول بيانات الميزانية مع الفئات وبنود التفاصيل والفعلي مقابل المخطط والتباين (النسخة العربية)
locale: ar
sections:
  - title: ملخص الميزانية
    prompt: >
      قدم نظرة عامة على إجمالي الميزانية، بما في ذلك الإنفاق المخطط
      والإنفاق الفعلي حتى التاريخ والتباين المتوقع. أجب باللغة العربية.
  - title: الفئات
    prompt: >
      قسم الميزانية حسب الفئة (الموظفون، البنية التحتية، البرامج،
      التسويق، إلخ) مع المبالغ المخططة والفعلية. أجب باللغة العربية.
  - title: بنود التفاصيل
    prompt: >
      اعرض بالتفصيل البنود الفردية ضمن كل فئة.
      أدرج البائع والمبلغ والتكرار والحالة. أجب باللغة العربية.
  - title: تحليل التباين
    prompt: >
      حلل التباينات بين الإنفاق المخطط والفعلي.
      اشرح الانحرافات الكبيرة والإجراءات التصحيحية. أجب باللغة العربية.
  - title: التوقع
    prompt: >
      توقع الإنفاق المتبقي للفترة وأشر إلى أي مخاطر متعلقة
      بالميزانية. أجب باللغة العربية.
export:
  - markdown
  - csv
