id: cash-flow-statement-v1-zh
name: 现金流量表
type: sheet
description: 包含经营活动、投资活动和筹资活动的现金流量表，与现金变动相核对，并与期初和期末余额相衔接（中文版）
locale: zh
industry:
  - finance
profile:
  - cfo
  - controller
  - finance-analyst
sections:
  - title: 报表表头
    prompt: >
      确定主体、报告期间（月度、季度或年度）、列报货币、编制基础（国际财务报告准则、美国公认会计原则或当地准则）、经营现金流所采用的方法（直接法或间接法），以及数据来源的原始凭证。请用中文回答。
    required_sources:
      - type: local
        min: 1
  - title: 经营活动
    prompt: >
      编制经营活动产生的现金流量。采用间接法时，从净利润出发，调整折旧与摊销、股份支付、递延所得税及其他非现金项目，然后加减营运资本的变动（应收账款、存货、预付费用、应付账款、应计负债、递延收入）。列示每一行的本期金额及上期对比数。请用中文回答。
    output_format: table
  - title: 投资活动
    prompt: >
      列示投资活动所使用或产生的现金：资本性支出、固定资产的购置与处置、企业并购与剥离、投资的购买与到期，以及资本化软件。列示每个项目的本期及对比期金额。请用中文回答。
    output_format: table
  - title: 筹资活动
    prompt: >
      列示筹资活动产生的现金：债务的取得与偿还、权益的发行与回购、已付股利与分配、租赁本金的偿付以及筹资费用。列示每个项目的本期及对比期金额。请用中文回答。
    output_format: table
  - title: 净变动与勾稽
    prompt: >
      将三类活动汇总得出现金净变动，加上期初现金余额，并证明期末现金余额与资产负债表相衔接。对以外币持有现金的汇率影响进行核对。请用中文回答。
  - title: 自由现金流与评述
    prompt: >
      计算自由现金流（经营现金流减资本性支出）和现金转换比率（经营现金流除以净利润）。评述本期现金变动的主要驱动因素，并指出任何流动性方面的问题。请用中文回答。
export:
  - markdown
  - csv
  - xlsx
