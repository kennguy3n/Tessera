id: budget-v1-zh
name: 预算
type: sheet
description: 包含类别、明细项目、实际对比计划及差异分析的预算电子表格（中文版）
locale: zh
sections:
  - title: 预算概览
    prompt: >
      提供总预算的概述，包括计划支出、迄今为止的实际支出
      和预测差异。请用中文回答。
  - title: 类别
    prompt: >
      按类别（人员、基础设施、软件、营销等）分解预算，
      包括计划和实际金额。请用中文回答。
  - title: 明细项目
    prompt: >
      详细列出每个类别中的单个明细项目。
      包括供应商、金额、频率和状态。请用中文回答。
  - title: 差异分析
    prompt: >
      分析计划与实际支出之间的差异。
      解释重大偏差和纠正措施。请用中文回答。
  - title: 预测
    prompt: >
      预测期间内剩余支出并标记任何预算风险。请用中文回答。
export:
  - markdown
  - csv
