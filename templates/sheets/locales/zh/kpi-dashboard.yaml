id: kpi-dashboard-v1-zh
name: KPI仪表板
type: sheet
description: 面向高管的KPI仪表板，包含指标定义、目标值、实际值、趋势，以及财务、客户、运营和人员各维度的红黄绿状态（中文版）
locale: zh
industry:
  - finance
profile:
  - executive
  - finance-analyst
  - operations-manager
sections:
  - title: 仪表板表头
    prompt: >
      确定组织或业务单元、报告期间和报告频率（周度、月度、季度）、
      仪表板负责人，以及指标所提取的记录系统。请用中文回答。
    required_sources:
      - type: local
        min: 1
  - title: 指标定义
    prompt: >
      对每个KPI，记录其精确定义、计算公式、单位、数据来源、刷新频率
      和负责人。明确的定义可避免同一指标以两种不同方式计算。请用中文
      回答。
    output_format: table
  - title: 财务指标
    prompt: >
      报告财务KPI（收入、毛利率、EBITDA、现金、现金消耗、视情况而定
      的ARR或订单额），并附目标值、实际值、上期、差异以及红/黄/绿
      状态。请用中文回答。
    output_format: table
  - title: 客户指标
    prompt: >
      报告客户KPI（新增客户、流失、留存、净收入留存率、NPS、CAC、
      LTV），并附目标值、实际值、上期、差异和状态。请用中文回答。
    output_format: table
  - title: 运营指标
    prompt: >
      报告与业务相关的运营KPI（产出、周期时间、准时交付、利用率、
      缺陷率、SLA达成率），并附目标值、实际值、上期和状态。请用中文
      回答。
    output_format: table
  - title: 人员指标
    prompt: >
      报告人员KPI（员工人数、空缺职位、填补时间、主动离职率、敬业度），
      并附目标值、实际值和状态。请用中文回答。
    output_format: table
  - title: 洞察与行动
    prompt: >
      总结本期数据所反映的情况：偏离目标最严重的两到三项指标、可能的
      驱动因素，以及每项纠正措施的负责人和截止日期。请用中文回答。
export:
  - markdown
  - csv
  - xlsx
