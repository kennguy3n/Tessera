id: project-budget-v1-zh
name: 项目预算
type: sheet
description: 项目预算工作簿，包含工作分解结构、人工与非人工成本、应急储备，以及按里程碑进行的计划与实际跟踪（中文版）
locale: zh
industry:
  - finance
  - construction
profile:
  - project-manager
  - finance-analyst
  - pmo
sections:
  - title: 项目表头
    prompt: >
      确定项目名称和编号、发起人和项目经理、计划期间和结束日期、
      货币、资金来源，以及工作簿据以跟踪的已批准预算总额。请用中文
      回答。
    required_sources:
      - type: local
        min: 1
  - title: 工作分解结构与成本类别
    prompt: >
      将项目分解为工作分解结构的任务或阶段。对每一项，记录其成本
      类别（人工、材料、设备、分包、差旅、软件、其他）和责任人。
      请用中文回答。
    output_format: table
  - title: 人工预算
    prompt: >
      按角色详细列示计划人工：工时、综合费率和成本。按阶段汇总并
      列示人工预算总额。注明有关利用率或外包与内部员工的任何假设。
      请用中文回答。
    output_format: table
  - title: 非人工预算
    prompt: >
      详细列示非人工项目（材料、设备、许可证、分包、差旅），含数量、
      单价和总额。在已知情况下确定供应商或来源。请用中文回答。
    output_format: table
  - title: 应急储备与准备金
    prompt: >
      说明应急储备（百分比和金额）和管理储备，并附其规模设定的依据。
      解释可动用应急储备的条件。请用中文回答。
  - title: 计划与实际跟踪
    prompt: >
      为实际值预留列：按阶段列示预算、已承诺、实际支出、剩余和差异
      （金额和百分比）。计算相对于进度的成本绩效，并标记任何有超支
      趋势的阶段。请用中文回答。
    output_format: table
  - title: 预算风险
    prompt: >
      识别可能影响预算的成本风险（范围变更、价格上涨、进度延误、汇率
      敞口）。对每项风险，列出潜在影响以及团队将监控的缓解措施或触发
      条件。请用中文回答。
export:
  - markdown
  - csv
  - xlsx
