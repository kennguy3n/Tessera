id: budget-v1-ja
name: 予算
type: sheet
description: カテゴリ、ライン項目、計画対実績、差異分析を含む予算スプレッドシート（日本語版）
locale: ja
sections:
  - title: 予算概要
    prompt: >
      計画支出、現時点までの実績支出、予測差異を含む総予算の
      概要を提供してください。日本語で回答してください。
  - title: カテゴリ
    prompt: >
      カテゴリ別（人件費、インフラ、ソフトウェア、マーケティング等）に
      予算を分解し、計画額と実績額を含めてください。日本語で回答してください。
  - title: ライン項目
    prompt: >
      各カテゴリ内の個別ライン項目を詳述してください。ベンダー、金額、
      頻度、ステータスを含めてください。日本語で回答してください。
  - title: 差異分析
    prompt: >
      計画と実績支出の差異を分析してください。重大な乖離と是正措置を
      説明してください。日本語で回答してください。
  - title: 予測
    prompt: >
      期間内の残りの支出を予測し、予算リスクを示してください。
      日本語で回答してください。
export:
  - markdown
  - csv
