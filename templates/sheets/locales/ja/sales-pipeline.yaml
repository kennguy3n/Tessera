id: sales-pipeline-v1-ja
name: セールスパイプライン
type: sheet
description: ステージ別の商談、加重予測、ベロシティ、受注率分析を含む収益予測のためのセールスパイプライン管理表（日本語版）
locale: ja
industry:
  - retail
  - finance
profile:
  - sales-manager
  - account-executive
  - revenue-operations
sections:
  - title: パイプラインヘッダー
    prompt: >
      チームまたはテリトリー、予測期間、通貨、各営業ステージの定義とその既定の確率、そして商談のエクスポート元となるCRMを特定してください。日本語で回答してください。
    required_sources:
      - type: local
        min: 1
  - title: 商談
    prompt: >
      各商談について次を記録してください：取引先、商談名、担当者、ステージ、取引金額、予想クローズ日、リードソース、および次のアクションとその日付です。日本語で回答してください。
    output_format: table
  - title: 加重予測
    prompt: >
      各取引金額にステージ確率を適用して加重値を算出し、当期のコミット予測、ベストケース、加重パイプライン予測をノルマに対して集計してください。日本語で回答してください。
    output_format: table
  - title: ステージファネルとベロシティ
    prompt: >
      ステージ別の商談件数と金額、各ステージの平均滞留日数、および営業サイクル全体の長さを示してください。商談が停滞するステージを特定してください。日本語で回答してください。
    output_format: table
  - title: 受注率とカバレッジ
    prompt: >
      受注率、平均取引規模、そしてノルマ差に対するパイプラインカバレッジ比率を計算してください。目標達成に十分なパイプラインがあるかどうかを表示してください。日本語で回答してください。
  - title: リスクとアクション
    prompt: >
      リスクが最も高く失注しかけている大型商談、その理由、そして前進または成約させるためのアクションと担当者を強調してください。最近の活動がない商談を記載してください。日本語で回答してください。
export:
  - markdown
  - csv
  - xlsx
