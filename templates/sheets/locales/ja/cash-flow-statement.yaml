id: cash-flow-statement-v1-ja
name: キャッシュ・フロー計算書
type: sheet
description: 営業活動・投資活動・財務活動によるキャッシュ・フロー計算書。現金の増減と整合させ、期首残高および期末残高と結びつけます（日本語版）
locale: ja
industry:
  - finance
profile:
  - cfo
  - controller
  - finance-analyst
sections:
  - title: 計算書ヘッダー
    prompt: >
      対象の事業体、報告期間（月次・四半期・年次）、表示通貨、
      作成基準（IFRS、米国会計基準、または現地基準）、営業
      キャッシュ・フローの算定方法（直接法または間接法）、および
      数値の出典となる元資料を特定してください。日本語で回答して
      ください。
    required_sources:
      - type: local
        min: 1
  - title: 営業活動
    prompt: >
      営業活動によるキャッシュ・フローを作成してください。間接法
      の場合は当期純利益から出発し、減価償却費、株式報酬費用、
      繰延税金、その他の非資金項目を調整したうえで、運転資本の
      増減（売掛金、棚卸資産、前払費用、買掛金、未払費用、前受
      収益）を加減します。各項目について当期の金額と前期比較を
      示してください。日本語で回答してください。
    output_format: table
  - title: 投資活動
    prompt: >
      投資活動による資金の使途・源泉を列挙してください。設備投資、
      有形固定資産の取得・売却、企業の買収・売却、投資有価証券の
      取得・償還、ソフトウェアの資産計上などです。各項目について
      当期および比較期間の金額を示してください。日本語で回答して
      ください。
    output_format: table
  - title: 財務活動
    prompt: >
      財務活動による資金の流れを列挙してください。借入の調達・
      返済、資本の発行・自己株式取得、支払配当・分配、リース元本
      の返済、財務関連手数料などです。各項目について当期および
      比較期間の金額を示してください。日本語で回答してください。
    output_format: table
  - title: 純増減と調整
    prompt: >
      三つの活動区分を合算して現金の純増減を求め、期首現金残高を
      加えて、期末現金残高が貸借対照表と一致することを示して
      ください。外貨建て現金に係る為替変動の影響を調整して
      ください。日本語で回答してください。
  - title: フリー・キャッシュ・フローとコメント
    prompt: >
      フリー・キャッシュ・フロー（営業キャッシュ・フローから設備
      投資を差し引いた額）と現金転換比率（営業キャッシュ・フロー
      を当期純利益で除した値）を算出してください。当期の現金変動
      の主な要因を解説し、流動性に関する懸念があれば指摘して
      ください。日本語で回答してください。
export:
  - markdown
  - csv
  - xlsx
