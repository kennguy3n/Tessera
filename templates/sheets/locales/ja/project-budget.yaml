id: project-budget-v1-ja
name: プロジェクト予算
type: sheet
description: 作業分解構成、労務費および非労務費、予備費、マイルストーンに対する計画対実績の追跡を含むプロジェクト予算ワークブック（日本語版）
locale: ja
industry:
  - finance
  - construction
profile:
  - project-manager
  - finance-analyst
  - pmo
sections:
  - title: プロジェクトヘッダー
    prompt: >
      プロジェクト名およびコード、スポンサーとプロジェクトマネージャー、計画期間と終了日、通貨、資金源、そして追跡の基準となる承認済みの総予算を特定してください。日本語で回答してください。
    required_sources:
      - type: local
        min: 1
  - title: 作業分解構成とコスト区分
    prompt: >
      プロジェクトを作業分解構成のタスクまたはフェーズに分割してください。各項目について、コスト区分（労務、材料、設備、外注、出張、ソフトウェア、その他）と担当責任者を記録してください。日本語で回答してください。
    output_format: table
  - title: 労務予算
    prompt: >
      役割別に計画労務を明細化してください：工数、平均単価、コストです。フェーズ別に集計し、労務予算の総額を示してください。稼働率、または外部委託と社内要員に関する前提があれば記載してください。日本語で回答してください。
    output_format: table
  - title: 非労務予算
    prompt: >
      非労務の明細項目（材料、設備、ライセンス、外注、出張）を数量、単価、合計とともに明細化してください。判明している場合はベンダーまたは調達先を特定してください。日本語で回答してください。
    output_format: table
  - title: 予備費および引当
    prompt: >
      予備費（割合と金額）と経営予備費を、その規模設定の根拠とともに明記してください。予備費を取り崩すことができる条件を説明してください。日本語で回答してください。
  - title: 計画対実績の追跡
    prompt: >
      実績用の列を確保してください：フェーズ別の予算、確約額、実績支出、残額、差異（金額および％）です。スケジュールに対するコストパフォーマンスを計算し、予算超過の傾向があるフェーズを表示してください。日本語で回答してください。
    output_format: table
  - title: 予算リスク
    prompt: >
      予算を変動させ得るコストリスク（スコープ変更、価格インフレ、スケジュール遅延、為替エクスポージャー）を特定してください。各リスクについて、潜在的な影響と、チームが監視する低減策またはトリガーを示してください。日本語で回答してください。
export:
  - markdown
  - csv
  - xlsx
