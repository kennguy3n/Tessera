id: profit-loss-statement-v1-ja
name: 損益計算書
type: sheet
description: 収益、売上原価、営業費用、各報告期間の利益率を含む損益計算書で、予算との差異も示します（日本語版）
locale: ja
industry:
  - finance
profile:
  - cfo
  - controller
  - finance-analyst
sections:
  - title: 計算書ヘッダー
    prompt: >
      対象となる企業、報告期間および比較対象（当期、前期、年度累計）、
      表示通貨、作成基準、そして数値の出所となる原資料（総勘定元帳、
      試算表）を特定してください。日本語で回答してください。
    required_sources:
      - type: local
        min: 1
  - title: 売上高
    prompt: >
      売上高を事業区分、製品、またはチャネル別に分解してください。
      当期、比較期間、予算について、総売上高、返品および値引、純売上高
      を示し、成長率と予算差異を併記してください。日本語で回答して
      ください。
    output_format: table
  - title: 売上原価と売上総利益
    prompt: >
      売上原価（材料費、直接労務費、出荷費用、その他の直接費）を
      明細化してください。各期間および予算に対して売上総利益と売上総
      利益率を計算してください。日本語で回答してください。
    output_format: table
  - title: 営業費用
    prompt: >
      営業費用を機能別（販売およびマーケティング、研究開発、一般管理）
      に列挙してください。各カテゴリーを当期、比較期間、予算について
      示し、差異および売上高に対する費用比率を併記してください。
      日本語で回答してください。
    output_format: table
  - title: 営業利益とEBITDA
    prompt: >
      営業利益（売上総利益から営業費用を控除）を計算し、減価償却費を
      加算してEBITDAを示してください。各期間の営業利益率とEBITDA
      マージンを提示してください。日本語で回答してください。
  - title: 当期純利益
    prompt: >
      営業利益から当期純利益への橋渡しを行ってください：純支払利息、
      その他の収益および費用、法人税等です。税引前利益、実効税率、
      および純利益率とともに当期純利益を示してください。日本語で回答
      してください。
  - title: 差異に関する解説
    prompt: >
      前期および予算に対する最も重要な差異を説明してください。各差異を
      事業要因（数量、価格、構成、コストインフレ、一時的項目）に結び
      付け、是正措置があれば記載してください。日本語で回答してください。
export:
  - markdown
  - csv
  - xlsx
