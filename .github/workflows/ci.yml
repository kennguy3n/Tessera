name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: Rust — ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-13, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.86
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        if: matrix.os == 'ubuntu-22.04'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-targets

      - name: Test
        run: cargo test --all

  typescript:
    name: TypeScript — ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-13, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux native deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Workaround for npm/cli#4828: optional native deps in package-lock.json
      # are not always installed on platforms other than the one the lockfile
      # was generated on. Rollup ships per-platform native binaries as
      # optionalDependencies, so we explicitly install the host-matching one.
      - name: Install platform-specific Rollup binary (Windows)
        if: matrix.os == 'windows-2022'
        run: npm install --no-save --no-package-lock @rollup/rollup-win32-x64-msvc
      - name: Install platform-specific Rollup binary (macOS)
        if: matrix.os == 'macos-13'
        run: npm install --no-save --no-package-lock @rollup/rollup-darwin-x64

      - name: Lint
        run: npm run lint --workspace=apps/desktop

      - name: Type check
        run: npm run type-check --workspace=apps/desktop

      - name: Test
        run: npm run test --workspace=apps/desktop
